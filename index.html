mpo real. O padrao mais marcante e a recorrencia de clientes que ja tentaram as solucoes orientadas pelo bot e retornam ainda sem resolucao, escalando explicitamente para tecnico presencial ou atendente humano. A migracao Redelcom, embora com menor volume, contribui com casos onde o dispositivo permanece sem identidade Mercado Pago apos a transicao."}},"MLM":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Desconciliacao entre cobrado e recebido","examples":[{"id":"5509dd89-7ee0-4688-acbd-9013013cd68a","text":"El saldo no refleja en mi aplicacion. Y a mi cliente si se le desconto"},{"id":"6ea5306f-9319-4625-956a-58a5a4cf65fc","text":"Al cliente le descontaron el dinero pero a mi me aparece como no aprobado. No me soluciona yo ocupo mi dinero"},{"id":"2ad2d3f5-d358-488e-aacb-f96bb55e449a","text":"Hice un cobro a una tarjeta american express, al momento de cobrar cancelo el cobro, el cliente dice molesto que el ya pago y que no pagara de nuevo"}]},{"name":"Atraso ou ausencia de reembolso ao cliente final","examples":[{"id":"9d6ba3b9-e5ed-404c-b642-701d3cdc1eb3","text":"Aun no se refleja la devolucion a mi cliente"},{"id":"ced5d521-6096-45fd-a23c-101051c3d9c6","text":"Ya clienta mando estado de movimientos y no se refleja la devolucion y por consecuencia se niega a pagar."},{"id":"b8fdb234-6ba8-48d4-9ecb-eb91fe29a8c3","text":"Mi cliente no ha recibido el rembolso. Mi cliente me exige su dinero"}]},{"name":"Bot sem resolucao - atendimento que nao soluciona","examples":[{"id":"7d20bd59-04aa-402d-a495-11ce3540eb38","text":"Al final el asistente no resuelve la situacion"},{"id":"ea843de5-10e1-4dd3-b276-4a22503c0a52","text":"Que atiendan bien y no una maquina"},{"id":"cf40af8a-d44a-4a5c-9c0d-d6eebec826a3","text":"Solo me mandan a links y nadie me da respuesta de sus repartidos. No me dan solucion a mi diga"}]},{"name":"Acreditacao de saldo bloqueada ou sem deposito apos venda","examples":[{"id":"864337cb-6e03-4c83-8509-78a184b772c2","text":"Quisiera saber si ahora si me van a pagar. Vendi como aprendiz una terminal. Muy mala"},{"id":"517e04a0-1ca0-4a5d-826b-32c58f1fa3b4","text":"Por q no se refleja un cobro q hice por terminal ponit. no se refleja los 153"},{"id":"c1a843af-7b1d-4501-809b-911ab14b30a6","text":"No me caen los pagos de la terminal. No me caen tampoco las transferencias"}]}],"insight":"O principal eixo de dor neste L2 e a divergencia entre o que o banco do cliente registra e o que aparece na conta do vendedor. Os promotores ficam satisfeitos quando recebem uma explicacao clara sobre prazos e proximos passos, mostrando que a comunicacao proativa de prazo e o diferencial entre promotor e detrator. O bot e percebido como barreira: respostas genericas sem resolucao concreta agravam a frustracao."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Falha no vinculo ou ativacao da terminal na conta","examples":[{"id":"819b0a1c-6169-4e32-9eea-2b71dd71ad49","text":"no puedo vincular la point smart a mi cuenta de mercado pago. Muy mala"},{"id":"7e37dc1a-c58b-4414-ac63-09d5aedd47e5","text":"No se conecta. Como vincular la terminal point blue"},{"id":"dce5287c-989d-4b7f-8551-738432417a92","text":"No puedo vincular mi cuenta a mi nueva terminal. Cuanto tiempo va estar asi?"}]},{"name":"Terminais de representantes nao registradas no portal - perda de comissao","examples":[{"id":"26a33b81-d398-48d5-8263-adfec7950b63","text":"no vienen registradas en mi portal de representan. Asi no me va a pagar mis comisiones. Pesima nesesito que me marquen. No me contestan"},{"id":"7559c557-970e-4fa2-8485-d9b2fa86ae15","text":"Yo quiero ver los cobros que hizo un cliente al que le vendi una terminal Y los quiero ver en mi gestion de terminales"},{"id":"ea843de5-10e1-4dd3-b276-4a22503c0a52","text":"Vendi una terminal y al momento de hacer un cobro no se pudo. Que atiendan bien y no una maquina"}]},{"name":"Onboarding confuso - instrucoes insuficientes para configurar e usar","examples":[{"id":"de77557a-febf-4426-8269-13e4e14ab437","text":"Necesito configurar mi terminal de mercado de pago. En que parte esta la app de mi celular uso la camara para escanear el codigo qr. Muy mala"},{"id":"13a8e73f-dfef-484e-9bd6-83ae3d2b07bf","text":"Quiero activar el point mini, necesito que me guien como hacerlo. Ya esta configurada la bluetooth. Viene una tarjeta, yo quiero saber esa tarjeta como la uso"},{"id":"38cfd53c-267d-41ae-a77f-ed7ca748b428","text":"En que parte de la app puedo escanear el codigo del point air. Guiame paso a paso. Regular"}]},{"name":"Impossibilidade de adquirir terminal - bloqueios no processo de compra","examples":[{"id":"c5eb6c6b-89bc-49ed-ac89-322e27e9af30","text":"Como puedo comprar mi terminal. Muy mala. No me dieron solucion"},{"id":"cd8a46e4-01a7-4fc8-bdda-4f1676041f5c","text":"Me aparece un numero de cuenta para depositar de otros bancos y me dice que ese numero de cuenta no esta recibiendo pagos. Muy mala"},{"id":"a6aa1059-406a-4d61-b65c-9ccb5a668a92","text":"Soy representante de mercado pago. Quiero comprar mas terminales. Muy mala. No entiende lo que le pregunto"}]}],"insight":"A vinculacao da terminal a conta e o ponto de maior atrito: muitos usuarios novos travam no processo de ativacao por Bluetooth ou QR e o suporte bot nao oferece orientacao passo a passo suficiente. Para representantes, o problema central e a invisibilidade das terminais no portal de gestao, o que bloqueia o recebimento de comissoes e gera desconfianca no modelo de negocio."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Cobros recusados sem explicacao - bloqueio por controles de seguranca","examples":[{"id":"670b011b-add7-4cf8-9a04-2eb2ec1d9584","text":"No puedo cobrar con mi terminal ni con mi celular. Pago rechazado. Ya probe con 4 tarjetas diferentes de otros clientes y nada"},{"id":"8f2a16ee-59f7-43ad-9047-81e8b1dcb699","text":"Todas mis operaciones el dia de hoy an sido rechazadas. Cuales son los controles de seguridad. Todo los pagos con tap to pay se me an rechazado"},{"id":"667e300b-d035-4600-b23b-c2413c4de788","text":"Tuve muchos cobros rechazados hoy. El problema es que si pasaron con una terminal clip y no con la de mercado pago. La pregunta es si puedo seguir confiando en la terminal mercado pago"}]},{"name":"Incompatibilidade com tipos especificos de cartao (vales, bienestar)","examples":[{"id":"70f20769-7ad9-4a9b-b8eb-d536e42a34ef","text":"No esta aceptando cobros con tarjetas de vales, con ninguna. Aparece que no es posible hacer el cobro por que no es lo suficiente seguro"},{"id":"b4bf2b75-26c1-46cc-98a6-77d1b1ffc05c","text":"No me dejo cobrar y no me dice que protocolos no pasa. Ya cheque con el banco y dice que no hay ningun cobro rechazado. Muy mala"},{"id":"31dbe2fd-d4bf-4996-a5f3-e6c42f9a4f6f","text":"No puedo realizar dos cobros con la misma tarjeta. El pago es rechazado y me dise que intente con otra tarjeta"}]},{"name":"Tap to Pay - funcionalidade indisponivel ou dificil de ativar","examples":[{"id":"30d3fb76-eb1c-4637-933c-c6b867c283aa","text":"Cobrar con tap to pay. En iPhone cuando estara. Pregunte por el tap to pay y me dijo que en iPhone no estaba y ya lo active. Muy mala"},{"id":"8b6fbfd4-6f0a-4a20-b3e8-b4070c727add","text":"No se activo el tap to pay en mi iPhone y ya actualice la app. Regular"},{"id":"3f865f69-99a5-4799-81eb-d28833a2ca02","text":"Hola como activo tap to play. Regular. Pasos mas concretos, no es como lo indico"}]},{"name":"Comissoes e tarifas - informacao incorreta ou pratica divergente do prometido","examples":[{"id":"b0ab8538-c8d9-46a3-bb3c-5cbb19b0ae40","text":"ME DIJO LA SRITA EJECUTIVA QUE NO ME COBRARIAN COMISION X USO. NO TENGO NADA. Muy mala"},{"id":"c8fe35f3-f225-4c42-bb61-ef6a71419f66","text":"Dicen que los cobros no cumplen las normas de mercado pago. Podria cancelar mi point? Muy mala"},{"id":"550f5ad0-b1d5-4007-8d13-3181ceffa3a1","text":"Que beneficios tengo siendo representante point. Que beneficio tengo comprando terminales de mercado pago"}]}],"insight":"A recusa de cobranças sem causa clara e a dor mais critica: o vendedor perde a venda na hora, o cliente vai embora, e a mensagem de erro nao oferece qualquer acao corretiva. A comparacao direta com terminais concorrentes (Clip) evidencia que o problema e percebido como exclusivo da Mercado Pago, erodindo a fidelidade. O Tap to Pay no iPhone concentra frustracao dupla: usuarios que o ativam sozinhos apos o bot informar que nao estava disponivel sentem que o suporte esta desatualizado."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Terminal que nao liga ou nao carrega - falha critica de hardware","examples":[{"id":"e2328e85-ffc3-4c32-b548-3f7bd12366be","text":"mi terminal de pago no enciende. Muy mala. No prendio la terminal. Ya lo hice y no funciona"},{"id":"027a985b-b6f1-4c3a-867b-6311a15fba2a","text":"No prende y ya tiene mucho que esta cargado. Necesito que me lo devuelvan o si no pues porque yo estoy cobrando con la terminal y si lo ocupo"},{"id":"a109bc2a-0c6d-46da-bbdb-7dc9816cf731","text":"Bateria de mi terminal. No carga. No, sigue igual. Muy mala. Mi terminal no me la van a cambiar"}]},{"name":"Terminal nova com defeito - produto recebido ja sem funcionamento","examples":[{"id":"9da49d43-dce8-423e-bde8-a17721d0b87f","text":"Adquiri una terminal el 28 del mes pasado y ayer que la pondria en funcionamiento no enciende. Entonces mi dinero esta perdido? Debe tener una garantia"},{"id":"408e6f09-7c82-4c74-93ae-bf0a2511fd75","text":"Me llego la nueva terminal y me sigue apareciendo la leyenda de en este momento no podemos aceptar pagos con esta tarjeta. Necesito una terminal para hacer mis cobros"},{"id":"c9a8403c-fe7a-4872-b26c-df1eaeece02e","text":"Compre mi terminal Point smart 2, la cargue toda la noche y no enciende. No la puedo devolver?"}]},{"name":"Processo de RMA/substituicao sem solucao - suporte nao efetiva a troca","examples":[{"id":"ac9316d9-1100-4a2d-ad08-781235831ae2","text":"Mi terminal no prende quisiera que me la cambiaran. Ninguna ya la deje asi todo el dia y no responde. Muy mala"},{"id":"1f1114ca-e481-4531-96b9-7e2eb56c0ce2","text":"No enciende. Incluso lo dejamos toda la noche. Regular. No me dio indicaciones para el envio de la devolucion del paquete"},{"id":"96332c66-ab0c-49f7-8c1c-d2a17e020d6e","text":"Ya no enciende mi terminal punto de venta. No hubo ninguna reaccion. No puedo descargar la etiqueta para envio. No descarga nada."}]},{"name":"Terminal sem sinal ou travada - falhas de conectividade e software","examples":[{"id":"d7c5b4ae-f085-433a-802d-dbee3c63313b","text":"Mi terminal point air me sale que no tiene senal. Sigue mostrando que no tiene senal, aun con wifi. Es que la necesito para manana. Que tristeza tanta fe le tenia a la terminal. Muy mala"},{"id":"ff9aec8d-3932-4e57-a8b0-dd20f066b160","text":"No cobra, cuando me pagan con tarjetas extrangeras. No pasa ninguna, y en otras terminales si pasan y en la mia no. Muy mala"},{"id":"f717f104-3b77-46e4-98af-a03f52df1d39","text":"No puedo cobrar mi terminal, no me deja actualizar. No se actualiza y no puedo cobrar. Regular"}]}],"insight":"A falha de hardware mais frequente e a terminal que simplesmente nao liga, padrao presente em mais de 50% dos detratores do L2, e que imobiliza o negocio do comerciante de forma imediata. O problema e agravado quando se trata de terminal nova ou recem-substituida, pois o cliente espera que o produto de reposicao funcione e descobre que o defeito persiste. O processo de RMA e um segundo ponto critico: o suporte nao fornece as etiquetas de devolucao ou as instrucoes de envio, deixando-os sem terminal e sem saida."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Nao entrega - pedido marcado como entregue mas nao recebido","examples":[{"id":"0179d22b-fe97-4306-bb4b-a1ae478c8fab","text":"Hola Ise un pedido y se robaron mi paquete. Ya revise y aparece como entregado pero Ami no me entregaron nada. Me mandaron la foto junto con que me entregaron pero aun no me entregan nada. Muy mala"},{"id":"87307924-be34-45e1-8522-06676e2e2d9a","text":"Hola pedi una terminal y no me llego. Muy mala. Necesito que me resuelvan la entrega de mi terminal point"},{"id":"e44076a2-67a2-4936-914c-dd7735f2ced7","text":"Dejaron mi paquete en la direccion incorrecta. Nadie me da respuesta para la devolucion de paquete, el paquete lo aventaron a la basura sin mi consentimiento"}]},{"name":"Impossibilidade de alterar endereco de entrega apos compra","examples":[{"id":"7ae18460-0976-48ab-9494-26b55f041336","text":"La direccion es incorrecta. Muy mala. No pude cambiar la direccion de entrega"},{"id":"1dd427c3-573e-4320-bc97-c6d8bb672933","text":"Porque no se puede cambiar la direccion? Si no se puede no deberian tener la opcion como si si se pudiera"},{"id":"ec7ae00b-071c-4cbe-b83a-b3a5f3262cb6","text":"Mi domicilio de entrega de rollos esta mal. Quiero cambiarlo. No puedo cambiar mi direccion de entrega para mis rollos"}]},{"name":"Entrega de insumos (rolos de papel) sem suporte ou canal claro","examples":[{"id":"813a9098-dfda-462e-b399-f877c429d2d9","text":"Nesesito mas papel para imprimir. Point smart 2. Muy mala. Quiero papeles para mi maquina no me solucionan nada"},{"id":"be64101e-0614-466f-91e3-7d748254fc38","text":"Para hacer un pedido de rollos y ya no tengo, no se como hacerlo aqui en la opcion. Muy mala. Pero no puedo hacer el pedido me podras apoyar"},{"id":"57215179-f9da-40d6-8a72-423b524a9a09","text":"Necesito rollos de papel. Muy mala"}]},{"name":"Cancelamento e reembolso bloqueados ou sem resolucao pelo bot","examples":[{"id":"99b282f3-df88-44d6-b464-af4c6169b69a","text":"Como puedo cancelar la compra de una terminal. Q puedo hacer si no tiene la opcion de cancelar. Muy mala"},{"id":"d7f26b34-83b7-49b5-a32b-511a3d29dace","text":"Cancelar. Devolucion. Como reembolsar ya mi dinero. Muy mala"},{"id":"c339ad0e-5cf2-4ec9-a1b5-4d2f7e54a763","text":"Cancelar la compra. Muy mala"}]}],"insight":"A falha de entrega, especialmente quando o sistema marca o pedido como entregue mas o cliente afirma nao ter recebido, e o gatilho de maior insatisfacao. A impossibilidade de alterar o endereco de entrega apos a compra e uma limitacao estrutural que os proprios usuarios identificam como incoerencia do sistema. Os rollos de papel nao tem canal claro de reabastecimento. Os promotores conseguem resolver cancelamentos e rastreamentos quando o atendente humano age rapido."}}};

const CAT_COLORS = ['#2d6a4f','#1d3461','#e07a00','#7c3f9e','#1a7d8e'];

// ─────────────────────────────────────────────────────────────
//  PANEL FUNCTIONS
// ─────────────────────────────────────────────────────────────


// ── Weight distribution per category rank ────────────────────
function categoryWeights(n_cats, l2Key, siteKey) {
  // OUTROS MLC: use sub-L2 detractor-based weights
  if (l2Key === 'OUTROS' && siteKey === 'MLC') return [39, 31, 28, 15];
  // Default rank-based distribution (Claude orders by prevalence)
  const maps = {
    1: [100],
    2: [60, 40],
    3: [45, 35, 20],
    4: [38, 28, 22, 12],
    5: [32, 25, 20, 15, 8]
  };
  return maps[n_cats] || Array(n_cats).fill(Math.round(100 / n_cats));
}
function activeDrilldown() {
  return ACTIVE_PERIOD === 'mar_mai' ? DRILLDOWN_MAR_MAY : DRILLDOWN_ABR_MAI;
}
function openPanel(siteKey, l2Name) {
  const siteLabel = ACTIVE_DATA[siteKey] ? ACTIVE_DATA[siteKey].label : 'Cross-sites (todos)';
  const data = (activeDrilldown()[siteKey] || {})[l2Name];

  document.getElementById('panel-site-tag').textContent =
    siteLabel + (data
      ? ' · ' + data.n_detratores + ' det · ' + (data.n_promotores || 0) + ' pro analisados'
      : '');
  const displayName = l2Name === 'OUTROS' ? 'Outros L2s agrupados' : l2Name;
  document.getElementById('panel-l2-title').textContent = displayName;
  // Show grouped L2s list for OUTROS
  const l2SubEl = document.getElementById('panel-l2-sub');
  if (l2SubEl) {
    l2SubEl.textContent = (l2Name === 'OUTROS' && data && data.l2s_incluidos)
      ? data.l2s_incluidos.map(l => (SHORT_LABEL[l] || l)).join(' · ')
      : '';
    l2SubEl.style.display = (l2Name === 'OUTROS' && data && data.l2s_incluidos) ? 'block' : 'none';
  }

  const body = document.getElementById('panel-body');

  if (!data) {
    body.innerHTML = '<div class="panel-no-data">Análise não disponível para esta combinação.</div>';
  } else {
    let html = '<div class="panel-dores-title">Principais dores dos detratores</div>';
    const weights = categoryWeights(data.categories.length, l2Name,
      document.getElementById('site-select').value);
    data.categories.forEach((cat, i) => {
      const color = l2Color(l2Name);
      const pct   = weights[i] || Math.round(100 / data.categories.length);
      html += '<div class="panel-cat">';
      html += '<div class="panel-cat-name">';
      html += '<span class="panel-cat-dot" style="background:' + color + '"></span>';
      html += cat.name;
      html += '<span class="panel-cat-weight" style="background:' + color + '">~' + pct + '%</span>';
      html += '</div>';
      cat.examples.forEach(ex => {
        html += '<div class="panel-example">';
        html += '<div class="panel-example-id">' + ex.id + '</div>';
        html += '<div class="panel-example-text">&ldquo;' + ex.text + '&rdquo;</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    html += '<div class="panel-insight-block">';
    html += '<div class="panel-insight-label">Insight</div>';
    html += '<div class="panel-insight-text">' + data.insight + '</div>';
    html += '</div>';
    body.innerHTML = html;
  }

  document.getElementById('drilldown-panel').classList.add('open');
  document.getElementById('panel-backdrop').classList.add('open');
  body.scrollTop = 0;
}

function closePanel() {
  document.getElementById('drilldown-panel').classList.remove('open');
  document.getElementById('panel-backdrop').classList.remove('open');
}

// Initial render
updateView('TOTAL');

document.getElementById('site-select').addEventListener('change', function () {
  updateView(this.value);
});
</script>
