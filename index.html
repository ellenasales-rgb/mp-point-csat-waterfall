<!DOCTYPE html>
<html lang="pt-BR">

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      background: #f0f4f8;
      color: #1a1a2e;
      padding: 20px;
      min-width: 840px;
    }

    .page { max-width: 960px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      background: #fff;
      border-radius: 10px;
      padding: 18px 24px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .header-title {
      font-size: 15px;
      font-weight: 500;
      color: #333;
      line-height: 1.5;
    }
    .header-title .l2-name {
      font-weight: 700;
      color: #1a1a2e;
    }
    .csat-badge {
      display: inline-block;
      background: #fff3cd;
      color: #b45309;
      font-weight: 700;
      font-size: 15px;
      padding: 1px 9px;
      border-radius: 5px;
      border: 1px solid #fde68a;
      margin-left: 4px;
    }
    .header-sub {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    /* ── Chart ── */
    .chart-wrap {
      position: relative;
      height: 340px;
    }

    /* ── Chart footer stats ── */
    .chart-stats {
      display: flex;
      gap: 32px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .stat-value { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .stat-value.csat-color { color: #b45309; }
    .stat-value.gap-color  { color: #d93025; }

    /* ── Table section ── */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-meta {
      font-size: 13px;
      color: #555;
    }
    .table-meta strong { color: #3483fa; }

    .site-select {
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
      outline: none;
      transition: border-color .2s;
    }
    .site-select:hover { border-color: #3483fa; }
    .site-select:focus { border-color: #3483fa; box-shadow: 0 0 0 3px rgba(52,131,250,.1); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 2px solid #eee;
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody tr { border-bottom: 1px solid #f3f3f3; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f7f9fc; }
    tbody tr.top-row { background: #fffbeb; }
    tbody tr.top-row:hover { background: #fef3c7; }
    tbody td { padding: 9px 12px; vertical-align: middle; }
    tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }

    .l2-dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 7px;
      flex-shrink: 0;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    .csat-val { color: #b45309; font-weight: 600; }
    .gap-val  { color: #d93025; font-weight: 600; }
    .det-val  { color: #d93025; }
    .outros-row td { color: #888; }

    .validation {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: right;
    }
    .validation .ok { color: #16a34a; font-weight: 600; }
    .validation .warn { color: #d97706; font-weight: 600; }

    #drilldown-panel {
      position: fixed;
      top: 0; right: 0;
      width: 400px;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0,0,0,.12);
      z-index: 999;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
    }
    #drilldown-panel.open { transform: translateX(0); }

    .panel-head {
      display: flex;

      align-items: flex-start;

      border-bottom: 1px solid #eee;
      background: #f8fafc;
      flex-shrink: 0;

      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 4px;
    }

      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.3;
      max-width: 310px;
    }

      background: none;
      border: none;
      font-size: 20px;
      color: #999;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .panel-close-btn:hover { color: #333; }

      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }

    .panel-dores-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #888;
      margin-bottom: 14px;

    .panel-cat-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;

      align-items: center;

      border-radius: 50%;

      border-radius: 0 5px 5px 0;
      padding: 7px 10px;
      margin-bottom: 6px;

    .panel-example-id {
      font-size: 10px;
      color: #3483fa;
      font-family: monospace;
      margin-bottom: 3px;

    .panel-example-text {
      font-size: 12px;
      color: #444;
      line-height: 1.45;
      font-style: italic;

      margin-top: 20px;
      padding: 14px;
      background: #f0f7ff;
      border-radius: 8px;
      border-left: 4px solid #3483fa;

      color: #3483fa;

};
function l2Color(l2) { return L2_COLOR_MAP[l2] || '#9ca3af'; }

const OUTROS_COLOR   = '#9ca3af';
const CSAT_BAR_COLOR = '#b8cce4';
const C100_BAR_COLOR = '#d5e3f0';

const SHORT_LABEL = {
  'Point reader hardware faults and RMA':                                                 ['Reader hardware', '/ RMA'],
  'Point payment acceptance and usage (risk, methods, fees)':                            ['Pagamento /', 'aceitação'],
  'Shipments, deliveries, and returns for Point purchases and consumables':              ['Envios e', 'devoluções'],
  'Point account and entitlement management (linking, ownership, vouchers)':            ['Conta e', 'habilitação'],
  'In-person payment reconciliation and refunds (Point)':                               ['Conciliação /', 'reembolso'],
  'Cellular/SIM connectivity in Point devices':                                         ['Conectividade', 'SIM'],
  'Fiscal receipt/invoice service activation and configuration (SII and receipts)':    ['Nota fiscal', '/ SII'],

// ─────────────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────────────
function fmt(n, d = 1) {
  return Number(n).toFixed(d).replace('.', ',');
}
function fmtN(n) {
  return Number(n).toLocaleString('pt-BR');
}
function getShort(l2) {
  return SHORT_LABEL[l2] || l2.substring(0, 18);
}

// ─────────────────────────────────────────────────────────────
//  BUILD WATERFALL DATA FOR A GIVEN SITE
// ─────────────────────────────────────────────────────────────
function buildWaterfall(siteKey) {
  const d = ACTIVE_DATA[siteKey];
  const sorted = [...d.l2].sort((a, b) => b.gap_pp - a.gap_pp);
  const top    = sorted.slice(0, TOP_N);
  const rest   = sorted.slice(TOP_N);

  const outrosGap = rest.reduce((s, r) => s + r.gap_pp, 0);
  const outrosDet = rest.reduce((s, r) => s + r.detratores, 0);
  const outrosSrv = rest.reduce((s, r) => s + r.surveys, 0);

  // Build bar positions
  const labels  = [];
  const floats  = [];
  const bgClrs  = [];
  const gaps    = [];

  // CSAT bar
  labels.push(['CSAT', 'Abr-Mai/26']);
  floats.push([0, d.csat]);
  bgClrs.push(CSAT_BAR_COLOR);
  gaps.push(null);

  let cumul = d.csat;

  top.forEach((item, i) => {
    labels.push(getShort(item.l2));
    floats.push([cumul, cumul + item.gap_pp]);
    bgClrs.push(l2Color(item.l2));
    gaps.push(item.gap_pp);
    cumul += item.gap_pp;
  });

  if (outrosGap > 0.005) {
    labels.push('Outros');
    floats.push([cumul, cumul + outrosGap]);
    bgClrs.push(OUTROS_COLOR);
    gaps.push(outrosGap);
    cumul += outrosGap;
  }

  // 100% bar
  labels.push(['CSAT', '100%']);
  floats.push([0, 100]);
  bgClrs.push(C100_BAR_COLOR);
  gaps.push(null);

  const totalGap = 100 - d.csat;

  return { labels, floats, bgClrs, gaps, totalGap, top, outrosGap, outrosDet, outrosSrv, csat: d.csat, total_surveys: d.total_surveys, sorted };
}

// ─────────────────────────────────────────────────────────────
//  CHART.JS CUSTOM PLUGIN — annotations & arrow
// ─────────────────────────────────────────────────────────────
const waterfallPlugin = {
  id: 'waterfallAnnotation',
  afterDatasetsDraw(chart) {
    const { ctx, data, scales } = chart;
    const meta   = chart.getDatasetMeta(0);
    const yScale = scales.y;
    const wfData = chart._wfData;
    if (!wfData) return;

    ctx.save();

    meta.data.forEach((bar, i) => {
      const [bottom, top] = data.datasets[0].data[i];
      const x       = bar.x;
      const yTop    = yScale.getPixelForValue(top);
      const yBot    = yScale.getPixelForValue(bottom);
      const barMid  = (yTop + yBot) / 2;
      const isFirst = i === 0;
      const isLast  = i === meta.data.length - 1;

      if (isFirst) {
        // CSAT value inside bar
        const barH = Math.abs(yBot - yTop);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#3a5a80';
        ctx.font         = `bold ${barH > 36 ? 18 : 14}px sans-serif`;
        ctx.fillText(fmt(top) + '%', x, barMid);

      } else if (isLast) {
        // 100 inside bar
        const barH = Math.abs(yBot - yTop);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#7a9bbf';
        ctx.font         = `bold ${barH > 36 ? 18 : 14}px sans-serif`;
        ctx.fillText('100', x, barMid);

      } else {
        // Gap value badge above bar — colored box
        const gap  = top - bottom;
        const clr  = data.datasets[0].backgroundColor[i];
        const txt  = '−' + fmt(gap, 1);

        ctx.font = 'bold 11px sans-serif';
        const tw = ctx.measureText(txt).width;
        const bw = tw + 12;
        const bh = 18;
        const bx = x - bw / 2;
        const by = yTop - bh - 6;

        // Badge background
        ctx.fillStyle = clr;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 3);
        ctx.fill();

        // Badge text + arrow indicator
        ctx.fillStyle    = '#fff';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, x, by + bh / 2);

        // Seta ▶ na borda direita da barra — indica abertura do painel
        const barH   = Math.abs(yBot - yTop);
        const barMidY = (yTop + yBot) / 2;
        const rightX  = x + bar.width / 2;  // borda direita da barra
        const aSize   = Math.min(7, barH / 2 - 2);  // tamanho proporcional à altura

        if (aSize >= 3) {
          // Fundo pill translúcido à direita da borda
          const pillW = aSize * 2 + 10;
          const pillH = aSize * 2 + 6;
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.beginPath();
          ctx.roundRect(rightX - pillW - 3, barMidY - pillH / 2, pillW, pillH, pillH / 2);
          ctx.fill();

          // Triângulo ▶ branco
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          const ax = rightX - pillW / 2 - 3;  // centro horizontal do pill
          ctx.beginPath();
          ctx.moveTo(ax - aSize * 0.7, barMidY - aSize);
          ctx.lineTo(ax + aSize * 0.9, barMidY);
          ctx.lineTo(ax - aSize * 0.7, barMidY + aSize);
          ctx.closePath();
          ctx.fill();
        }
      }
    });

    // ── Total gap arrow line ──
    const firstBar  = meta.data[0];
    const lastBar   = meta.data[meta.data.length - 1];
    const [, csatV] = data.datasets[0].data[0];
    const totalGap  = wfData.totalGap;

    // Place the arrow line in the top padding area, well above the chart grid
    const yLine = chart.chartArea.top - 28;
    const x1    = firstBar.x;
    const x2    = lastBar.x;

    ctx.strokeStyle = '#d93025';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.lineCap     = 'round';

    // Vertical leg from CSAT top
    ctx.beginPath();
    ctx.moveTo(x1, yScale.getPixelForValue(csatV));
    ctx.lineTo(x1, yLine);
    ctx.stroke();

    // Horizontal top line
    ctx.beginPath();
    ctx.moveTo(x1, yLine);
    ctx.lineTo(x2, yLine);
    ctx.stroke();

    // Vertical leg to 100%
    ctx.beginPath();
    ctx.moveTo(x2, yLine);
    ctx.lineTo(x2, yScale.getPixelForValue(100));
    ctx.stroke();

    ctx.setLineDash([]);

    // Arrowheads
    const ah = 5;
    ctx.fillStyle = '#d93025';
    // Down arrow at x1
    ctx.beginPath();
    ctx.moveTo(x1, yScale.getPixelForValue(csatV));
    ctx.lineTo(x1 - ah, yScale.getPixelForValue(csatV) - ah * 1.6);
    ctx.lineTo(x1 + ah, yScale.getPixelForValue(csatV) - ah * 1.6);
    ctx.closePath();
    ctx.fill();
    // Down arrow at x2
    ctx.beginPath();
    ctx.moveTo(x2, yScale.getPixelForValue(100));
    ctx.lineTo(x2 - ah, yScale.getPixelForValue(100) - ah * 1.6);
    ctx.lineTo(x2 + ah, yScale.getPixelForValue(100) - ah * 1.6);
    ctx.closePath();
    ctx.fill();

    // Total gap label
    const midX = (x1 + x2) / 2;
    const txt  = '−' + fmt(totalGap, 1) + ' p.p.';
    ctx.font = 'bold 12px sans-serif';
    const tw = ctx.measureText(txt).width;

    // White pill background
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(midX - tw / 2 - 6, yLine - 14, tw + 12, 18, 4);
    ctx.fill();

    ctx.fillStyle    = '#d93025';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, midX, yLine - 5);

    ctx.restore();
  }
};

// Cursor pointer sobre barras clicáveis
const cursorPlugin = {
  id: 'cursorPointer',
  afterEvent(chart, args) {
    const evt  = args.event;
    const wf   = chart._wfData;
    if (!wf) return;
    const elements = chart.getElementsAtEventForMode(evt.native, 'nearest', { intersect: true }, true);
    if (elements.length) {
      const i = elements[0].index;
      const isFirst = i === 0;
      const isLast  = i === wf.floats.length - 1;
      const hasOutros = wf.outrosGap > 0.005;
      const outrosIdx = wf.floats.length - 2;
      const clickable = !isFirst && !isLast && !(hasOutros && i === outrosIdx);
      chart.canvas.style.cursor = clickable ? 'pointer' : 'default';
    } else {
      chart.canvas.style.cursor = 'default';
    }
  }
};

Chart.register(waterfallPlugin);
Chart.register(cursorPlugin);

// ─────────────────────────────────────────────────────────────
//  CHART INSTANCE
// ─────────────────────────────────────────────────────────────
let chart = null;

function renderChart(siteKey) {
  const wf = buildWaterfall(siteKey);

  if (chart) { chart.destroy(); chart = null; }

  const ctx = document.getElementById('wf-chart').getContext('2d');

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: wf.labels,
      datasets: [{
        data:            wf.floats,
        backgroundColor: wf.bgClrs,
        borderColor:     wf.bgClrs.map(c => c),
        borderWidth:     0,
        borderRadius:    3,
        borderSkipped:   false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 350 },
      onClick(event, elements) {
        if (!elements.length) return;
        const i       = elements[0].index;
        const isFirst = i === 0;
        const isLast  = i === wf.floats.length - 1;
        if (isFirst || isLast) return;
        const hasOutros  = wf.outrosGap > 0.005;
        const outrosIdx  = wf.floats.length - 2;
        if (hasOutros && i === outrosIdx) { closePanel(); return; }
        const siteKey = document.getElementById('site-select').value;
        const barRank = i - 1;
        if (barRank < wf.top.length) openPanel(siteKey, wf.top[barRank].l2);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return Array.isArray(wf.labels[i]) ? wf.labels[i].join(' ') : wf.labels[i];
            },
            label: (item) => {
              const [bot, top] = item.raw;
              const gap = top - bot;
              const isFirst = item.dataIndex === 0;
              const isLast  = item.dataIndex === wf.floats.length - 1;
              if (isFirst) return ` CSAT: ${fmt(top)}%`;
              if (isLast)  return ` Referência: 100%`;
              return ` Gap: −${fmt(gap, 2)} p.p.`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, color: '#555' }
        },
        y: {
          min: 0,
          max: 112,
          ticks: {
            stepSize: 20,
            callback: v => v <= 100 ? v + '%' : '',
            font: { size: 11 },
            color: '#888'
          },
          grid: { color: '#f0f0f0' }
        }
      },
      layout: { padding: { top: 72, left: 8, right: 8, bottom: 0 } }
    }
  });

  // Attach wfData for the plugin
  chart._wfData = wf;

  return wf;
}

// ─────────────────────────────────────────────────────────────
function getColorForL2(l2) { return l2Color(l2); }

function renderTable(siteKey, wf) {
  const sorted = wf.sorted;
  const top    = sorted.slice(0, TOP_N);
  const rest   = sorted.slice(TOP_N);

  // Aggregate "Outros" row
  const outrosSrv = rest.reduce((s, r) => s + r.surveys, 0);
  const outrosDet = rest.reduce((s, r) => s + r.detratores, 0);
  const outrosGap = rest.reduce((s, r) => s + r.gap_pp, 0);
  const outrosCsat = outrosSrv > 0
    ? (outrosSrv - outrosDet) / outrosSrv * 100
    : null;

  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = '';

  top.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (i === 0) tr.classList.add('top-row');
    tr.innerHTML = `
      <td>
        <span class="l2-dot" style="background:${l2Color(row.l2)}"></span>
        ${row.l2}
      </td>
      <td class="r">${fmtN(row.surveys)}</td>
      <td class="r"><span class="csat-val">${fmt(row.csat_pct)}%</span></td>
      <td class="r"><span class="gap-val">−${fmt(row.gap_pp, 2)}</span></td>
      <td class="r"><span class="det-val">${fmtN(row.detratores)}</span></td>
    `;
    tbody.appendChild(tr);
  });

  if (outrosSrv > 0) {
    const tr = document.createElement('tr');
    tr.classList.add('outros-row');
    tr.innerHTML = `
      <td>
        <span class="l2-dot" style="background:${OUTROS_COLOR}"></span>
        Outros (${rest.length} L2${rest.length > 1 ? 's' : ''})
      </td>
      <td class="r">${fmtN(outrosSrv)}</td>
      <td class="r"><span class="csat-val">${outrosCsat !== null ? fmt(outrosCsat) + '%' : '—'}</span></td>
      <td class="r"><span class="gap-val">${outrosGap > 0 ? '−' + fmt(outrosGap, 2) : '—'}</span></td>
      <td class="r"><span class="det-val">${fmtN(outrosDet)}</span></td>
    `;
    tbody.appendChild(tr);
  }
}

// ─────────────────────────────────────────────────────────────
//  RENDER TABLE META & VALIDATION
// ─────────────────────────────────────────────────────────────
function renderMeta(siteKey, wf) {
  const d       = ACTIVE_DATA[siteKey];
  const gapTot  = 100 - d.csat;
  const sumGaps = d.l2.reduce((s, r) => s + r.gap_pp, 0);
  const diff    = Math.abs(gapTot - sumGaps);
  const ok      = diff <= 0.1;

  document.getElementById('tbl-meta').innerHTML =
    `${d.label} · CSAT <strong>${fmt(d.csat)}%</strong> · Gap <strong>−${fmt(gapTot, 1)} p.p.</strong> · ${fmtN(d.total_surveys)} surveys`;

  document.getElementById('validation').innerHTML =
    `Validação: Σ gaps = ${fmt(sumGaps, 2)} pp · Esperado = ${fmt(gapTot, 2)} pp · Δ = ${fmt(diff, 3)} pp · ` +
    (ok
      ? `<span class="ok">✓ Reconciliação OK</span>`
      : `<span class="warn">⚠ Fora da tolerância (0,1 pp)</span>`);
}
