      min-width: 840px;
    }

    .page { max-width: 960px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      background: #fff;
      border-radius: 10px;
      padding: 18px 24px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .header-title {
      font-size: 15px;
      font-weight: 500;
      color: #333;
      line-height: 1.5;
    }
    .header-title .l2-name {
      font-weight: 700;
      color: #1a1a2e;
    }
    .csat-badge {
      display: inline-block;
      background: #fff3cd;
      color: #b45309;
      font-weight: 700;
      font-size: 15px;
      padding: 1px 9px;
      border-radius: 5px;
      border: 1px solid #fde68a;
      margin-left: 4px;
    }
    .header-sub {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    /* ── Chart ── */
    .chart-wrap {
      position: relative;
      height: 340px;
    }

    /* ── Chart footer stats ── */
    .chart-stats {
      display: flex;
      gap: 32px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .stat-value { font-size: 17px; font-weight: 700; color: #1a1a2e; }
    .stat-value.csat-color { color: #b45309; }
    .stat-value.gap-color  { color: #d93025; }

    /* ── Table section ── */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-meta {
      font-size: 13px;
      color: #555;
    }
    .table-meta strong { color: #3483fa; }

    .site-select {
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
      outline: none;
      transition: border-color .2s;
    }
    .site-select:hover { border-color: #3483fa; }
    .site-select:focus { border-color: #3483fa; box-shadow: 0 0 0 3px rgba(52,131,250,.1); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 2px solid #eee;
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody tr { border-bottom: 1px solid #f3f3f3; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f7f9fc; }
    tbody tr.top-row { background: #fffbeb; }
    tbody tr.top-row:hover { background: #fef3c7; }
    tbody td { padding: 9px 12px; vertical-align: middle; }
    tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }

    .l2-dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 7px;
      flex-shrink: 0;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    .csat-val { color: #b45309; font-weight: 600; }
    .gap-val  { color: #d93025; font-weight: 600; }
    .det-val  { color: #d93025; }
    .outros-row td { color: #888; }

    .validation {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: right;
    }
    .validation .ok { color: #16a34a; font-weight: 600; }
    .validation .warn { color: #d97706; font-weight: 600; }

    #drilldown-panel {
      position: fixed;
      top: 0; right: 0;
      width: 400px;
      height: 100vh;
      background: #fff;

      z-index: 999;

      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      overflow: hidden;

      color: #888;

      margin-bottom: 4px;

      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.3;

      font-size: 20px;
      color: #999;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;

      overflow-y: auto;
      padding: 16px 18px;
    }

    .panel-dores-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #888;
      margin-bottom: 14px;

      margin-bottom: 18px;
    }
    .panel-cat-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 10px;
      font-weight: 700;
      color: #fff;

      letter-spacing: .3px;

    .panel-cat-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;

const TOP_N = 5;

// Cores fixas por nome de L2 — independentes do site selecionado
const L2_COLOR_MAP = {
  'Point reader hardware faults and RMA':                                                '#2d6a4f',
  'Point payment acceptance and usage (risk, methods, fees)':                           '#1d3461',
  'Shipments, deliveries, and returns for Point purchases and consumables':             '#e07a00',

  'Cellular/SIM connectivity in Point devices':                                        '#c0392b',
  'Fiscal receipt/invoice service activation and configuration (SII and receipts)':   '#7f8c8d',
  'Redelcom/Smart POS operations and migration (Chile)':                              '#8e6b3e',
};
function l2Color(l2) { return L2_COLOR_MAP[l2] || '#9ca3af'; }

const OUTROS_COLOR   = '#9ca3af';
const CSAT_BAR_COLOR = '#b8cce4';
const C100_BAR_COLOR = '#d5e3f0';

const SHORT_LABEL = {
  'Point reader hardware faults and RMA':                                                 ['Reader hardware', '/ RMA'],
  'Point payment acceptance and usage (risk, methods, fees)':                            ['Pagamento /', 'aceitação'],
  'Shipments, deliveries, and returns for Point purchases and consumables':              ['Envios e', 'devoluções'],
  'Point account and entitlement management (linking, ownership, vouchers)':            ['Conta e', 'habilitação'],
  'In-person payment reconciliation and refunds (Point)':                               ['Conciliação /', 'reembolso'],
  'Cellular/SIM connectivity in Point devices':                                         ['Conectividade', 'SIM'],
  'Fiscal receipt/invoice service activation and configuration (SII and receipts)':    ['Nota fiscal', '/ SII'],
  'Redelcom/Smart POS operations and migration (Chile)':                               ['Redelcom /', 'Smart POS'],
  '(Sem L2)':  'Sem L2',
  'Otros':     'Otros',
};

// ─────────────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────────────
function fmt(n, d = 1) {
  return Number(n).toFixed(d).replace('.', ',');
}
function fmtN(n) {
  return Number(n).toLocaleString('pt-BR');
}
function getShort(l2) {
  return SHORT_LABEL[l2] || l2.substring(0, 18);
}

// ─────────────────────────────────────────────────────────────
//  BUILD WATERFALL DATA FOR A GIVEN SITE
// ─────────────────────────────────────────────────────────────
function buildWaterfall(siteKey) {
  const d = ACTIVE_DATA[siteKey];
  const sorted = [...d.l2].sort((a, b) => b.gap_pp - a.gap_pp);
  const top    = sorted.slice(0, TOP_N);
  const rest   = sorted.slice(TOP_N);

  const outrosGap = rest.reduce((s, r) => s + r.gap_pp, 0);
  const outrosDet = rest.reduce((s, r) => s + r.detratores, 0);
  const outrosSrv = rest.reduce((s, r) => s + r.surveys, 0);

  // Build bar positions
  const labels  = [];
  const floats  = [];
  const bgClrs  = [];
  const gaps    = [];

  // CSAT bar
  labels.push(['CSAT', 'Abr-Mai/26']);
  floats.push([0, d.csat]);
  bgClrs.push(CSAT_BAR_COLOR);
  gaps.push(null);

  let cumul = d.csat;

  top.forEach((item, i) => {
    labels.push(getShort(item.l2));
    floats.push([cumul, cumul + item.gap_pp]);
    bgClrs.push(l2Color(item.l2));
    gaps.push(item.gap_pp);
    cumul += item.gap_pp;
  });

  if (outrosGap > 0.005) {
    labels.push('Outros');
    floats.push([cumul, cumul + outrosGap]);
    bgClrs.push(OUTROS_COLOR);
    gaps.push(outrosGap);
    cumul += outrosGap;
  }

  // 100% bar
  labels.push(['CSAT', '100%']);
  floats.push([0, 100]);
  bgClrs.push(C100_BAR_COLOR);
  gaps.push(null);

  const totalGap = 100 - d.csat;

  return { labels, floats, bgClrs, gaps, totalGap, top, outrosGap, outrosDet, outrosSrv, csat: d.csat, total_surveys: d.total_surveys, sorted };
}

// ─────────────────────────────────────────────────────────────
//  CHART.JS CUSTOM PLUGIN — annotations & arrow
// ─────────────────────────────────────────────────────────────
const waterfallPlugin = {
  id: 'waterfallAnnotation',
  afterDatasetsDraw(chart) {
    const { ctx, data, scales } = chart;
    const meta   = chart.getDatasetMeta(0);
    const yScale = scales.y;
    const wfData = chart._wfData;
    if (!wfData) return;

    ctx.save();

    meta.data.forEach((bar, i) => {
      const [bottom, top] = data.datasets[0].data[i];
      const x       = bar.x;
      const yTop    = yScale.getPixelForValue(top);
      const yBot    = yScale.getPixelForValue(bottom);
      const barMid  = (yTop + yBot) / 2;
      const isFirst = i === 0;
      const isLast  = i === meta.data.length - 1;

      if (isFirst) {
        // CSAT value inside bar
        const barH = Math.abs(yBot - yTop);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#3a5a80';
        ctx.font         = `bold ${barH > 36 ? 18 : 14}px sans-serif`;
        ctx.fillText(fmt(top) + '%', x, barMid);

      } else if (isLast) {
        // 100 inside bar
        const barH = Math.abs(yBot - yTop);
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#7a9bbf';
        ctx.font         = `bold ${barH > 36 ? 18 : 14}px sans-serif`;
        ctx.fillText('100', x, barMid);

      } else {
        // Gap value badge above bar — colored box
        const gap  = top - bottom;
        const clr  = data.datasets[0].backgroundColor[i];
        const txt  = '−' + fmt(gap, 1);

        ctx.font = 'bold 11px sans-serif';
        const tw = ctx.measureText(txt).width;
        const bw = tw + 12;
        const bh = 18;
        const bx = x - bw / 2;
        const by = yTop - bh - 6;

        // Badge background
        ctx.fillStyle = clr;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 3);
        ctx.fill();

        // Badge text + arrow indicator
        ctx.fillStyle    = '#fff';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, x, by + bh / 2);

        // Seta ▶ na borda direita da barra — indica abertura do painel
        const barH   = Math.abs(yBot - yTop);
        const barMidY = (yTop + yBot) / 2;
        const rightX  = x + bar.width / 2;  // borda direita da barra
        const aSize   = Math.min(7, barH / 2 - 2);  // tamanho proporcional à altura

        if (aSize >= 3) {
          // Fundo pill translúcido à direita da borda
          const pillW = aSize * 2 + 10;
          const pillH = aSize * 2 + 6;
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.beginPath();
          ctx.roundRect(rightX - pillW - 3, barMidY - pillH / 2, pillW, pillH, pillH / 2);
          ctx.fill();

          // Triângulo ▶ branco
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          const ax = rightX - pillW / 2 - 3;  // centro horizontal do pill
          ctx.beginPath();
          ctx.moveTo(ax - aSize * 0.7, barMidY - aSize);
          ctx.lineTo(ax + aSize * 0.9, barMidY);
          ctx.lineTo(ax - aSize * 0.7, barMidY + aSize);
          ctx.closePath();
          ctx.fill();
        }
      }
    });

    // ── Total gap arrow line ──
    const firstBar  = meta.data[0];
    const lastBar   = meta.data[meta.data.length - 1];
    const [, csatV] = data.datasets[0].data[0];
    const totalGap  = wfData.totalGap;

    // Place the arrow line in the top padding area, well above the chart grid
    const yLine = chart.chartArea.top - 28;
    const x1    = firstBar.x;
    const x2    = lastBar.x;

    ctx.strokeStyle = '#d93025';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.lineCap     = 'round';

    // Vertical leg from CSAT top
    ctx.beginPath();
    ctx.moveTo(x1, yScale.getPixelForValue(csatV));
    ctx.lineTo(x1, yLine);
    ctx.stroke();

    // Horizontal top line
    ctx.beginPath();
    ctx.moveTo(x1, yLine);
    ctx.lineTo(x2, yLine);
    ctx.stroke();

    // Vertical leg to 100%
    ctx.beginPath();
    ctx.moveTo(x2, yLine);
    ctx.lineTo(x2, yScale.getPixelForValue(100));
    ctx.stroke();

    ctx.setLineDash([]);

    // Arrowheads
    const ah = 5;
    ctx.fillStyle = '#d93025';
    // Down arrow at x1
    ctx.beginPath();
    ctx.moveTo(x1, yScale.getPixelForValue(csatV));
    ctx.lineTo(x1 - ah, yScale.getPixelForValue(csatV) - ah * 1.6);
    ctx.lineTo(x1 + ah, yScale.getPixelForValue(csatV) - ah * 1.6);
    ctx.closePath();
    ctx.fill();
    // Down arrow at x2
    ctx.beginPath();
    ctx.moveTo(x2, yScale.getPixelForValue(100));
    ctx.lineTo(x2 - ah, yScale.getPixelForValue(100) - ah * 1.6);
    ctx.lineTo(x2 + ah, yScale.getPixelForValue(100) - ah * 1.6);
    ctx.closePath();
    ctx.fill();

    // Total gap label
    const midX = (x1 + x2) / 2;
    const txt  = '−' + fmt(totalGap, 1) + ' p.p.';
    ctx.font = 'bold 12px sans-serif';
    const tw = ctx.measureText(txt).width;

    // White pill background
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(midX - tw / 2 - 6, yLine - 14, tw + 12, 18, 4);
    ctx.fill();

    ctx.fillStyle    = '#d93025';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, midX, yLine - 5);

    ctx.restore();
  }
};

// Cursor pointer sobre barras clicáveis
const cursorPlugin = {
  id: 'cursorPointer',
  afterEvent(chart, args) {
    const evt  = args.event;
    const wf   = chart._wfData;
    if (!wf) return;
    const elements = chart.getElementsAtEventForMode(evt.native, 'nearest', { intersect: true }, true);
    if (elements.length) {
      const i = elements[0].index;
      const isFirst = i === 0;
      const isLast  = i === wf.floats.length - 1;
      const hasOutros = wf.outrosGap > 0.005;
      const outrosIdx = wf.floats.length - 2;
      const clickable = !isFirst && !isLast;  // Outros também é clicável agora
      chart.canvas.style.cursor = clickable ? 'pointer' : 'default';
    } else {
      chart.canvas.style.cursor = 'default';
    }
  }
};

Chart.register(waterfallPlugin);
Chart.register(cursorPlugin);

// ─────────────────────────────────────────────────────────────
//  CHART INSTANCE
// ─────────────────────────────────────────────────────────────
let chart = null;

function renderChart(siteKey) {
  const wf = buildWaterfall(siteKey);

  if (chart) { chart.destroy(); chart = null; }

  const ctx = document.getElementById('wf-chart').getContext('2d');

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: wf.labels,
      datasets: [{
        data:            wf.floats,
        backgroundColor: wf.bgClrs,
        borderColor:     wf.bgClrs.map(c => c),
        borderWidth:     0,
        borderRadius:    3,
        borderSkipped:   false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 350 },
      onClick(event, elements) {
        if (!elements.length) return;
        const i       = elements[0].index;
        const isFirst = i === 0;
        const isLast  = i === wf.floats.length - 1;
        if (isFirst || isLast) return;
        const hasOutros  = wf.outrosGap > 0.005;
        const outrosIdx  = wf.floats.length - 2;
        const siteKey = document.getElementById('site-select').value;
        if (hasOutros && i === outrosIdx) { openPanel(siteKey, 'OUTROS'); return; }
        const barRank = i - 1;
        if (barRank < wf.top.length) openPanel(siteKey, wf.top[barRank].l2);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return Array.isArray(wf.labels[i]) ? wf.labels[i].join(' ') : wf.labels[i];
            },
            label: (item) => {
              const [bot, top] = item.raw;
              const gap = top - bot;
              const isFirst = item.dataIndex === 0;
              const isLast  = item.dataIndex === wf.floats.length - 1;
              if (isFirst) return ` CSAT: ${fmt(top)}%`;
              if (isLast)  return ` Referência: 100%`;
              return ` Gap: −${fmt(gap, 2)} p.p.`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, color: '#555' }
        },
        y: {
          min: 0,
          max: 112,
          ticks: {
            stepSize: 20,
            callback: v => v <= 100 ? v + '%' : '',
            font: { size: 11 },
            color: '#888'
          },
          grid: { color: '#f0f0f0' }
        }
      },
      layout: { padding: { top: 72, left: 8, right: 8, bottom: 0 } }
    }
  });

  // Attach wfData for the plugin
  chart._wfData = wf;

  return wf;
}

function getColorForL2(l2) { return l2Color(l2); }

function renderTable(siteKey, wf) {
  const sorted = wf.sorted;
  const top    = sorted.slice(0, TOP_N);
  const rest   = sorted.slice(TOP_N);

  // Aggregate "Outros" row
  const outrosSrv = rest.reduce((s, r) => s + r.surveys, 0);
  const outrosDet = rest.reduce((s, r) => s + r.detratores, 0);
  const outrosGap = rest.reduce((s, r) => s + r.gap_pp, 0);
  const outrosCsat = outrosSrv > 0
    ? (outrosSrv - outrosDet) / outrosSrv * 100
    : null;

  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = '';

  top.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (i === 0) tr.classList.add('top-row');
    tr.innerHTML = `
      <td>
        <span class="l2-dot" style="background:${l2Color(row.l2)}"></span>
        ${row.l2}
      </td>
      <td class="r">${fmtN(row.surveys)}</td>
      <td class="r"><span class="csat-val">${fmt(row.csat_pct)}%</span></td>
      <td class="r"><span class="gap-val">−${fmt(row.gap_pp, 2)}</span></td>
      <td class="r"><span class="det-val">${fmtN(row.detratores)}</span></td>
    `;
    tbody.appendChild(tr);
  });

  if (outrosSrv > 0) {
    const tr = document.createElement('tr');
    tr.classList.add('outros-row');
    tr.innerHTML = `
      <td>
        <span class="l2-dot" style="background:${OUTROS_COLOR}"></span>
        Outros (${rest.length} L2${rest.length > 1 ? 's' : ''})
      </td>
      <td class="r">${fmtN(outrosSrv)}</td>
      <td class="r"><span class="csat-val">${outrosCsat !== null ? fmt(outrosCsat) + '%' : '—'}</span></td>
      <td class="r"><span class="gap-val">${outrosGap > 0 ? '−' + fmt(outrosGap, 2) : '—'}</span></td>
      <td class="r"><span class="det-val">${fmtN(outrosDet)}</span></td>
    `;
    tbody.appendChild(tr);
  }
}

  const gapTot  = 100 - d.csat;
  const sumGaps = d.l2.reduce((s, r) => s + r.gap_pp, 0);
  const diff    = Math.abs(gapTot - sumGaps);
  const ok      = diff <= 0.1;

  document.getElementById('tbl-meta').innerHTML =
    `${d.label} · CSAT <strong>${fmt(d.csat)}%</strong> · Gap <strong>−${fmt(gapTot, 1)} p.p.</strong> · ${fmtN(d.total_surveys)} surveys`;

  document.getElementById('validation').innerHTML =
    `Validação: Σ gaps = ${fmt(sumGaps, 2)} pp · Esperado = ${fmt(gapTot, 2)} pp · Δ = ${fmt(diff, 3)} pp · ` +
    (ok
      ? `<span class="ok">✓ Reconciliação OK</span>`
      : `<span class="warn">⚠ Fora da tolerância (0,1 pp)</span>`);
}

  const wf = renderChart(siteKey);
  renderHeader(siteKey, wf);
  renderTable(siteKey, wf);

}

const DRILLDOWN_ABR_MAI = {"TOTAL":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Venda processada mas saldo nao creditado","examples":[{"id":"5fdcba79-7617-4b1e-bccd-fb3a05a3c5ac","text":"Cobre un monto de $560 y en la tarjeta del cliente aparece que se ISO el pago y AMI no me aparece en mi app de mercado pago"},{"id":"edf91651-ba5e-4031-90fe-a9227b0b6e2c","text":"Fiz vendas e o dinheiro nao caiu na minha conta. Vou parar de usar essa maquina."},{"id":"1dcd446a-887c-4d7b-9c20-436b563e24a8","text":"Minha maquina mercado pago nao esta caindo os valores das minhas vendas. Nao esta saindo comprovante e nem registrando os valores de venda"}]},{"name":"Estorno ou devolucao nao concluido para o cliente","examples":[{"id":"abe7b124-625f-4ec4-8a83-578a69ab48b8","text":"Porque no ha recibido el rembolso el cliente? Como puedo asegurarle al cliente su dinero pues necesita hacer la compra?"},{"id":"c1d4bf8f-4e8a-488c-8f48-219a61fd4687","text":"Tengo un problema con una devolucion del 31 de marzo me dice mi cliente que aun no se le ha reflejado su rembolso"},{"id":"94fbc33a-4073-429c-a829-b852d65aa13d","text":"No se ve reflejado mi devolucion en mi tarjeta"}]},{"name":"Cobro duplicado ou divergencia de valores","examples":[{"id":"01444507-cd11-4efe-abeb-95d55a546e62","text":"A mi cliente le descontaron 4 veces y a mi solo me cayo dos veces. Por favor"},{"id":"c270b315-29dd-4cb2-a071-3cf6cdeaf7b4","text":"Cliente pagou 2x e so entrou 1x. O cliente me mostrou que aprovou porem a maquina desligou assim que aprovou e saiu da conta do cliente"},{"id":"1be5ae34-cf9f-484d-958f-6d8e2fc48957","text":"Quero uma correcao de vendas na maquininha. Aqui no extrato ta faltando 2.619. Nao tive minha questao resolvida"}]},{"name":"Impossibilidade de estorno parcial ou ausencia de comprovante","examples":[{"id":"000c5700-d5ce-4fda-b948-746051fba5e7","text":"Preciso fazer uma devolucao parcial. Na tela nao deixa editar. Quero fazer o estorno parcial, apenas."},{"id":"0c9c5d02-e11f-4774-bc60-2a33a1982eda","text":"Como imprimo el vale de devolucion. Necesito imprimir un vale de devolucion. No funciona"},{"id":"082904c8-1630-4fc5-a446-85ce3401bbad","text":"O Santander esta pedindo o numero do protocolo de estorno. O banco alega que nao houve estorno, a cliente nao sabe mais em quem confiar"}]}],"insight":"A principal dor nessa L2 e a falta de confiabilidade na conciliacao: o cliente efetua o pagamento, o dinheiro e debitado do comprador, mas o saldo nunca aparece na conta do vendedor. Paralelamente, os estornos iniciados nao chegam ao cliente final no prazo esperado, gerando dupla frustracao. Casos de cobracas duplicadas e a impossibilidade de realizar estornos parciais pelo app ampliam a sensacao de falta de controle sobre as transacoes. A ausencia de comprovantes e protocolos confiaveis impede que o lojista solucione disputas com bancos de terceiros, tornando o atendimento percebido como ineficaz."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":40,"n_promotores":23,"categories":[{"name":"Vinculacao e configuracao da maquininha com a conta","examples":[{"id":"dce5287c-989d-4b7f-8551-738432417a92","text":"Tengo una nueva terminal bancaria point Air y no puedo ingresar mi correo electronico. No puedo vincular mi cuenta a mi nueva terminal"},{"id":"7e37dc1a-c58b-4414-ac63-09d5aedd47e5","text":"Tengo problemas con mi dispositivo Point Blue. No se conecta. Como vincular la terminal point blue"},{"id":"71ad863c-2e29-4473-ae94-0eb27e794664","text":"Activar point. No conecta por Bluetooth"}]},{"name":"Acesso bloqueado ou senha esquecida na maquininha","examples":[{"id":"82247522-4cb1-4d92-8550-f7bde94d20f3","text":"Como faco para remover a senha da minha Point Smart? Muito ruim"},{"id":"632bb9b3-0acc-41b9-8940-7550d5f11734","text":"Escola adquiriu uma maquinista point pro 2 porem nao estamos conseguindo acesso a ela. Esta ativa com uma conta antiga que nao sabemos a senha. Perdemos a senha e o acesso"},{"id":"1fbf2539-5946-4d47-b450-89a937b8aacb","text":"Eu esqueci a senha do acesso da minha maquininha"}]},{"name":"Dificuldade para comprar maquininha ou acessar portal de revenda","examples":[{"id":"a3b37003-45ce-49c1-a6f5-e29687c8f1ae","text":"Como comprar maquininhas Point pelo Portal de Revenda?"},{"id":"5cce0eef-1121-4bab-a130-480d813c0d68","text":"Como comprar maquininhas Point pelo Portal de Revenda? Muito ruim. Quero ter maquininha"},{"id":"59bbc03a-4fbb-4f86-acc3-1c461663b872","text":"Me ofrecio un precio de mil pesos con un cupon y entro a Mercado Pago y no esta el cupon. Listo no lo compro entonces."}]},{"name":"Nao aceitacao de vouchers e vale-alimentacao","examples":[{"id":"02552fc0-a15a-4526-9e86-8939b3c6e409","text":"Eu nao consigo aceitar voucher nela de nem uma bandeira"},{"id":"ebd63326-13c7-4cc4-8722-50e9f5fd6682","text":"Yo tengo otro equipo de Point a nombre de mi marido que fallecio, no se podria MODIFICAR los datos porque esa cuenta la tengo que Cerrar."},{"id":"fb4aedf1-ef7b-423e-88ad-435d7941534a","text":"La maquina me pide todos los dias escanear el codigo QR cada vez que la prendo lo que es un problema por yo no siempre estoy presente para prenderla"}]}],"insight":"Nessa L2 concentram-se dificuldades relacionadas ao ciclo de vida da conta e da maquininha: desde o processo de compra (cupons que nao aparecem, portal de revenda inacessivel) ate a configuracao inicial (vincular via Bluetooth ou QR, ativar chip). A perda de senha da maquininha, especialmente quando a conta antiga nao esta mais acessivel, paralisa o negocio sem que o usuario encontre um caminho claro de recuperacao. A nao aceitacao de vouchers e vale-alimentacao cria friccao no momento do pagamento, afastando clientes. O padrao geral indica que o onboarding e a gestao de credenciais da Point carecem de fluxos de autoatendimento mais robustos e intuitivos."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":40,"n_promotores":24,"categories":[{"name":"Cobracas recusadas sem explicacao clara","examples":[{"id":"458aa0d4-0fb5-42fc-a7b0-068d7a93554f","text":"Hola no me funciona la maquina para cobrar. Rechaza el cobro. Aun no funciona he perdido ventas"},{"id":"392274ee-6bba-434d-a5da-44576c361f75","text":"Toda cobranca que faco da essa mensagem, trocamos varios cartoes, chega ser um incomodo e tenho que ser obrigado a usar outro aplicativo."},{"id":"945c09aa-1898-4e3d-b685-9b98fc32812a","text":"Todos os valores que eu estou passando alta na maquina de cartao esta sendo recusado. Perdi vendas hoje por esse motivo."}]},{"name":"Travamento e falha no Point Tap e celular como maquininha","examples":[{"id":"c5dfa0de-d1eb-4a4c-b90b-3de19445f808","text":"Estou tentando usar o point tap, mas nao sai do carregando. A cliente esta esperando faz uns 30min. Nao resolveu"},{"id":"d291de4a-1417-4dc8-aa70-f8ad9295e16a","text":"Nao to conseguindo receber no cartao. Fica carregando. Muito ruim"},{"id":"78375599-5490-43b4-891e-ea75681aabbc","text":"Estou com mesmo problema e nao consegui fazer minhas vendas. Ele trava antes. Ainda esta do mesmo jeito"}]},{"name":"Bloqueio por seguranca impedindo cobracas legitimas","examples":[{"id":"97b40b1d-f320-4fc0-abec-d6e015d4fb94","text":"Cartao nao passa, diz que este cartao nao passou pelo sistema de seguranca. Bloqueio de seguranca"},{"id":"5e21fbe0-3f92-4b99-99e2-9e7fbd94a547","text":"Por motivo de seguranca. Quando eu for fazer uma cobranca na maquineta aparece isso. Com todos os cartoes de clientes"},{"id":"aae4de19-54d9-4d7a-b22b-a4653647622b","text":"Nao estou conseguindo receber pagamento pelo tap com cartao do proprio mercado pago. Por que esta barrando os pagamentos? Mas meu cliente precisa fazer o pagamento com esse cartao"}]},{"name":"Nao aceitacao de tipos especificos de cartao","examples":[{"id":"70f20769-7ad9-4a9b-b8eb-d536e42a34ef","text":"No esta aceptando cobros con tarjetas de vales, con ninguna. Solamente pasa con tarjetas de vales, con las de debito y credito no pasa"},{"id":"31dbe2fd-d4bf-4996-a5f3-e6c42f9a4f6f","text":"No puedo realizar dos cobros con la misma tarjeta. Tengo clientes que pagan una vez y quieren comprar otra vez pero el pago es rechazado"},{"id":"b9722771-887e-49db-aa17-5a73cc01e882","text":"Con la tarjeta extranjera ya llevo 2 dias intentando cobrar y me sigue apareciendo lo mismo"}]}],"insight":"A insatisfacao nessa L2 gira em torno da imprevisibilidade dos pagamentos: cartoes com saldo disponivel sao recusados sem justificativa compreensivel, levando a perda direta de vendas e constrangimento perante o cliente. A funcionalidade Point Tap e celular como maquininha concentra travamentos e erros de processamento que deixam o lojista paralisado no momento do atendimento. O sistema de antifraude e percebido como excessivamente restritivo, bloqueando transacoes legitimas inclusive com cartoes do proprio Mercado Pago. A falta de suporte a certos tipos de cartao restringe o universo de clientes atendidos e gera migracao para concorrentes."},"Point reader hardware faults and RMA":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Maquininha nao liga ou nao carrega","examples":[{"id":"14b51114-9cfe-4992-9666-d052909c9a3c","text":"Mi maquina no carga, indica que las baterias estan mala. Estuvo cargando toda la noche y aparecio sin carga. Necesito cambio de equipo o reemplazar las baterias"},{"id":"dfcd8fa1-84fd-4f5e-a69c-57e5fc93a5bb","text":"No funciona mi point smart. No enciende ni carga. Deje enchilado y en dos horas te comento. Y ya paso dos horas y no prendio"},{"id":"685c0fc2-c2a6-4760-917d-fdc8973337fb","text":"Nao esta carregando. Ja tentei em todas tomada nao esta carregando. Gostaria de trocar. Muito ruim"}]},{"name":"Falha de hardware que bloqueia cobracas","examples":[{"id":"839970b3-e582-4a2a-b83d-ccc140bfdaf2","text":"Apareceu a mensagem postempered. Eu tenho problemas com minha Point Mini Chip. Mensagem postempered"},{"id":"7eb44bf8-7301-4f8c-aa49-b5d1ce54ce4f","text":"Nao passa pagamentos e abre uma mensagem dizendo que esta bloqueado e que precisa ser trocada. A maquininha esta inoperante, por isso sera necessario troca-la sem custo"},{"id":"c2c6ae96-b394-4b2b-886e-a2eff90730a3","text":"Esta travando, em algumas vendas preciso reinserir os dados varias vezes. Bateria nao esta durando o dia. Trava antes de fazer a leitura e reinicia a cobranca"}]},{"name":"Processo de troca RMA lento ou confuso","examples":[{"id":"f3e80388-07e9-4a3c-9afe-bc69ca16dd88","text":"Esse problema aconteceu logo apos a ultima atualizacao. A troca precisa acontecer, pois o problema nao foi causado por mal uso. Muito ruim"},{"id":"2219134b-129b-4193-9c98-7aca05f37a86","text":"Que clase de broma es esta? Como pueden haber empeorado tanto el servicio de atencion al cliente. Necesito un cambio de POS para mi local"},{"id":"67a5ec45-f50a-4c41-8561-211b2b8c3e4b","text":"Localizar o codigo para fazer a troca da maquina. Devo embalar a maquininha em algum material ou posso entregar o produto dentro da caixa que recebi?"}]},{"name":"Falha apos atualizacao de software","examples":[{"id":"11c455e9-4c83-488d-834f-e6a2674fe93b","text":"Eu fiz a atualizacao mas ela agora so aparece quando vou tentar passar o cartao que esta sem a conexao com a internet ate nas configuracoes"},{"id":"f717f104-3b77-46e4-98af-a03f52df1d39","text":"No puedo cobrar mi terminal, no me deja actualizar. No se actualiza y no puedo cobrar"},{"id":"b15a6c88-5b2c-4e54-a151-976e2e39e847","text":"El sistema esta caido. Cuanto puede demorar estoy perdiendo ventas con las maquinas. Estamos perdiendo ventas con esto"}]}],"insight":"O problema mais frequente nessa L2 e a maquininha que nao liga ou nao carrega, mesmo apos carregamento prolongado, situacao que imobiliza o negocio imediatamente. Mensagens de erro como postempered e bloqueios de hardware deixam o lojista sem rota de solucao autonoma, dependendo inteiramente de uma troca pelo RMA. O processo de troca e percebido como opaco e demorado: o usuario nao sabe como embalar, onde entregar nem qual o prazo. Um segundo padrao relevante e o de falhas surgidas apos atualizacoes de firmware, gerando resistencia do usuario e reforcando a percepcao de que o produto e fragil e o suporte e ineficaz."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":39,"n_promotores":25,"categories":[{"name":"Terminal nao entregue ou marcada como entregue incorretamente","examples":[{"id":"0179d22b-fe97-4306-bb4b-a1ae478c8fab","text":"Ise un pedido y se robaron mi paquete. Ya revise y aparece como entregado pero ami no me entregaron nada"},{"id":"c146c49b-2025-495c-8b31-38dd761823ff","text":"No me pudieron entregar mi terminal. No volvio a llegar mi terminal, me dicen que estan en mi domicilio y sale mi familiar y no hay nada"},{"id":"e053b7f4-d4b5-4acd-839b-2edac4125832","text":"Dicen que ya recibi y no he recibido nada. Que debo de esperar para ver si me vuelven a mandar el aparato?"}]},{"name":"Atraso na entrega sem previsao ou rastreamento","examples":[{"id":"37787c3a-1551-4a75-9bd8-97700ef47d45","text":"Me refiero al envio de mi Point Smart que desde el 7 de Abril no llega"},{"id":"635a271f-697c-4e40-9196-7d892298eb3d","text":"Realice la compra de una terminal y no me ha llegado. No me dice fecha de entrega y no me da oportunidad de cancelar la compra. Ya lleva dos semanas que la compre"},{"id":"b9420b2b-e223-4004-8d75-48874eb93ee0","text":"Fiz a compra de uma maquininha de cartao mas nao chegou. Nao consigo ver o status da entrega."}]},{"name":"Impossibilidade de cancelar pedido ou alterar endereco de entrega","examples":[{"id":"09a0c429-f476-4827-803e-d487cd9bc657","text":"Ise el cambio de domicilio para entrega y no me lo isieron valido. Lo ise desde el momento de la compra."},{"id":"99b282f3-df88-44d6-b464-af4c6169b69a","text":"Como puedo cancelar la compra de una terminal. Q puedo hacer si no tiene la opcion de cancelar. Muy mala"},{"id":"043e8ae2-3957-4da0-8456-5236c71723ed","text":"Informei o endereco de entrega errado. Como posso corrigir? Quero cancelar. Compra da maquininha"}]},{"name":"Bobinas e insumos nao recebidos ou bloqueio de novo pedido","examples":[{"id":"4750da1b-80a1-4db8-a9ca-4567df807a6b","text":"No recibi mi pedido de rollos. Hoy es 22/04 ya paso la fecha estimada"},{"id":"db067830-70bb-4c76-969a-a22339fb8335","text":"So tenho 01 bobina, que esta em uso. Seu controle esta incorreto quando afirma que ainda nao alcancei 50% de uso das bobinas para poder solicitar mais bobinas de forma gratuita"},{"id":"2b55e736-dc90-4651-9d09-013726b05a31","text":"Unicamente para informar que no recibi los royos de papel. Yo estube esperando y nunca entregaron royos"}]}],"insight":"A insatisfacao nessa L2 comeca na ultima milha: o sistema marca o pedido como entregue, mas o cliente nao recebeu nada, situacao que acontece repetidamente e sem resolucao rapida. A ausencia de rastreamento em tempo real e a falta de data de entrega comunicada deixam o comprador sem referencia de quando esperar. O cancelamento e a alteracao de endereco sao percebidos como impossiveis apos a confirmacao do pedido, prendendo o usuario em uma entrega fadada ao fracasso. Um segundo ponto de dor envolve insumos como bobinas e rolos de papel: o sistema de controle de estoque e considerado impreciso, bloqueando novos pedidos mesmo quando o usuario esta efetivamente sem material."}},"MLA":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":3,"n_promotores":9,"categories":[{"name":"Devolucao automatica sem solucao","examples":[{"id":"c05e32cc-72f6-4112-95b8-9c70020e88fd","text":"No es mi culpa que la tarjeta automaticamente haya devuelto el pago, necesito una solucion rapida"}]},{"name":"Pagamento nao creditado ao cliente final","examples":[{"id":"99efa335-6ad2-4af2-b38b-f4fab86f377f","text":"No se le acredito el dinero al cliente. El cliente esta muy disconforme"}]},{"name":"Falta de dados para acionar banco ou cliente","examples":[{"id":"c05e32cc-72f6-4112-95b8-9c70020e88fd","text":"Necesito el contacto o a que banco pertenece la tarjeta para hacer el reclamo. Pero no entienden que no tenemos ni el contacto del cliente ni del banco"}]},{"name":"Duvidas operacionais sem resposta","examples":[{"id":"1540e0b1-d3e6-4d9c-9cd0-03dc359bc673","text":"Como ago para imprimir un comprobante en mi point"}]}],"insight":"Este L2 conta com apenas 3 detratores, o que limita a representatividade estatistica, mas os casos revelam dois problemas centrais: a incapacidade do suporte em fornecer dados concretos (contato do banco ou do cliente) quando uma devolucao automatica ocorre, deixando o vendedor sem caminho de resolucao; e a falta de creditacao do pagamento ao cliente final, gerando insatisfacao em cadeia. A percepcao de que o atendimento e circular e ineficaz fica evidente nos comentarios dos detratores. O promotor deste L2 tende a avaliar bem quando obtem orientacao minima, indicando que a barra de expectativa e baixa, mas nem isso e sempre cumprido."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":11,"n_promotores":17,"categories":[{"name":"Cupom ou promocao prometida nao disponivel","examples":[{"id":"59bbc03a-4fbb-4f86-acc3-1c461663b872","text":"Me llamo una chica de Mercado Pago ofreciendome el lector por mil pesos y me dijo que yo tenia un cupon para poder acceder a la compra y entro a Mercado Pago y no esta el cupon. Listo no lo compro entonces"},{"id":"81746619-11c1-4c8e-980b-45805c022812","text":"Hay una promocion? Muy mala"}]},{"name":"Falha no processo de vinculacao do dispositivo","examples":[{"id":"897da990-001a-406f-b485-fe78e0223206","text":"Kiero vincular mi posnert. Aparese ese i no ase mas nada aunque toque los botones. Estaba con otra cuenta mia vieja ase 2 anos no lo prendia"},{"id":"6faae1dd-781e-4864-aee5-51a4a2c5359a","text":"Mi point plus dice irrupcion. No tengo solucion. El point no sirve y no me solucionan nada"}]},{"name":"Suporte insuficiente para iniciar vendas","examples":[{"id":"c8aaec5f-cc45-4dd4-b21c-82d42a8e21fc","text":"No puedo vender. Quiero cobrar con el point. Regular"},{"id":"b956e106-8e66-41ad-816c-e9483064417d","text":"Como pedir el point? Muy mala"},{"id":"a6e8c30f-de28-4399-9958-9830388e8237","text":"Necesito comprar un point para mi negocio. Necesito comprar un point a $999. Muy mala"}]},{"name":"Titularidade e transferencia de equipamento","examples":[{"id":"ebd63326-13c7-4cc4-8722-50e9f5fd6682","text":"Yo tengo otro equipo de Point a nombre de mi marido que fallecio recientemente, no se podria MODIFICAR los datos, porque esa cuenta la tengo que Cerrar."},{"id":"95d544bc-06df-4f88-a956-2f5d3c6cfa4d","text":"Ya van dos que voy pidiendo y ninguno me ha funcionado. Fue muy mala"},{"id":"0e40d754-8b7c-4109-b240-28623bde2c5d","text":"Como se compra un smart point?"}]}],"insight":"Os detratores deste L2 concentram-se em dois eixos principais: a frustracao com promessas comerciais nao cumpridas (cupons anunciados por telefone que nao aparecem no app, gerando abandono da compra) e a dificuldade em vincular ou transferir dispositivos entre contas. A jornada de ativacao do Point e percebida como um obstaculo, especialmente quando o usuario recebeu ou herdou um aparelho de terceiros ou quando o dispositivo estava inativo ha muito tempo. O atendimento automatizado nao resolve casos complexos de titularidade, e a falta de canal humano acessivel amplifica a insatisfacao."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":10,"n_promotores":19,"categories":[{"name":"Cobranca bloqueada por controle de risco","examples":[{"id":"cae7e86a-58bb-4159-89ae-d7afb66b99d0","text":"Quiero cobrar con tarjeta y me dicen que no supero los limites de seguridad. El cliente me dice que la tarjeta tiene saldo suficiente y la usa todos los dias"},{"id":"ec3a77be-613a-463f-ab70-ea5fc9f11593","text":"Por que me rechazan un cobro de seiscientos ochenta mil pesos? No me solucionaste ni mierda. Quiero cobrar a mi cliente y Mercado Pago no me deja"},{"id":"06816e59-0839-4aac-87af-ed204366e08a","text":"Mi consulta es por que mi cliente no tiene limite en otra tarjeta, solo en esta que intenta usar. Muy mala"}]},{"name":"Tarjeta rechazada sem explicacao objetiva","examples":[{"id":"57f02be2-9894-4bdb-b8cc-86158701048c","text":"No puedo hacer un cobro con tarjeta su credito. Tarjeta rechazada. Solucion al problema"},{"id":"4d8b9018-6b46-4370-8963-ade3a09fdf0c","text":"El point cobra con tarjetas extranjeras? No me contesto la pregunta, dice que deberia en vez de darme la seguridad de si o no"},{"id":"1e354f9f-b349-44fa-9d67-fa311ec7074c","text":"No puedo cobrar con mi point. Y como me recuperan el perjuicio de las personas a las cual no les pude cobrar?"}]},{"name":"Dispositivo com falha durante cobranca","examples":[{"id":"544116bc-0380-4a03-9789-18fb17ff2481","text":"Mi Point Smart no funciona. Desde hoy al mediodia intento prenderlo y no da ninguna senal. Por que no puedo reemplazarlo?"},{"id":"a04c9fa1-e34e-4526-ab5f-58ff6ad23506","text":"Robo del Posnet. Dar de baja el posnet"}]},{"name":"Falta de suporte para metodos alternativos de cobranca","examples":[{"id":"cae7e86a-58bb-4159-89ae-d7afb66b99d0","text":"Ayudame con otra forma de cobro. Lo podemos hacer por transferencia. A ver, ayudame"},{"id":"1ad1316d-12bd-4388-8ca7-0d7300c23e47","text":"Quiero activar el NFC en mi celular desde Mercado Pago. Regular"},{"id":"69d25bf5-2e34-44ea-9bf6-f17d5e06c7f4","text":"Con el point. Perdon, es el posnet. Regular"}]}],"insight":"O principal driver de insatisfacao neste L2 sao os bloqueios de cobranca por validacao de seguranca, vivenciados pelo vendedor como rejeicoes arbitrarias, especialmente quando o cliente tem saldo disponivel e usa a mesma tarjeta cotidianamente. O suporte nao oferece explicacoes suficientes nem alternativas concretas, gerando perda imediata de venda e dano a relacao comercial do vendedor com seu cliente. A linguagem dos detratores e notavelmente mais agressiva do que em outros L2s, evidenciando frustracao com a impotencia do canal. Promotores deste L2 tem duvidas pontuais sobre metodos respondidas satisfatoriamente, revelando que o canal funciona para consultas simples mas falha quando o problema exige resolucao operacional real."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":19,"categories":[{"name":"Dispositivo nao liga apos tentativas de carga","examples":[{"id":"72dc8ff1-d21f-4b84-a30d-322fbd5d1478","text":"Lo deje 24hs enchufado con el cargador original y no enciende. Me voy a pasar a Uala entonces. Muy mala"},{"id":"cdcb72fc-7827-487d-ac31-a1adc4644bb0","text":"No enciende. Ya probe cargandolo y tambien manteniendo apretado la opcion de encendido durante un buen tiempo. Al cargarlo no aparece ninguna luz y tampoco se cayo ni se mojo."},{"id":"589fa9d1-c46d-49e0-9497-f318e0244b50","text":"Se apago y no encendio mas. Estuvo enchufado en la pared y no prendio ni prende ninguna luz. No tengo plata para comprar otro posnet. Muy mala"}]},{"name":"Processo de troca (RMA) lento e ineficaz","examples":[{"id":"2219134b-129b-4193-9c98-7aca05f37a86","text":"Que clase de broma es esta? Como pueden haber empeorado tanto el servicio de atencion al cliente. Necesito un cambio de POS para mi local"},{"id":"88cdf850-bd1d-42e4-9d1a-fb42bd27b53f","text":"No pude resolver mi pedido de reemplazo de terminal point"},{"id":"53630d26-9a61-4c70-aa90-27a4a1458683","text":"Practicamente no me ayudas. La primera opcion deberia ser hablar con una persona. Lo que haces es desgastar al cliente"}]},{"name":"Equipamento novo com defeito desde a compra","examples":[{"id":"8f02a639-d27f-4295-8230-ee8f44171046","text":"Compre un point de Mercado Pago y no enciende. No nada de nada. No tuvo contacto, no se me cayo, recien lo compre"},{"id":"3431ce52-097a-4583-9c6d-e607b35176ea","text":"Hace menos de un mes que lo tengo y ya se rompio, no tiene garantia? Deja nomas, busco otro medio de cobro"},{"id":"dfcd8fa1-84fd-4f5e-a69c-57e5fc93a5bb","text":"No funciona mi point smart. No enciende ni carga. Deje enchilado y en dos horas te comento. Y ya paso dos horas y no prendio"}]},{"name":"Negocio paralisado sem alternativa de cobranca","examples":[{"id":"4317dd2a-d27a-4da2-8229-f9cd540737e5","text":"No me dieron una solucion al problema con point, no tengo forma de cobrar con tarjeta. Muy mala"},{"id":"9f83f4b3-1ac6-4e9e-9bf0-213f57958c23","text":"No importa, usaremos el posnet del banco. Dejaremos de usar el Point de Mercado Pago entonces"},{"id":"14e3934e-76c4-4113-b024-45e5adfd98f7","text":"De que me sirve este aparato si no puedo realizar la operacion. Muy mala. Que mienten. Venden algo que no funciona"}]}],"insight":"Este e o L2 com maior volume de detratores (35) e o padrao e altamente homogeneo: o Point Smart nao liga nem carrega, e o usuario ja esgotou todas as etapas de troubleshooting indicadas (cabo original, enchufe de pared, 4+ horas de carga) sem resultado. A incapacidade do atendimento de oferecer RMA imediato resulta em negocios paralisados e ameacas concretas de migracao para concorrentes como Uala. O atendimento automatizado e percebido como um obstaculo deliberado para evitar a troca, nao como suporte genuino. Promotores do mesmo L2 tem perfil identico de problema mas avaliaram bem porque o RMA foi acionado com exito, confirmando que a experiencia e boa quando o processo funciona mas falha sistematicamente quando o bot nao consegue avancar o caso."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":18,"n_promotores":20,"categories":[{"name":"Entrega do Point atrasada ou sem rastreio","examples":[{"id":"37787c3a-1551-4a75-9bd8-97700ef47d45","text":"Me refiero al envio de mi Point Smart que desde el 7 de Abril no llega"},{"id":"9636856c-244a-4b32-a1c9-d6d345bb995a","text":"Compre el point y aun no llego. El dia 28 de abril"},{"id":"72331f64-797e-484f-bfa8-bfa929caaa20","text":"En el enlace no figura el seguimiento. Muy mala"}]},{"name":"Rollos de papel nao entregues no prazo","examples":[{"id":"1fa6d6c2-1f33-45d1-acf8-578105a006e9","text":"Ya pasaron casi 20 dias. No gracias, ya hable tres veces y no me dieron solucion"},{"id":"195a851e-53bd-4b4c-b82c-cd850327ae53","text":"Ya estamos a 18 de abril y no recibi los rollos. No llego. Muy mala"},{"id":"4750da1b-80a1-4db8-a9ca-4567df807a6b","text":"No recibi mi pedido de rollos. Hoy es 22/04, ya paso la fecha estimada."}]},{"name":"Proposta comercial descumprida na entrega","examples":[{"id":"83ef5aea-50da-478e-af33-47d6721cac56","text":"Me ofrecieron el point, confie en la propuesta y no cumplieron con lo acordado. Me generaron un problema con un cliente por incumplir la propuesta. Muy mala"},{"id":"3883ed2f-f39e-4d94-9451-1ad05692201d","text":"Yo ya pague todo el viernes y supuestamente me llegaba el martes. Voy a seguir perdiendo clientes"},{"id":"adab487f-ad5d-418b-ab94-af7d66d032d8","text":"Hola quiero saber cuando me entregan el posnet"}]},{"name":"Demora no recambio por RMA gera perda de vendas","examples":[{"id":"81873602-2dca-40d5-bbba-9943b81578fd","text":"Se demoran mucho, hace varios dias tengo perdidas de ventas por no tenerlo. Tienen algun numero de vendedores de posnet? Regular"},{"id":"0dba10cc-0d07-4da0-8970-825d805ebd23","text":"Estoy perdiendo ventas. Una vez que lo retiran me traen en el momento uno nuevo? Me conviene hablar con otra empresa, que es de un dia para el otro"},{"id":"7db4cd83-cb46-4261-8a9b-4cafbf0d5d09","text":"Ya devolvi mi posnet, cuanto tardan en mandarme el nuevo?"}]}],"insight":"Os detratores deste L2 evidenciam dois problemas logisticos distintos: atrasos na entrega do Point original (comprado e nao recebido dentro do prazo prometido) e nao entrega de rollos de papel, insumo basico para operacao diaria do negocio. Em ambos os casos, o suporte nao consegue dar visibilidade em tempo real nem acelerar a entrega, e usuarios que ja contataram multiplas vezes sem solucao tendem a dar nota 1. O terceiro padrao relevante e o RMA demorado, que paralisa o negocio: o comerciante entrega o aparelho defeituoso mas fica sem substituto por varios dias. Promotores deste L2 frequentemente tem as mesmas dores mas sao atendidos com informacao de rastreio ou previsao de chegada, sugerindo que a experiencia e satisfatoria quando o sistema fornece uma resposta concreta e acionavel."}},"MLB":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":32,"n_promotores":20,"categories":[{"name":"Valores nao creditados na conta","examples":[{"id":"edf91651-ba5e-4031-90fe-a9227b0b6e2c","text":"Onde esta meu dinheiro que vendi no dia 07/05? Fiz vendas e o dinheiro nao caiu na minha conta. Teve pane sim. Em todas as maquinas."},{"id":"6ff19eb7-de24-41df-9eb6-c8061c941050","text":"Nao estao caindo as vendas e nem os Pix diretos. Nao estou recebendo nem Pix nem cartao."},{"id":"d73b2e84-7eec-4c02-892f-20b2e080ef44","text":"Cliente fez pagamento na maquina nao caiu. Vai estabelecer quando isso."}]},{"name":"Dificuldade para realizar estorno ou devolucao","examples":[{"id":"c3a627a5-10e8-44dd-a4e3-95ecdb6c33a7","text":"Quero devolver parte do pagamento no credito. Nao to conseguindo apagar o valor total pra colocar o valor parcial. O teclado nao abre."},{"id":"000c5700-d5ce-4fda-b948-746051fba5e7","text":"Preciso fazer uma devolucao parcial. Preciso devolver uma venda que ja recebi no cartao. Na tela nao deixa editar."},{"id":"fe016389-22b2-4fe4-93c2-7fb1260c1528","text":"O valor foi descontado na mesma hora indevidamente. A dona do cartao esta pedindo o estorno, mas voces ja pegaram o valor. Preciso estornar."}]},{"name":"Pagamento debitado do cliente sem entrar para o lojista","examples":[{"id":"01a91ae3-9b9f-4a80-bee6-55146d8bbd08","text":"O pagamento nao constou pra mim e debitou do cliente. Isso tem acontecido com frequencia, e constrangedor com o cliente."},{"id":"fb428743-332b-41c0-bec3-baaaa79bd035","text":"A venda deu como cartao do cliente estava bloqueado e o valor saiu da conta dele, porem pra mim nao entrou o valor. O banco dele nao sabe onde esta o dinheiro."},{"id":"c270b315-29dd-4cb2-a071-3cf6cdeaf7b4","text":"A maquina desligou assim que aprovou e saiu da conta do cliente. Fizemos novamente e o valor entrou em minha conta. O cliente pagou 2x."}]},{"name":"Reembolso nao efetivado ou demora no credito","examples":[{"id":"e92774bf-c434-46af-8b5b-fc4c4d2ed359","text":"Nao houve reembolso. Demora quanto tempo? Nao tem nenhuma entrada desse valor e foi no credito."},{"id":"1be5ae34-cf9f-484d-958f-6d8e2fc48957","text":"Quero uma correcao de vendas na maquininha. Aqui no extrato ta faltando R$2.619. Nao tive minha questao resolvida."},{"id":"082904c8-1630-4fc5-a446-85ce3401bbad","text":"Temos uma venda estornada, o Santander esta pedindo o numero do protocolo de estorno. Por favor, me envia. Regular."}]}],"insight":"Os detratores desta L2 sao majoritariamente lojistas que nao recebem os valores de vendas realizadas com sucesso: o dinheiro sai do cliente mas nao entra na conta do vendedor, gerando constrangimento operacional e prejuizo imediato. A dificuldade para realizar estornos parciais pela interface da maquininha e outro ponto critico, pois o sistema nao permite editar o valor ou o teclado trava durante o processo. Ha tambem recorrente falta de clareza sobre prazos e protocolos de reembolso: lojistas ficam sem resposta objetiva sobre quando e como o dinheiro retornara. A ausencia de solucao rapida nesses cenarios forca o lojista a lidar com clientes insatisfeitos sem ter ferramentas adequadas para resolver o problema no ponto de venda."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":35,"n_promotores":19,"categories":[{"name":"Senha da maquininha bloqueada ou esquecida","examples":[{"id":"9dd5705b-b20a-4132-86d6-3d4617e05817","text":"Senha bloqueada da maquina. Recupere-a em 'lojas e caixas' no site do Mercado Pago. Nao aparece a opcao senhas."},{"id":"e6f72b73-3a47-48e9-ad82-7af17ceaf922","text":"Esqueci a senha de desbloqueio da minha Point Pro 2. Ja fiz isso. Regular."},{"id":"1fbf2539-5946-4d47-b450-89a937b8aacb","text":"Eu esqueci a senha do acesso da minha maquininha. Regular."}]},{"name":"Dificuldade para vincular ou transferir maquininha entre contas","examples":[{"id":"663b51ef-60bf-4da3-9eff-f74a613931d0","text":"A maquininha point pro 2 era da minha mae. Ja desconectei ela da conta da minha mae, mas mesmo assim nao ta dando erro quando vou tentar cadastrar. Nao gera codigo da maquina."},{"id":"fe3c6aea-d4f7-452b-a9b2-e8459ae9b784","text":"Comprei uma maquininha usada, como faco pra mudar pra minha conta? Regular."},{"id":"632bb9b3-0acc-41b9-8940-7550d5f11734","text":"A escola adquiriu uma maquininha Point Pro 2. Nao estamos conseguindo acesso. Ela esta ativa com uma conta antiga que nao sabemos a senha."}]},{"name":"Maquininha nao aceita voucher ou bandeira especifica","examples":[{"id":"02552fc0-a15a-4526-9e86-8939b3c6e409","text":"Eu nao consigo aceitar voucher nela de nenhuma bandeira. Regular."},{"id":"d3fbb2f4-bb6e-4a8f-8f5d-e3230f63567c","text":"A maquina recebe voucher? Quero sim. Eu quero."},{"id":"23bf8539-0848-4635-aed3-c917e9614cd7","text":"Quero aceitar ticket alimentacao."}]},{"name":"Atendimento ineficaz e problema nao resolvido","examples":[{"id":"e9ab1818-985e-4f06-82f7-11b23f7c1ffd","text":"Estou ha duas horas tentando contato com voces e nao consigo. A maquina foi solicitada pela conta anterior e ainda nao chegou. Muito ruim."},{"id":"3ca7799e-52eb-446b-b7ba-9de36d102fd7","text":"Tentei passar valor diferente e recusou. Quero passar meu cartao na maquineta. Por que nao posso fazer uma compra na minha padaria?"},{"id":"53a5e471-95b7-483e-8c79-db9d37935dfb","text":"Como reconfigurar minha maquina Point Pro 2? Quero configurar do zero. Muito ruim."}]}],"insight":"A principal fonte de frustracao nesta L2 e a dificuldade de gestao da conta associada a maquininha: recuperar ou redefinir senhas bloqueadas exige caminhos no app que nao sao intuitivos, e transferir a maquina de uma conta para outra, especialmente quando adquirida usada ou herdada, e um processo mal documentado e frequentemente sem resolucao. Lojistas que precisam aceitar vouchers e tickets de alimentacao encontram barreiras para habilitar essas modalidades, perdendo vendas por limitacoes de configuracao que nao conseguem resolver sozinhos. O suporte automatizado nao consegue resolver os problemas de vinculo e senha, gerando multiplos contatos sem solucao. A sensacao geral e de abandono: o cliente comprou a maquina mas nao consegue coloca-la em pleno funcionamento."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Cartoes recusados por motivo de seguranca","examples":[{"id":"392274ee-6bba-434d-a5da-44576c361f75","text":"Toda cobranca que faco da essa mensagem. Trocamos varios cartoes. E um incomodo e tenho que usar outro aplicativo pois nao esta tendo uma boa experiencia com o Mercado Pago."},{"id":"945c09aa-1898-4e3d-b685-9b98fc32812a","text":"Todos os valores que estou passando na maquina de cartao estao sendo recusados. Perdi vendas hoje por esse motivo. Se nao vou ter que cancelar essa conta."},{"id":"1c39deee-0887-43c4-9100-42eae5800f3f","text":"Tou passando cartao e todos dando recusado por motivo de seguranca. Passei em outra maquineta e deu certo. Recebi esta maquineta e preciso usar."}]},{"name":"Point Tap / celular como maquininha nao funciona","examples":[{"id":"c8f813ca-e2c8-4368-935f-657650322328","text":"Nao estou conseguindo cobrar com Point Tap. Aparece que em 30 segundos iria pedir para aproximar o cartao no telefone, mas nao sai disso. Muito ruim. Nao consegui resolver o problema."},{"id":"c5dfa0de-d1eb-4a4c-b90b-3de19445f808","text":"Estou tentando usar o Point Tap, mas nao sai do carregando. A cliente esta esperando faz uns 30 minutos. Muito ruim. Nao resolveu."},{"id":"d291de4a-1417-4dc8-aa70-f8ad9295e16a","text":"Nao to conseguindo receber no cartao. Nao to aparecendo mensagem, so nao to concluindo a acao. Fica carregando. Muito ruim."}]},{"name":"Maquininha nao finaliza operacao ou trava","examples":[{"id":"8efe367b-0011-4e89-83ad-a0b5e5b4fbeb","text":"3 maquininhas e todas nao consigo passar cartao. Alem de nao passar cartao, nem a conta to conseguindo acessar. Hoje perdi venda."},{"id":"78375599-5490-43b4-891e-ea75681aabbc","text":"Estou com o mesmo problema e nao consegui fazer minhas vendas. Ja esta tudo configurado. Ja atualizei. Ele trava antes."},{"id":"c05f33eb-8e89-4522-b4f4-58268984c287","text":"Ela nao finaliza a operacao no fim da venda. Tente novamente."}]},{"name":"Bloqueio de cartoes especificos (Nubank, Mercado Pago, estrangeiros)","examples":[{"id":"c9e68fa0-3796-47e6-b9f6-bd4d32d8cdbc","text":"Toda vez que passa cartao do Nubank bloqueia o cartao do cliente. Diz que e uma compra suspeita. Quando coloco na conta da minha esposa nao faz isso. Muito ruim."},{"id":"aae4de19-54d9-4d7a-b22b-a4653647622b","text":"Nao estou conseguindo receber pagamento pelo Tap com cartao do proprio Mercado Pago. Por que esta barrando os pagamentos vindos desse cartao?"},{"id":"609b9656-d878-411c-b466-ed90b55d43e0","text":"Fui receber de um cliente e o recebimento foi recusado. Estava esperando receber R$10.000 e voces nao aceitaram a venda. Como fazer para aceitar esse cartao?"}]}],"insight":"O tema dominante desta L2 e a recusa sistematica de cartoes por 'motivo de seguranca', um bloqueio que os lojistas nao conseguem entender nem contornar: o mesmo cartao funciona em outras maquininhas, o que evidencia um problema de configuracao de risco do proprio Mercado Pago. O Point Tap concentra muitas reclamacoes de tela travada e impossibilidade de cobrar, gerando situacoes constrangedoras com o cliente presente aguardando. A falta de transparencia sobre os criterios de bloqueio de transacoes e a ausencia de um caminho de desbloqueio imediato forcam lojistas a migrar para concorrentes no momento da venda. O impacto e direto na receita: lojistas relatam perda de vendas no dia do contato e consideram cancelar o servico."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Maquininha nao liga ou nao carrega","examples":[{"id":"a9c2be92-5469-46bd-a83e-6f2f3068c738","text":"Ela esta ligando e desligando ate descarregar, nao da tempo nem de passar o cartao. Fiz o que pediu, coloquei no carregador por 30 minutos, e o problema continua. Muito ruim."},{"id":"685c0fc2-c2a6-4760-917d-fdc8973337fb","text":"Nao esta carregando. Ja tentei em todas as tomadas e nao esta carregando. Gostaria de trocar. Muito ruim."},{"id":"4298ef51-51cb-4dda-8aeb-d6478f168839","text":"Minha maquininha nao quer mais carregar. Estou perdendo venda. Ela da sinal mas nao liga. Ja fiz de tudo."}]},{"name":"Mensagem POS Tampered e bloqueio permanente","examples":[{"id":"839970b3-e582-4a2a-b83d-ccc140bfdaf2","text":"Apareceu a mensagem POS Tampered na minha Point Mini Chip D175. Mensagem POS Tampered."},{"id":"7eb44bf8-7301-4f8c-aa49-b5d1ce54ce4f","text":"Nao passa pagamentos e abre uma mensagem dizendo que esta bloqueada e que precisa ser trocada. Mas, se esta bloqueada nao e so desbloquear?"},{"id":"dc00d28d-89f5-4537-8b44-967d8c479660","text":"Minha maquina Point Pro 2 bloqueou de seguranca. So nao vou me deslocar para levar a maquina nos correios sendo que voces ganham um dinheiro bom no meu capital de giro."}]},{"name":"Maquininha travada ou com defeito apos atualizacao","examples":[{"id":"f3e80388-07e9-4a3c-9afe-bc69ca16dd88","text":"Ela fica na tela buscando informacoes e nao sai disso. Esse problema aconteceu logo apos a ultima atualizacao, antes disso ela funcionava normalmente. A troca precisa acontecer pois o problema nao foi causado por mal uso. Muito ruim."},{"id":"ffbe07f9-c178-4673-9652-a7ef1d49ece8","text":"Ela fica verificando se tem atualizacoes e nao sai da tela. Continua travada. A maquininha nao arrumou, vou ter que comprar outra. Muito ruim."},{"id":"c2c6ae96-b394-4b2b-886e-a2eff90730a3","text":"Esta travando, em algumas vendas preciso reinserir os dados varias vezes. Bateria nao esta durando o dia. Ela trava e reinicia. Regular."}]},{"name":"Processo de troca (RMA) frustrante e demorado","examples":[{"id":"8f1e2da7-cffa-4664-8e40-fa22b7ed3c7e","text":"Pedi a troca da D175 mas vi que ela saiu de linha. Qual maquina vai ser enviada? Como a D175 e 3G e a proxima seria so Bluetooth, nao vou aceitar pois preciso vender sem celular. Muito ruim."},{"id":"e90d4bc3-ba9a-496e-9afb-7aa191830953","text":"A impressora nao imprime o comprovante. Vai demorar chegar? Nao posso ficar sem maquina aqui na loja. Nao resolve os problemas da gente."},{"id":"b9baa99b-09d8-4bbe-ab63-bf47c5dc228e","text":"Quero a troca, porem nao posso ficar sem a maquina porque trabalho com ela. Preciso trocar minha maquina, nao esta lendo o chip do cartao. Regular."}]}],"insight":"Os problemas de hardware sao variados, mas compartilham um denominador comum: o lojista perde a capacidade de trabalhar imediatamente e o processo de solucao e lento e burocratico. Falhas de bateria e travamentos pos-atualizacao de firmware sao as ocorrencias mais frequentes, sugerindo problemas de qualidade de componentes e testes insuficientes antes de releases. A mensagem 'POS Tampered' gera confusao pois o lojista nao entende o motivo do bloqueio e questiona se seria possivel simplesmente desbloquear. O processo de RMA e percebido como punitivo: o lojista precisa enviar a maquina pelos Correios por conta propria, ficando sem ferramenta de trabalho por dias, uma experiencia que contrasta negativamente com a promessa de suporte ao empreendedor."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":34,"n_promotores":20,"categories":[{"name":"Maquininha nao entregue ou consta entregue erroneamente","examples":[{"id":"bbe3942b-9eef-43d4-b14a-17c3a1f970f3","text":"Nao recebi cartao e nem a maquininha que consta como entregue. Nao tinha ninguem em casa e nao foi entregue. Teria que ter algo na observacao sobre nao entrega."},{"id":"28a02ad6-be46-4c39-80c4-abbe571b6248","text":"Nao recebi o produto. Endereco esta errado. Muito ruim."},{"id":"7a89cf2b-362b-499b-9d60-3999ee89729d","text":"Estou precisando da minha maquina. Comprei e nao entregaram. Regular."}]},{"name":"Bobinas nao chegam ou sistema bloqueia o pedido","examples":[{"id":"e185f4aa-4443-4171-a5f9-8c5daf7148b8","text":"Preciso de bobinas para a minha Point Pro, mas recebo a mensagem de que nao posso pedir. O que eu faco? Muito ruim."},{"id":"73c921c8-3764-4e8c-bf36-1c1b47e63eff","text":"Meu pedido de bobinas para a minha Point Pro 2 nao chegou. Estou sem bobina. Desde que comprei a maquina ja vai fazer uns 3 anos. Nao vou comprar nada entao."},{"id":"db067830-70bb-4c76-969a-a22339fb8335","text":"So tenho 1 bobina em uso. Seu controle esta incorreto quando afirma que ainda nao alcancei 50% de uso para solicitar mais. Vou ter que comprar, infelizmente."}]},{"name":"Atraso na entrega da maquininha","examples":[{"id":"c543cc9f-6a59-40cb-8c18-8708fed49d6a","text":"Maquininha muito atrasada, preciso com urgencia."},{"id":"abcf09aa-69f4-4296-b722-a5dca00a2b09","text":"Maquina ate hoje nao chegou. Muito ruim."},{"id":"b9420b2b-e223-4004-8d75-48874eb93ee0","text":"Fiz a compra de uma maquininha de cartao mas nao chegou. Nao consigo ver o status da entrega. Gostaria de saber se a maquina ja saiu para entrega."}]},{"name":"Dificuldade para cancelar compra ou corrigir endereco","examples":[{"id":"ca8704b2-40e8-4df0-a18d-c38a37efa27b","text":"Eu preciso cancelar pois a compra foi por engano. Eu preciso cancelar agora. Por favor, eu preciso cancelar agora."},{"id":"043e8ae2-3957-4da0-8456-5236c71723ed","text":"Informei o endereco de entrega errado. Como posso corrigir? Quero cancelar. Regular."},{"id":"43758917-d9af-47da-b59c-071eb70a39f8","text":"Acabei de comprar essa maquina, nao consigo usar. Nao sabia que para ter maquininha tinha que ter comprovante de renda. Estou devolvendo hoje mesmo e quero meu reembolso."}]}],"insight":"Dois problemas dominam esta L2: a entrega fisica da maquininha e o fornecimento de bobinas. No caso das entregas, lojistas recebem status 'entregue' sem ter recebido o produto, e quando o endereco esta errado nao encontram um caminho agil para corrigi-lo antes do envio. O sistema de controle de bobinas e percebido como falho: o app reporta que o cliente ainda tem estoque suficiente enquanto ele fisicamente ja esta sem, bloqueando novos pedidos gratuitos e forcando a compra avulsa. A impossibilidade de cancelar um pedido rapidamente apos a compra por engano e outro ponto de atrito relevante. Em conjunto, esses problemas geram a percepcao de que o Mercado Pago nao entrega o que promete, tanto no sentido literal quanto no de suporte pos-venda."}},"MLC":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":6,"n_promotores":4,"categories":[{"name":"Falha na conciliacao de cobranças","examples":[{"id":"86efa7a9-aefb-424e-aa29-0d1bfa305ee8","text":"No puedo hacer cobros con la maquina de mercado pago. No afraferidos los cobros de. Hoy a mi cuenta no se que hacer"},{"id":"cb25a44a-52f1-4b9b-90ba-2cc14a6e77c6","text":"Por que no me esta llegando el dinero de las ventas de hoy fecha 7 de mayo 2026. Todo lo de mercado pago esta caido. Incluso no me quiso dar el cierre el pinito."},{"id":"aab7cc0f-43e3-42e4-b373-b96842f9b560","text":"Mis ventas. Venta con Point Mini. Muy mala. Venta con Point Mini"}]},{"name":"Devolucao e comprovante de reembolso","examples":[{"id":"0c9c5d02-e11f-4774-bc60-2a33a1982eda","text":"como imprimo el vale d devolucion. necesito imprimir un vale de devolucion. no funciona"},{"id":"a6f08e9e-39fe-4a5c-9cdb-6aa1f67b3d1a","text":"Cancele por errro era venta. Mi cliente dice que no recibio el dinero"}]},{"name":"Rastreabilidade de pagamento nao confirmado","examples":[{"id":"98f3d064-42e6-4878-84d5-242675fbd715","text":"ayer me hicieron una compra de 21800 pesos me pagaron con el telefono la boleta salio pero en la aplicacion del telefono no aparece. Es que a mi no me sirve eso porque no voy a recuperar el dinero que perdi"}]},{"name":"Suporte ineficaz do assistente virtual","examples":[{"id":"0c9c5d02-e11f-4774-bc60-2a33a1982eda","text":"Muy mala. no funciona"},{"id":"86efa7a9-aefb-424e-aa29-0d1bfa305ee8","text":"No puedo hacer cobros con la maquina de mercado pago. Que puedo hacer para cobrar"},{"id":"98f3d064-42e6-4878-84d5-242675fbd715","text":"No entiendo como hacer eso. Es que a mi no me sirve eso porque no voy a recuperar el dinero que perdi. Ustedes pueden rastrear la tarjeta con el numero"}]}],"insight":"Os detratores desta L2 expressam frustracao com a falta de visibilidade e controle sobre cobranças realizadas: o dinheiro nao aparece na conta, os comprovantes de devolucao nao funcionam e os pagamentos somem sem registro claro. Ha uma ruptura entre o momento do pagamento (que ocorre corretamente na maquininha) e o reflexo na plataforma, gerando inseguranca no comerciante. O assistente virtual nao oferece solucao efetiva para esses casos, aumentando a sensacao de abandono. A incapacidade de rastrear transacoes suspeitas ou confirmar reembolsos ao cliente agrava ainda mais a insatisfacao."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":8,"n_promotores":14,"categories":[{"name":"Perda de funcionalidade de boletas","examples":[{"id":"a429921f-1fb1-4367-9880-66208bd6b25a","text":"No puede emitir boletas por no aver tenido plata en la cuenta en el momento del cobro. Si ahora no puede hacer boletas y tengo plata. de un dia para otro la opcion desaparecio y no puedo emitir boletas"}]},{"name":"Habilitacao e compatibilidade de metodos de pagamento","examples":[{"id":"c471a42f-6176-4a82-92cd-8b73811fcd5c","text":"Necesito saber si estoy habilitado para pago con Pluxee. Hasta el 20 de marzo cobre con este pos. El Pos que tengo me funciona con tarjeta, pero no con Pluxee."},{"id":"0555294d-8a5f-4c13-8a6e-13f9e49ea262","text":"Necesito saber como cobrar con tarjeta edenred. Regular"}]},{"name":"Desvinculacao e gestao de conta da maquina","examples":[{"id":"d4fc86f5-9c4f-4f02-b8a9-7988bf073039","text":"Quiero desvincular todo lo de una maquina point. Ya me sali de la maquina pero no quiero que aparezca nada de eso en mi cuenta"},{"id":"fb4aedf1-ef7b-423e-88ad-435d7941534a","text":"La maquina me pide todos los dias escanear el codigo QR cada vez que la prendo lo que es un problema por yo no siempre estoy presente para prenderla"}]},{"name":"Acesso a atendimento humano inexistente","examples":[{"id":"43e4b71b-f7d4-40e1-a9f5-82c792e2ddad","text":"Como puedo hablar con un ejecutivo. Necesito comprar una maquina de mercado pago"},{"id":"6aea606b-4803-4e69-a9e5-19d8e4683bc9","text":"Tengo problema con este. No puedo regalar problemas"}]}],"insight":"Nesta L2, os detratores encontram dificuldades concretas na configuracao e habilitacao das maquinas: funcionalidades como emissao de boletas desaparecem sem aviso, convenios de pagamento (Pluxee, Edenred) deixam de funcionar e o processo de desvinculacao de conta e opaco. A exigencia diaria de escanear QR code para ativar a maquina e citada como barreira operacional grave. Ao contrario dos promotores, que conseguem resolver duvidas pontuais de compra ou vinculacao via chatbot, os detratores necessitam de intervencao humana que o canal digital nao oferece, o que intensifica a frustracao."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":22,"n_promotores":14,"categories":[{"name":"Maquina sem processar cobranças","examples":[{"id":"458aa0d4-0fb5-42fc-a7b0-068d7a93554f","text":"Hola no me funciona la maquina para cobrar. No me pasa los pagos sale intente con otra tarjeta. Rechaza el cobro. Aun no funciona he perdido ventas"},{"id":"faeb3bd4-de46-4aea-afd0-91e0494a24ee","text":"La maquina no hace cobros. Sigo con problemas de la maquina"},{"id":"f474d486-39b7-4cf9-ae50-7a7bd4ce81aa","text":"La maquina no funciona con pagos debito o credito. Mi maquina no funciona. Y mientras tanto pierdo ventas"}]},{"name":"Bloqueios e recusas por seguranca indevida","examples":[{"id":"89b803ff-0400-4c81-8aa3-2c3b852a8992","text":"La maquina rechazo una venta de 68.800 por medidas de seguridad y la tarjeta del cliente no tiene problemas en otros negocios. manana vuelve la clienta y no quiero perder la venta"},{"id":"1a6b8295-56aa-40fc-9670-92b9739e00da","text":"el pago no paso los controles de seguridad de Mercado Pago. Actualizar la app"},{"id":"6716a60e-9b73-4633-8613-6aeca0632d84","text":"No proceda cobros. La wea no me ayuda me echa culpa a mi. una transferencia 15.000 no me has llegando por culpa de tus sistema"}]},{"name":"Queda generalizada do sistema","examples":[{"id":"984438fe-db38-4654-843a-18acc6f00b12","text":"Se callo el sistema. Ninguna tarjeta sirve. Me aparece eso cada rato. En la app tambien tengo problemas. Es un almacen se cobra con la maquina en todo momento."},{"id":"ee06a7b1-08c1-4bcc-83e9-8dbb3dc03848","text":"Mi problema con las dos maquinas, con mi dos POS, todavia no tienen solucion. Hoy dia he perdido muchas ventas. Necesito por favor que me solucionen el problema. manana debe estar solucionado, sino para que retiren sus maquinas"},{"id":"d35d5a1e-4fd3-4a2c-bd82-f4fd832cecc9","text":"Llevo horas sin poder hacer transferencias. No hemos podido cobrar con el pos. Ha pasado mucho tiempo con este problema"}]},{"name":"Metodos NFC e contactless nao funcionam","examples":[{"id":"eca3ac15-7d2c-4c21-b231-a0fb512b9687","text":"No puedo pagar con el celular NFC. Da error en el comercio en maquina getnet. Muy mala"},{"id":"d02a1c14-317e-45ac-8578-a06ae017d03c","text":"Que son los cobros sin contacto o NFC? Como activarlo en la point. Muy mala"},{"id":"92a93d51-0998-4155-9fa2-715943006d83","text":"No puedo cobrar tarjetas de debito en mi minipoint. Regular"}]}],"insight":"Esta L2 concentra o maior volume de detratores no MLC e revela um padrao sistemico: a maquininha simplesmente para de processar pagamentos, seja por falha tecnica pontual, queda geral do sistema ou bloqueios automaticos de seguranca que recusam transacoes legitimas. O impacto e direto e imediato: o comerciante perde vendas em tempo real e nao tem canal de resolucao agil. Os filtros antifraude sao percebidos como excessivamente restritivos e mal calibrados, gerando desconfianca na plataforma. A falta de transparencia sobre o status do sistema e ausencia de suporte humano acessivel agravam o sentimento de abandono."},"Point reader hardware faults and RMA":{"n_detratores":13,"n_promotores":20,"categories":[{"name":"Falha na bateria e carregamento","examples":[{"id":"14b51114-9cfe-4992-9666-d052909c9a3c","text":"Mi maquina no carga, indica que las baterias estan mala. Estubo cargando toda la noche y aparecio sin carga. Necesito cambio de equipo o reemplazar las baterias. Muy mala"},{"id":"abf10ba8-4579-4976-bbbd-bb2e656b98fb","text":"La bateria de mi maquina no carga. Ya espere todas las horas. Hice todos los pasos y la maquina no carga. No se cae y liquido tampoco se a mojado"},{"id":"1864da4d-0891-4511-b83d-42980954d167","text":"La maquina se apaga repentina mente. Me gustara cambiar la maquina, porque se apaga repentinamente"}]},{"name":"Maquina travada em loop de inicializacao ou atualizacao","examples":[{"id":"1458c046-a3bd-4f5a-ab9d-8550256eb836","text":"La maquina al prenderla dice cargando informacion. Es como que si estuviera reiniciando todo el tiempo. Muy mala"},{"id":"ea24ba07-1cb7-4c7e-90f6-219a3310b351","text":"Me aparece esto en el pos pero no se puede actualizar. No se actualiza. Ya que no hay solucion me tendre que cambiar de empresa"},{"id":"b1157896-cf9c-49be-89d9-89ad36c81b29","text":"Dice que hay que actualizar la y no funciona para poder volver a usarla. Necesito un tecnico."}]},{"name":"Defeito de hardware sem solucao via suporte remoto","examples":[{"id":"9932e10b-5ac4-483a-93a3-c644215b9b42","text":"Necesito servicio tecnico ya que tengo problemas con los botones del POS. Boton de encendido y teclado al hacer cobros. No se ha mojado ni caido"},{"id":"b568be61-0e2c-4d03-a304-65c2ceb0064c","text":"Arroja un error dice que no es la maquina que es la tarjeta y probamos con las mias y sale lo mismo. Necesito que venga un tecnico"},{"id":"550eaf58-a9c7-484e-892e-4b2e5ed57c43","text":"Ya llevo 3 dias desde el sabado con problemas que no pasa ninguna tarjeta. yo compre esa maquina y llevo muy poco tiempo usandola debe tener alguna garantia. Muy mala"}]},{"name":"Ausencia de canal de troca RMA acessivel","examples":[{"id":"ea24ba07-1cb7-4c7e-90f6-219a3310b351","text":"Como voy a devolver el lector. Y como trabajo si ea un minimarket. No me puedo quedar sin pos. Ya que no hay solucion me tendre que cambiar de empresa"},{"id":"b568be61-0e2c-4d03-a304-65c2ceb0064c","text":"Pedirla porfavor y ahora que puedo hacer para cobrar? Necesito otra solucion rapida soy de Talca puedo ir manana a una sucursal de mercado pago"},{"id":"fc66a86f-c466-435d-bc02-adb28abee99c","text":"Hola buenas tengo mi maquina que no se puede conectar para realizar cobros. Muy mala"}]}],"insight":"Os detratores desta L2 enfrentam falhas fisicas concretas como baterias que nao carregam, maquinas que reiniciam em loop e teclados defeituosos, e nao encontram caminho claro para trocar o equipamento. O suporte remoto via chatbot nao consegue resolver problemas de hardware, e a ausencia de um fluxo de RMA acessivel deixa o comerciante sem maquina operante por dias. Maquinas novas ou com pouco tempo de uso apresentando defeitos intensificam a percepcao de baixa qualidade do produto. Em contraste, promotores com falhas similares conseguem encaminhar a troca ou recebem orientacao satisfatoria, sugerindo que a diferenca esta na clareza do processo de garantia."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":5,"n_promotores":9,"categories":[{"name":"Entrega nao realizada no prazo acordado","examples":[{"id":"bcaece64-1d37-4051-9ebc-71d79e2e596f","text":"Hola quedaron de venir entre el 11 y el 13 de abril a entregar una Smart point nueva a mi negocio y no se han contactado conmigo. Regular"},{"id":"ac73b97b-22c0-450f-8d81-186a99ca8bac","text":"Problemas para recibir compra 156255038943. Reagendar entrega. Como dejar un mensaje para la entre de la compra."}]},{"name":"Endereco de entrega incorreto","examples":[{"id":"8afcf3d4-4cf0-4d52-888e-6a07ee5dddfa","text":"Quisiera solicitar rollos. La direccion a la cual enviaron esta mala"}]},{"name":"Solicitacao de troca por falha de hardware","examples":[{"id":"c148316e-1a49-461d-8c88-b1c554b02aa6","text":"Como puedo solicitar otra maquina por fallo. Pantalla y problemas en impresion. Muy mala. Necesito contarme con un asistente"}]},{"name":"Suporte insuficiente do canal digital","examples":[{"id":"c148316e-1a49-461d-8c88-b1c554b02aa6","text":"Intentalo. Muy mala. Necesito contarme con un asistente"},{"id":"bcaece64-1d37-4051-9ebc-71d79e2e596f","text":"quedaron de venir entre el 11 y el 13 de abril a entregar una Smart point nueva a mi negocio y no se han contactado conmigo. Regular"},{"id":"fea94bfb-bc4b-4e8b-a535-df5241c4139b","text":"Necesito rollos de papel. Felipe camiroaga 665, san Pedro de la paz. Aprobado"}]}],"insight":"Esta L2 tem o menor volume de detratores no MLC, mas os casos revelam falhas em momentos criticos da jornada pos-compra: entregas que nao acontecem no prazo prometido, enderecos incorretos para envio de consumiveis e ausencia de canal claro para solicitar trocas por defeito. A maioria dos promotores consegue solicitar rollos de papel ou acompanhar pedidos sem dificuldade, indicando que o fluxo funciona para demandas simples mas falha em situacoes de excecao. O chatbot responde com mensagens genericas que nao resolvem o problema, e o cliente fica sem alternativa para falar com um atendente humano."},"OUTROS":{"n_detratores":36,"n_promotores":44,"l2s_incluidos":["Cellular/
