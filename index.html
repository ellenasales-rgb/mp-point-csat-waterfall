SIM connectivity in Point devices","Fiscal receipt/invoice service activation and configuration (SII and receipts)","Shipments, deliveries, and returns for Point purchases and consumables","Redelcom/Smart POS operations and migration (Chile)"],"categories":[{"name":"Falha de conectividade do dispositivo","examples":[{"id":"17996d4e-a0d7-4afb-9cac-0e2e4e1aa539","text":"No tengo internet con el chip. Con WiFi funciona. Dice que no tiene internet. Ayer vino uno a arreglar pero sigue igual. Muy mala"},{"id":"aec4fb6c-5de7-40e4-9e1e-fc3484900310","text":"Sigue sin funcionar 4g. No tengo cobertura. No funciona el nuevo chip. Ya hice todo. Y no funciona el chip en mi sector solo funciona claro"},{"id":"5e9d0b2d-f882-4f42-8bb5-534c48d4e240","text":"La maquina me sale con mensaje de error de comunicacion no se pudo realizar la transaccion. Actualice maquina y nada. Me dice hubo error en actualizacion"}]},{"name":"Problemas com emissao de boletas fiscais","examples":[{"id":"ef00c944-5555-4766-af23-dc93a515c3e7","text":"Nesecito urgente un tecnico se fue la opcion efectivo y no esta dando la boleta. No puedo dar boleta. Cuando viene alguien a solucionar este problema. Llevo 2 dias asi"},{"id":"9a8ea866-3da4-466a-9d5f-38c07d7e655c","text":"No me deja emitir boleta en mi points. Necesito emitir boleta. De Sii boletas gratis. Necesito ayuda. Muy mala"},{"id":"e1dc67f0-00bc-4875-ad4c-2c896fad18ac","text":"No me sale el point de pago en efectivo. Necesito ayuda, ya que no me sale el point de pago en efectivo"}]},{"name":"Falhas na entrega e logistica","examples":[{"id":"5e752cba-566b-4e7d-9781-5cd9bbc7df15","text":"No llega mi point. En camino. Me estoy arrepintiendo de esa compra. Ya eran las 7 pm del 5 y no llego nada"},{"id":"8afcf3d4-4cf0-4d52-888e-6a07ee5dddfa","text":"Quisiera solicitar rollos. La direccion a la cual enviaron esta mala"},{"id":"bcaece64-1d37-4051-9ebc-71d79e2e596f","text":"Quedaron de venir entre el 11 y el 13 de abril a entregar una Smart point nueva a mi negocio y no se han contactado conmigo. Regular"}]},{"name":"Suporte digital insuficiente — exige tecnico ou atendimento humano","examples":[{"id":"1e194f8a-f97f-4b03-b128-10fd9c9a4ddd","text":"Necesito un asistente que venga aca a mi local. Porq no me llamas mejor. Tengo problemas con la maquina no da la boleta"},{"id":"8395b88d-d955-48eb-bc6f-faeafe179b35","text":"No puedo hacer boleta. Ya lo hice no funciona me podrias mandar el tecnico. Quiero hablar con un ejecutivo"},{"id":"c148316e-1a49-461d-8c88-b1c554b02aa6","text":"Como puedo solicitar otra maquina por fallo. Pantalla y problemas en impresion. Muy mala. Necesito contarme con un asistente"}]}],"insight":"O grupo Outros do MLC concentra dores operacionais criticas que o canal digital nao consegue resolver de forma autonoma: falhas de conectividade SIM/4G persistentes mesmo apos troca de chip, bloqueio na emissao de boletas fiscais (especialmente a perda do icone de pagamento em dinheiro), e entregas sem rastreamento em tempo real. O padrao mais marcante e a recorrencia de clientes que ja tentaram as solucoes orientadas pelo bot e retornam ainda sem resolucao, escalando explicitamente para tecnico presencial ou atendente humano. A migracao Redelcom, embora com menor volume, contribui com casos onde o dispositivo permanece sem identidade Mercado Pago apos a transicao."}},"MLM":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":27,"n_promotores":20,"categories":[{"name":"Cobranca sem credito ao vendedor","examples":[{"id":"5509dd89-7ee0-4688-acbd-9013013cd68a","text":"El saldo no refleja en mi aplicacion. Y a mi cliente si se le desconto."},{"id":"5fdcba79-7617-4b1e-bccd-fb3a05a3c5ac","text":"Cobre un monto de $560 y en la tarjeta del cliente aparece que se hizo el pago y a mi no me aparece en mi app de mercado pago."},{"id":"032be616-8d0c-46b4-9ae1-9475969cb492","text":"No tengo el dinero ni mi cliente tiene el dinero en la tarjeta."}]},{"name":"Demora e falta de visibilidade no reembolso","examples":[{"id":"abe7b124-625f-4ec4-8a83-578a69ab48b8","text":"Porque no ha recibido el rembolso el cliente? Como puedo asegurarle al cliente su dinero pues necesita hacer la compra?"},{"id":"95dab478-47ed-4109-b08b-6be7a06f4dd3","text":"Dice que tiene un reembolso. Respuesta del banco emisor. Cuanto tarda yo si vale en devolver dicha cantidad?"},{"id":"c1d4bf8f-4e8a-488c-8f48-219a61fd4687","text":"Tengo un problema con una devolucion del 31 de marzo, me dice mi cliente que aun no se le ha reflejado su rembolso."}]},{"name":"Cobro duplicado ou inconsistente","examples":[{"id":"01444507-cd11-4efe-abeb-95d55a546e62","text":"A mi cliente le descontaron 4 veces y a mi solo me cayo dos veces."},{"id":"cec7fe5b-ae97-4485-8764-9fca981c4d23","text":"Tengo los comprobantes. El de $2500 se hizo otro cobro y tengo igual ese comprobante, lo cual no es el mismo. Que paso con estos cobros que no se me hicieron reflejados?"},{"id":"84a6b85a-7c77-4973-b695-324a555dfbaf","text":"Me falta el corte del dia 5 de abril, ese es el que no se ha reflejado y fue por un monto de 9250 pesos."}]},{"name":"Falta de comprovante e transparencia na operacao","examples":[{"id":"270cebc5-03bf-4696-bb9e-c60e6e13d217","text":"En izzi me piden un comprobante que no puedo sacar. En ningun lugar advierten o dicen los plazos y eso si nos afecta."},{"id":"6ac90bdb-d004-4cc9-8338-4a45a8e154ef","text":"Se me desconto de la otra banca y ni me llego. En el banco aparecio que si se desconto. Y entonces mi dinero donde quedo?"},{"id":"027f4645-58f2-4a21-94ab-81eb6306dc68","text":"Si se cobro de la otra tarjeta y tenia los fondos suficientes y aqui en mercado pago no se me refleja. Ya no tengo ese dinero en mi cuenta con la que pague."}]}],"insight":"O padrao dominante de insatisfacao nesta L2 e a dissociacao entre o que acontece no banco do cliente e o que aparece na conta do vendedor: o cliente e debitado, mas o credito nunca chega ao comerciante. A ausencia de transparencia sobre prazos de acreditacao e a impossibilidade de gerar comprovantes agravam a frustracao, pois o vendedor fica sem meios de comprovar a transacao para seus proprios clientes. Os reembolsos representam um segundo foco critico: demoras sem prazo claro e falta de atualizacao de status deixam tanto o comerciante quanto o cliente em estado de incerteza. A combinacao de falhas de conciliacao e comunicacao reativa do suporte transforma problemas pontuais em crises de confianca."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":22,"n_promotores":20,"categories":[{"name":"Falha na ativacao e vinculacao da terminal","examples":[{"id":"ac2f8d9d-8a2d-4e92-ab9b-f4a760b7d953","text":"Quiero activar mi nueva terminal y no me deja completar el proceso porque dice que no encuentra la direccion."},{"id":"dce5287c-989d-4b7f-8551-738432417a92","text":"Tengo una nueva terminal point Air y no puedo ingresar mi correo electronico. No puedo vincular mi cuenta a mi nueva terminal."},{"id":"71ad863c-2e29-4473-ae94-0eb27e794664","text":"Activar point. No conecta por Bluetooth."}]},{"name":"Gestao de multiplas terminais e portais","examples":[{"id":"aae8dc6a-d49e-4736-8268-d91d99a511c1","text":"Tengo tres portales para hacer mis cobros de mis negocios. Quiero programar los tres portales uno en cada negocio, pero que todo caiga en la misma cuenta."},{"id":"556b4b25-d194-45e3-a0de-71f20b045697","text":"Como agregar otra terminal. Eliminar una terminal point."},{"id":"7559c557-970e-4fa2-8485-d9b2fa86ae15","text":"Yo quiero ver los cobros que hizo un cliente al que le vendi una terminal y los quiero ver en mi gestion de terminales."}]},{"name":"Comissoes e terminais nao registradas no portal de representantes","examples":[{"id":"26a33b81-d398-48d5-8263-adfec7950b63","text":"Hice cambio de terminales pero no vienen registradas en mi portal de representante, asi no me van a pagar mis comisiones. No me contestan. Por que no tienen un numero para marcar?"},{"id":"f792802f-054f-4f17-976e-7a2fb9e822d7","text":"Necesito que mi cliente ya pueda utilizar la terminal. Ya ingrese los datos del numero de serie con los datos de mi cliente y falta nada mas."},{"id":"ea843de5-10e1-4dd3-b276-4a22503c0a52","text":"Vendi una terminal y al momento de hacer un cobro no se pudo. Con todas las tarjetas. Que atiendan bien y no una maquina."}]},{"name":"Erro de endereco no cadastro impede uso da terminal","examples":[{"id":"8808453a-afe3-4326-a408-c7b71371ea1c","text":"Pregunte como cambiar el domicilio, me mando a un link en donde nunca pude ingresar. No resolvio mi problema."},{"id":"dcc94d9b-634e-4f20-9e81-11cb4b50b673","text":"Compre una terminal de cobro para mi negocio de mercado pago y no acepta mi direccion, dice que no la encuentra. Tener un numero para hablar con alguien."},{"id":"b1ccdefb-d5ce-4391-844f-ce01acd4055a","text":"Ok pues esta terminal donde estoy escribiendo es donde consulto saldos y donde vinculaba Bluetooth. Mismo celular. Correo hotmail pero esta inactivo... lo activo?"}]}],"insight":"Nesta L2, a insatisfacao se concentra em dois perfis: o usuario final que nao consegue ativar ou vincular sua terminal por barreiras tecnicas no cadastro (endereco nao reconhecido, QR nao visivel, Bluetooth sem conexao) e o representante de vendas que enfrenta falhas no portal de gestao de terminais, comissoes nao registradas, cobros de clientes invisiveis e ausencia de suporte humano. A falta de um canal telefonico e mencionada explicitamente como agravante, indicando que o suporte via chatbot nao supre a complexidade desses fluxos. Representantes que vendem terminais para terceiros ficam especialmente vulneraveis: quando a ativacao falha, a relacao comercial com o cliente final tambem e comprometida."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Terminal nao processa cobranças (falha generalizada)","examples":[{"id":"b3798722-97ae-4eb4-9e36-f3c8643deabd","text":"No acepta ningun pago y la aplicacion de mercado pago parece estar fallando. Ya lo intente muchas veces con tarjetas y clientes diferentes."},{"id":"adc03576-fb67-46d6-b8e2-b820cfa5b2f1","text":"El point no deja hacer nada. Intentas cobrar y te dice incidencia activa."},{"id":"68e6203a-e10f-4e1a-9626-be70b9a62922","text":"Los clientes intentan pagarme y no me permite cobrar. Esto me sale con todas. Se cayo el sistema? No tengo acceso a mis cuentas y apartados."}]},{"name":"Rejeicao de cartoes especificos (vales, estrangeiros, mesma bandeira)","examples":[{"id":"67483814-0b64-4aad-97a0-17ab0898e2e2","text":"Mi terminal no esta aceptando las tarjetas de vales. Pero yo adquiri esa terminal para recibir tarjeta de vales y bancarias, entonces no sirve para vales."},{"id":"31dbe2fd-d4bf-4996-a5f3-e6c42f9a4f6f","text":"No puedo realizar dos cobros con la misma tarjeta. Tengo clientes que pagan una vez y quieren comprar otra vez pero el pago es rechazado."},{"id":"70f20769-7ad9-4a9b-b8eb-d536e42a34ef","text":"No esta aceptando cobros con tarjetas de vales, con ninguna. Aparece que no es posible hacer el cobro porque no es lo suficientemente seguro."}]},{"name":"Falha no Tap to Pay / NFC no celular","examples":[{"id":"aa867075-0737-4988-bd84-5dd80c2769ff","text":"Ya active mi NFC y no puedo cobrar con tap. Ya actualice mercado pago, ya hice prueba con otra tarjeta, ya quite la funda, ya cambie de wifi a datos, si detecta la tarjeta porque me dice que mantenga la posicion y no hace el cobro."},{"id":"6a9c6ad6-4c67-47d8-8f3e-92253d05db1b","text":"Cobre con tap to pay en el apartado gestion pero el dinero no se ve en mi cuenta aun, ya pasaron 10 minutos. No se hizo el cobro, no me aparece en movimientos."},{"id":"b6e59caf-3a5e-4f1d-9c58-36e288e71168","text":"Pagar con el telefono sin contacto. La solucion no esta para iPhone."}]},{"name":"Cobro congelado ou processado sem confirmacao","examples":[{"id":"ef8c904c-cac9-4ea9-83c6-bac3f2360389","text":"Cobre una cantidad, se quedo pasmada y decia que aun no se realizaba el cargo. Al regresar a revisar se borro y no genero el cargo."},{"id":"116192eb-965f-4070-aa02-b89f9bc9826a","text":"Fue una compra de un carro. El cliente paso 2 tarjetas. Pero el cliente ya se fue. Por que no paso?"},{"id":"a5678713-2663-4dec-8c0c-6185ca130bec","text":"Fallo en cobro cuando antes esa tarjeta si pasaba cobro. Antes con esa misma tarjeta si pasaban cobros sin problemas y ahora ya no."}]}],"insight":"Esta L2 concentra o maior volume de detratores e revela dois planos de falha distintos: sistemico e pontual. No plano sistemico, quedas do servico impedem todos os cobros simultaneamente. No plano pontual, cartoes de vales de despensa e pagamentos NFC via celular sao os pontos de maior friccao: comerciantes adquirem a terminal especificamente para aceitar esses meios e descobrem que nao funcionam, gerando frustracao por promessa nao cumprida. A experiencia de cobros que travam e desaparecem sem confirmacao cria um risco operacional adicional: o vendedor nao sabe se cobrou ou nao, e o cliente ja foi embora. O suporte reativo que sugere tentar novamente sem resolver a causa-raiz aumenta a insatisfacao."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Terminal nao liga (falha de fabrica ou bateria)","examples":[{"id":"16ff819f-72fb-486e-91c4-8b95708b681f","text":"La point smart 2 que me mandaron no funciona, no prende y ya esta conectada a la luz electrica. Como ni siquiera se uso, la abri del paquete y no funciono. No hay opcion de cambiarla o que me devuelvan mi dinero."},{"id":"7dbcab45-5dc3-4392-9d09-09c9ff465d6d","text":"La terminal no enciende, ya hice lo que pidieron cargarla 4 horas y no encendio. Solo cuando la conecto al cargador se ve el logo de mercado pago pero se quita y no responde al boton de encendido."},{"id":"99af5e3b-a319-4f8a-a1b6-6196e2a9fa3b","text":"No enciende, solo vibra cada 4 segundos pero no enciende, aun conectando el cable de carga. La conservo siempre en su caja despues de usarla."}]},{"name":"Terminal trava, reinicia ou nao le cartoes","examples":[{"id":"868d4fbc-c1ba-42b8-b334-aaa5efb842d8","text":"Se traba y tarda para hacer un pago o una recarga. Me gustaria cambiar la terminal por una mas reciente."},{"id":"6ba8c8be-0405-4c93-a91c-66b6cfefd7d3","text":"La terminal de cobro esta fallando. Se reinicio varias veces y sigue asi. Despues se intento cobrar con 3 tarjetas diferentes y no se pudo."},{"id":"1e9e29d5-517d-433e-8986-72182815af49","text":"No puedo cobrar con mi terminal. No lee la tarjeta, de todas las maneras. La quiero como remplazo por falla actual."}]},{"name":"Reenvio de terminal com mesma falha ou sem resolucao","examples":[{"id":"1c879262-3566-4e15-8bd3-02b83a06fb65","text":"Regrese una terminal de 6 dias por un problema en el idioma y por no poder hacer recargas y me mandaron otra con la misma falla."},{"id":"408e6f09-7c82-4c74-93ae-bf0a2511fd75","text":"Me llego la nueva terminal y me sigue apareciendo la leyenda de en este momento no podemos aceptar pagos con esta tarjeta. Necesito una terminal para hacer mis cobros."},{"id":"3be7f521-439a-42cb-b7f8-18221f449a6c","text":"No funciona mi terminal, es casi nuevo, no prende. Hola, ya puse a cargar el equipo por 2 hrs y no ha prendido. Ya pasaron 4 hrs y no prende. Cuando llegara el reemplazo?"}]},{"name":"Atualizacao de firmware causa regressao funcional","examples":[{"id":"953273a7-5e7d-495a-89e2-0172dec835d9","text":"No me gusto la actualizacion de la terminal point 2. Todo funciona bien pero la otra actualizacion me gustaba mas, le entendia mas. Solo quiero la otra actualizacion."},{"id":"f717f104-3b77-46e4-98af-a03f52df1d39","text":"No puedo cobrar mi terminal, no me deja actualizar. No se actualiza y no puedo cobrar."},{"id":"f00b3c77-48d4-4a1a-a9d1-11d713686ee3","text":"Se traba, no responde, se pone pantalla negra. Siguio igual. No se hace cobro, se pone pantalla negra. Ya hice todo y no queda."}]}],"insight":"Esta L2 evidencia um problema estrutural de qualidade de hardware: terminais chegam do estoque sem funcionar (falha zero-day), falham precocemente apos pouco uso ou ficam presas em loop de inicializacao apos atualizacoes. A recorrencia de terminais que nao ligam mesmo carregando 4 horas e a quantidade de usuarios que reportam o mesmo sintoma sugere um defeito de design ou lote de producao. O ciclo de RMA e percebido como ineficaz: a reposicao chega com a mesma falha ou leva tempo excessivo. Atualizacoes de firmware aparecem como fator adicional de instabilidade, revertendo funcionalidades que antes operavam corretamente, o que reduz a confianca dos usuarios no produto ao longo do tempo."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Terminal nao entregue ou marcada como entregue incorretamente","examples":[{"id":"0179d22b-fe97-4306-bb4b-a1ae478c8fab","text":"Hice un pedido y se robaron mi paquete. Ya revise y aparece como entregado pero a mi no me entregaron nada. Me mandaron la foto junto con que me entregaron."},{"id":"f9be6170-c5a6-414a-b510-4b40dad2fb5f","text":"Nunca recibi la terminal mini y el sistema indica que si."},{"id":"fefa0930-11f8-4c4a-979f-205e3b3ae149","text":"Terminal no entregada. No fue recibida y la direccion es correcta."}]},{"name":"Atraso excessivo na entrega com prazos nao cumpridos","examples":[{"id":"bc4f5f25-fd80-4c68-ab11-759374e0de9e","text":"Ya tiene dos dias que manana llega. Otro dia sin llegar mi pedido. Desde el dia 6 de mayo que lo compre me han traido vuelta y vuelta, me estan mintiendo."},{"id":"635a271f-697c-4e40-9196-7d892298eb3d","text":"Realice la compra de una terminal y no me ha llegado. No me dice fecha de entrega y no me da oportunidad de cancelar la compra. Ya lleva dos semanas que la compre."},{"id":"31335660-575f-490c-b80b-6fef880639e0","text":"No llega mi pedido de point y me urge y cambian constantemente el envio."}]},{"name":"Impossibilidade de cancelar ou redirecionar pedido","examples":[{"id":"01d2561e-5b14-48af-9bae-40e33f299fb5","text":"Hola, quisiera cancelar una devolucion de una point smart 2. Quiero cancelar una devolucion y no me deja el sistema aunque siga los pasos que me indico el asistente."},{"id":"99b282f3-df88-44d6-b464-af4c6169b69a","text":"Que puedo hacer si no tiene la opcion de cancelar?"},{"id":"09a0c429-f476-4827-803e-d487cd9bc657","text":"Hice el cambio de domicilio para entrega y no me lo hicieron valido. Lo hice desde el momento de la compra. En el domicilio que van a entregar llega siempre despues de las 9:30 y no hay quien lo reciba."}]},{"name":"Nao recebimento de insumos (rolinhos de papel)","examples":[{"id":"3d70f84b-ca25-4259-b42e-3571aa43c980","text":"No recibi mis rollos de impresion. Los vecinos dicen que vino el repartidor y no lo dejo en ningun comercio y se retiro con el paquete."},{"id":"2b55e736-dc90-4651-9d09-013726b05a31","text":"Unicamente para informar que no recibi los rollos de papel. Yo estuve esperando y nunca entregaron rollos."},{"id":"820090b5-b423-4d7f-9c47-a270fb1d89e1","text":"El domicilio de mi pedido de rollos para terminal esta incorrecto."}]}],"insight":"Esta L2 apresenta dois clusters de insatisfacao bem definidos: problemas com a entrega da terminal em si e problemas com insumos recorrentes (rolinhos de papel). No caso das terminais, a divergencia entre o status logistico ('entregue') e a realidade do cliente ('nao recebi nada') e o ponto de maior atrito. Prazos prometidos que sao reiteradamente adiados sem comunicacao proativa esgotam a paciencia do comerciante. A impossibilidade de cancelar ou redirecionar pedidos pelo app/chat bloqueia qualquer tentativa de autoatendimento e forca o cliente a permanecer em um estado de espera passiva. Os problemas com rolinhos indicam que toda a cadeia logistica de consumiveis tambem apresenta falhas sistematicas de entrega."}}};

const DRILLDOWN_MAR_MAY = {"TOTAL":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Saldo nao creditado apos venda aprovada","examples":[{"id":"6ff19eb7-de24-41df-9eb6-c8061c941050","text":"Nao estao caindo as vendas e nem os Pix diretos. Nao estou recebendo nem Pix nem cartao"},{"id":"5fdcba79-7617-4b1e-bccd-fb3a05a3c5ac","text":"Cobre un monto de $560 y en la tarjeta del cliente aparece que se hizo el pago y a mi no me aparece en mi app de mercado pago"},{"id":"d41b3d3d-3ecc-453f-80bb-12389c8543ed","text":"A transacao foi feita e descontada pelo cartao do cliente. Mas nao recebi o valor"}]},{"name":"Reembolso ao cliente demorado ou nao refletido","examples":[{"id":"9d6ba3b9-e5ed-404c-b642-701d3cdc1eb3","text":"Aun no se refleja la devolucion a mi cliente"},{"id":"ced5d521-6096-45fd-a23c-101051c3d9c6","text":"Ya clienta mando estado de movimientos y no se refleja la devolucion y por consiguiente me esta presionando"},{"id":"b8fdb234-6ba8-48d4-9ecb-eb91fe29a8c3","text":"Mi cliente no ha recibido el rembolso. Mi cliente me exige su dinero"}]},{"name":"Cobranca duplicada ou valor incorreto cobrado do cliente","examples":[{"id":"6225d9a2-18a5-4200-8733-f431ea739ef5","text":"Fiz uma cobranca no sabado e as 13:27 foi cobrado o mesmo valor so que nao foi passado o cartao e o cliente esta me cobrando"},{"id":"c270b315-29dd-4cb2-a071-3cf6cdeaf7b4","text":"Cliente pagou 2x e so entrou 1x. A maquina desligou assim que aprovou e saiu da tela"},{"id":"55079652-411d-4922-8a0e-99478a294500","text":"Hice un cobro y no aparece en mi saldo. Al cliente le aparecia el cobro en su banco"}]},{"name":"Estorno sem comprovante e atendimento insuficiente","examples":[{"id":"082904c8-1630-4fc5-a446-85ce3401bbad","text":"O Santander esta pedindo o numero do protocolo de estorno. O banco alega que nao houve estorno e isso esta me aborrecendo"},{"id":"a3a2b04d-1d60-4f53-8e1d-466abc4249a3","text":"Pessima, volta com atendimento humanizado"},{"id":"6485cda5-6a2d-4cb2-9325-2e03bf3c2f0e","text":"Estorna este dinheiro. Como empreste pegou 147 se eu nao fiz acordo. Muito ruim"}]}],"insight":"O padrao central de insatisfacao e a dessincronia entre o que ocorre no sistema do cliente e o que aparece na conta do vendedor: vendas aprovadas que nao caem, reembolsos que nao se refletem e cobranças duplicadas geram pressao financeira imediata sobre o lojista. Os promotores conseguem resolucao porque o suporte rastreia a transacao e confirma os prazos; os detratores reclamam da falta de confirmacao e da ausencia de prazo claro. O atendimento bot e percebido como insuficiente para casos financeiros sensiveis, com pedidos recorrentes de atendimento humano."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Vinculacao ou pareamento da maquininha com conta falha","examples":[{"id":"71cd0429-f4ad-4494-9e61-05648f4ea5a4","text":"Preciso tirar uma conta antiga da minha point e conectar uma nova conta. A minha senha ta bloqueada. Muito ruim"},{"id":"dce5287c-989d-4b7f-8551-738432417a92","text":"No puedo vincular mi cuenta a mi nueva terminal. No me pide nada de eso solo pide escanear la pantalla de la terminal. Cuanto tiempo va estar asi?"},{"id":"d7b919ca-38ca-410c-a84a-79b48d4fd46b","text":"Como vinculo la terminal a mi aplicacion. Muy mala"}]},{"name":"Ativacao de funcionalidades bloqueadas ou indisponiveis","examples":[{"id":"bf356e69-c690-4da6-aa9d-3b389146567c","text":"Aceitar vale refeicao. Nao respondeu o que eu estava pedindo, passando uma informacao errada. Muito ruim"},{"id":"84d154ff-21d2-47fa-a39d-4216cfe3a4fb","text":"Necesito activar la opcion de hacer boletas con mi maquina. Ya hice eso y nada. Muy mala"},{"id":"6a99faed-677d-4ef5-801e-d2f81023b776","text":"Meu codigo de ativacao. Codigo de afiliacao Alelo. Maquininha dando erro. Muito ruim"}]},{"name":"Erro de login, senha ou codigo de acesso ao dispositivo","examples":[{"id":"9e694a84-1495-416a-935b-697305a21dfd","text":"No puedo iniciar sesion. No me llega el codigo que pide. Muy mala"},{"id":"fb4aedf1-ef7b-423e-88ad-435d7941534a","text":"La maquina me pide todos los dias escanear el codigo QR cada vez que la prendo, lo que es un problema por yo no siempre estoy presente"},{"id":"bcb017e3-af71-430f-8b54-60b1c972a50d","text":"Nao sei qual e o codigo de ativacao dessa maquininha, o que eu faco? Regular"}]},{"name":"Transferencia de titularidade e desvinculacao de conta","examples":[{"id":"be199a9e-d84e-47a2-944b-050691610b6a","text":"Necesito dar de baja el mini point de mi cuenta. Muy mala"},{"id":"2e6683f3-6e27-4d54-b146-526fb24d5c7f","text":"Compre una maquina mercado pago para cobros y quiero entregar a mi madre para el negocio. Me dice que eso no es asi. Quiero que me devuelvan el dinero. Muy mala"},{"id":"ebd63326-13c7-4cc4-8722-50e9f5fd6682","text":"Tengo otro equipo de Point a nombre de mi marido que fallecio recientemente, no se podria modificar los datos"}]}],"insight":"A friccao dominante concentra-se em dois momentos criticos: configuracao inicial (pareamento, ativacao e login) e gestao de titularidade (trocar conta vinculada, desativar terminal ou transferir propriedade). Os detratores relatam que o bot fornece instrucoes genericas que nao resolvem o caso concreto, especialmente quando ha bloqueio de senha ou ausencia do QR code para vinculacao. A impossibilidade de gerenciar multiplos dispositivos e contas de forma autonoma e uma dor estrutural que o produto ainda nao resolve adequadamente."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Pagamentos recusados por controles de risco ou seguranca","examples":[{"id":"309936a4-1259-4193-8d50-76ea08a0a6c8","text":"Porque me rechazan los pagos? Me aparece el cobro no supero nuestros controles de seguridad. Muy mala"},{"id":"392274ee-6bba-434d-a5da-44576c361f75","text":"Toda cobranca que faco da essa mensagem. Tenho que ser obrigado a usar outro aplicativo pois nao to tendo uma experiencia boa com o mercado pago"},{"id":"f764e02d-25c9-488b-af86-f02d9a05f322","text":"Voces estao barrando as minhas vendas por qual motivo? Eu nao quero controle de seguranca eu quero e receber"}]},{"name":"Maquininha nao processa cartao (erro operacional)","examples":[{"id":"8efe367b-0011-4e89-83ad-a0b5e5b4fbeb","text":"3 maquininha, todos nao consegui passar cartao. Hoje perdi venda. Qual o tempo de espera?"},{"id":"458aa0d4-0fb5-42fc-a7b0-068d7a93554f","text":"No me pasa los pagos. Aun no funciona he perdido ventas"},{"id":"de2b9018-6dc3-4c72-8771-5f7228832c27","text":"Falla al cobrar tarjetas de credito. Rechazada. Casi todas"}]},{"name":"Metodos de pagamento nao aceitos (vales, estrangeiros, NFC)","examples":[{"id":"75be5d0e-0b5b-4dc2-a43e-fc2ed3321715","text":"Minha maquininha nao aceita cartao estrangeiro. Esses cartoes passam sem problemas em outros lugares"},{"id":"102b24ad-f349-4b4d-a9ba-361c29bb370b","text":"Como posso ativar meu ponto tap. Quando coloco o valor rejeita o recebimento. Muito ruim"},{"id":"eef913aa-1e9b-4edb-9d62-09a0a40fd850","text":"Maquininha mercado pago point pro 3 nao ta passando pix qr code. Por que?"}]},{"name":"Bloqueios e duvidas no Tap to Pay / Point Tap","examples":[{"id":"c8f813ca-e2c8-4368-935f-657650322328","text":"Nao estou conseguindo cobrar com point tap. Aparece que em 30 segundos iria pedir para aproximar o cartao no telefone mas nao sai disso. Muito ruim"},{"id":"4b0b2ecd-8cf4-4a4f-a860-fd0dbabdfc8e","text":"Como ativo o Tap to Pay no iPhone? Nao da no meu celular"},{"id":"8ce67afa-79b5-4ae4-aa32-b0fb0503a400","text":"Gostaria de fazer uma cobranca nao consigo com cartao de credito. Continua recusando. So recusa o pagamento"}]}],"insight":"O problema central e a perda de vendas em tempo real: recusas inesperadas de cartoes, especialmente acionadas por filtros de risco opacos, geram insatisfacao imediata porque o lojista perde o cliente na hora. Promotores resolveram porque o suporte identificou instabilidade geral ou orientou alternativas; detratores ficaram sem resposta concreta sobre por que controles de seguranca bloquearam transacoes legitimas. O crescimento do Tap to Pay cria nova camada de atrito, com usuarios que nao conseguem ativar ou usar a funcionalidade em dispositivos compativeis."},"Point reader hardware faults and RMA":{"n_detratores":40,"n_promotores":25,"categories":[{"name":"Terminal nao liga ou nao carrega (morte subita)","examples":[{"id":"59e8848e-8932-4992-bad7-8f1b6e46f0cb","text":"Ela ja passou 4 horas carregando, e depois dessa carga nao acendeu mais nada. Vou procurar outra empresa"},{"id":"027a985b-b6f1-4c3a-867b-6311a15fba2a","text":"Lo conecte y no se prende, solo aparece una flecha. Ya lo deje cargando toda la noche y nada"},{"id":"52a0d980-0f10-4b33-a863-b2aa641b135d","text":"No prende. Ya lo deje cargando mas de 2hs y no prende. No encendio, tampoco hizo luz ni vibracion."}]},{"name":"Leitura de cartao com defeito (chip, tarja ou NFC)","examples":[{"id":"911e0c49-cb66-4dac-a83e-a6a35743b2c4","text":"Nao le o cartao. Esta so na leitura do chip. Aproximacao funciona sim so o chip nao le"},{"id":"d1118721-7a4a-4641-b05d-69c6b7e81da2","text":"Nao passando cartao. Chip nao esta lendo. Nao reconhece o cartao inserido"},{"id":"b9baa99b-09d8-4bbe-ab63-bf47c5dc228e","text":"Cai no mesmo erro independente de qualquer cartao. Quero a troca. Porem nao posso ficar sem a maquina porque trabalho com ela"}]},{"name":"Troca em garantia sem resolucao ou processo confuso","examples":[{"id":"4bb357e8-7ba0-4e98-a457-ea2e05d545d7","text":"Fazer troca point pro 3 terminal bloqueado chaves. Troca em garantia. Muito ruim"},{"id":"96332c66-ab0c-49f7-8c1c-d2a17e020d6e","text":"Ya no enciende mi terminal. No puedo descargar la etiqueta para envio. No descarga nada. Regular"},{"id":"f52b229a-cd29-4280-a929-5d601bce74ad","text":"Nao liga. Porque se nao viesse representante, pelo menos mandasse a pessoa. Ali so tem uma maquina e eu vou esperar. Muito ruim"}]},{"name":"Falhas de software e tela travada","examples":[{"id":"00bb5549-4c9e-493e-8936-e615dded2899","text":"NO ACEPTA HACER NADA EN LA PANTALLA. YA SE REINICIO VARIAS VECES. Muy mala"},{"id":"11c455e9-4c83-488d-834f-e6a2674fe93b","text":"Quando eu coloco em tentar novamente so volta a mesma tela mesmo reiniciando. So da sem conexao com a Internet"},{"id":"bb1cec76-eb1f-49f4-9386-0053a19df292","text":"Minha point pro 2 liga mas nao funciona. Fiz o procedimento de 20 segundos e continua aparecendo Gertec."}]}],"insight":"A morte subita do hardware — terminal que nao liga mesmo apos horas no carregador — e o problema mais frequente e urgente, afetando diretamente a operacao do lojista. A percepcao de que produtos novos apresentam defeito de fabrica agrava a desconfianca na qualidade do produto. O processo de troca em garantia e um segundo ponto critico: detratores relatam dificuldade em baixar a etiqueta de envio, falta de orientacao clara e ansiedade de ficar sem maquina durante a troca. Promotores obtiveram score alto precisamente quando o suporte indicou caminho claro para o RMA."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":39,"n_promotores":25,"categories":[{"name":"Terminal nao entregue ou entregue no endereco errado","examples":[{"id":"b5cfe720-9a5c-4033-bee9-994d465b39ee","text":"Comprei uma point, diz que chegou mas nao recebi. O entregador nao coloca o nome de quem recebeu a mercadoria, ja perguntamos para todos familiares e vizinhos e nao achamos o pacote. Muito ruim"},{"id":"0179d22b-fe97-4306-bb4b-a1ae478c8fab","text":"Pedi mi Smart point y no me llego. Me mandaron la foto junto con que me entregaron pero aun no me entregan nada. Muy mala"},{"id":"fefa0930-11f8-4c4a-979f-205e3b3ae149","text":"Terminal no entregada. No fue recibida y la direccion es correcta. Regular"}]},{"name":"Impossibilidade de alterar endereco de entrega","examples":[{"id":"1dd427c3-573e-4320-bc97-c6d8bb672933","text":"Por que no puedo cambiar la direccion? Si no se puede no deberian tener la opcion como si si se pudiera"},{"id":"bd144286-d79c-420d-9d9a-02e8eb57efb1","text":"Endereco da troca errado. Estava com o endereco de entrega errado e nao deu a opcao de modificar o endereco"},{"id":"55a6713a-0b7a-4119-aa30-0d06465d0d8f","text":"Me cambie de domicilio y no podre recoger mi paquete si se pudiera reenviar a alguna agencia. Regular"}]},{"name":"Bobinas de papel indisponiveis ou nao entregues","examples":[{"id":"2e9a40d2-dc92-407d-a5d6-48d6c016d047","text":"Quero bobinas pra minha maquina. Porque as bobinas de papel agora sao compradas e as minhas estavam molhadas. Muito ruim"},{"id":"4d81f21f-98f1-4fd2-bca3-7372f66775a9","text":"Nunca me chegaram. Nao encontro a opcion de tu pedido. E como hacemos no tengo mas papel. No me dan solucion"},{"id":"db067830-70bb-4c76-969a-a22339fb8335","text":"Nao consigo pedir bobina. Seu controle esta incorreto quando afirma que ainda nao alcancei 50% de uso das bobinas para poder pedir. Regular"}]},{"name":"Cancelamento e devolucao de compra sem reembolso claro","examples":[{"id":"1bdb604e-0b60-4111-8f33-7e899fdf2e41","text":"Quero meu dinheiro de volta e nao quero essa maquininha. Eu acabei de comprar, eu nao quero mais, por favor devolve meu dinheiro. Muito ruim"},{"id":"a33478ba-0b10-4be8-8cfd-8f062eea918a","text":"Aun no me llega quiero cancelarlo. No quiero una renta mensual. Regular"},{"id":"d7f26b34-83b7-49b5-a32b-511a3d29dace","text":"Cancelar. Devolucion. Como reembolsar ya mi dinero. Muy mala"}]}],"insight":"A entrega malsucedida da terminal e o gatilho mais critico: o cliente pagou, o sistema marcou como entregue, mas o produto nao chegou. A impossibilidade de alterar endereco apos a compra e uma falha de produto que frustra quem mudou de local ou comprou com dados desatualizados. Bobinas de papel tem dois pontos de dor: o criterio de elegibilidade e opaco e frequentemente contestado, e o pedido falha sem explicacao. Promotores resolvem porque o suporte age diretamente; detratores ficam em loop sem acao concreta."}},"MLA":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":12,"n_promotores":20,"categories":[{"name":"Impossibilidade de contactar o comprador para resolver erros","examples":[{"id":"d7ba7c4f-8133-4ac2-b013-418c07484b2d","text":"en ves de poner 129.000 puse 12.900 como puedo dar con el cliente. Gracias igual de nada me sirvio el asistente ni mercado pago"},{"id":"c05e32cc-72f6-4112-95b8-9c70020e88fd","text":"Necesito comunicarme con el. No tengo el contacto del cliente, por eso les estoy pidiendo una ayuda para llegar a el. Necesito una solucion"},{"id":"dcd97776-045d-4e08-bc9f-522500d6a99a","text":"Realice un pago equivocado a un cliente, necesito comunicarme con el. Necesito el numero de celular del comprador. Muy mala"}]},{"name":"Devolucao acidental e dificuldade de reverter a operacao","examples":[{"id":"2e291db6-3b4c-47f1-98f9-2af5a0700500","text":"Sabes que este pago no era para devolver. Es que mi nene lo hizo sin querer. Muy mala"},{"id":"120e3bc5-a2da-4f25-be73-9db1aaeba733","text":"Necesito contactarme con el cliente o que ustedes le digan que hubo un error y le hice la devolucion sin querer, asi se acerca al local para volver a pagar"},{"id":"b969e696-e8c3-4130-bdb9-6f68c60f0180","text":"No tengo en claro el monto que debo devolver para anular la transaccion por completo y que ni el cliente ni nosotros perdamos dinero. Regular"}]},{"name":"Acreditacao nao confirmada pelo cliente / pagamento pendente","examples":[{"id":"474428f1-92e9-4429-81c0-38822c26e511","text":"Mi cliente no recibio su dinero. Regular. Mi cliente no recibio su dinero"},{"id":"99efa335-6ad2-4af2-b38b-f4fab86f377f","text":"no se le acredito el dinero al cliente. tenes un numero de reclamo para presentarle al banco? El cliente esta muy disconforme"},{"id":"a243a11e-1e03-42aa-99a5-a81ba6aec51f","text":"como saber si se devolvio el dinero de una anulada"}]},{"name":"Atendimento sem resolucao concreta","examples":[{"id":"8699e20e-8b66-40d4-aec1-a7eea9a5d7ca","text":"Hola necesito que me ayudes a configurar el posnet de mercado. No pude escanear para comprobar que soy yo. Ya no se que mas hacer"},{"id":"1540e0b1-d3e6-4d9c-9cd0-03dc359bc673","text":"Como ago para imprimir un comprobante en mi poind. Regular"},{"id":"c308389e-d472-4867-9ca0-9bcea677ea51","text":"Quisiera obtener un postnet point. Muy mala"}]}],"insight":"O principal ponto de dor neste L2 e a impossibilidade de o vendedor acessar os dados de contato do comprador quando ocorre um erro de cobranca ou devolucao acidental: o Mercado Pago nao oferece canal de recontato entre partes. Os promotores conseguem resolver duvidas simples de processo, mas detratores ficam presos em situacoes que exigem intervencao humana ou dados que o assistente nao entrega. O atendimento bot e percebido como incapaz de dar solucoes concretas em casos que fogem do fluxo padrao."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":34,"n_promotores":19,"categories":[{"name":"Dificuldade para comprar o Point / opcao nao disponivel","examples":[{"id":"9d2aa2d8-123b-4272-993b-db3a841ba790","text":"La opcion de compra de point mini no existe solo te ofrecen el smart. No figura. Muy mala"},{"id":"a6e8c30f-de28-4399-9958-9830388e8237","text":"Necesito comprar un point para mi negocio. Necesito comprar un point a $999. Muy mala"},{"id":"af6622ce-181f-4b7b-b85f-c96aec556826","text":"si, quiero poder comprar el point a ese dinero pero me dicen que no puedo. No consegui lo que esperaba asi que malisima, chau"}]},{"name":"Problemas de vinculacao / desvinculacao e acesso ao dispositivo","examples":[{"id":"f5c28990-83a0-4231-a8c3-ec9f1f094d0c","text":"no puedo conectar el lector a mi cuenta. QR no aparece en el Point. Muy mala"},{"id":"7788872a-05b2-4eaf-baae-6bc5078991b3","text":"Ya no tengo acceso a esa cuenta, quisiera solamente sacar la cuenta de ese posnet. Pasame con alguno de soporte. Muy mala"},{"id":"39a4cb2e-0ec7-49f0-97a5-aa4cc5c4fd3b","text":"Quiero dar de baja mi dispositivo point. Quiero desvincular y dar de baja porque no lo uso mas. Regular"}]},{"name":"Tarjeta alimentar / redes regionais rejeitadas no Point","examples":[{"id":"1f088db7-fd1f-4e40-822e-c40919d801f5","text":"Paso la tarjeta alimentar por el posnet y me sale hablar con el banco emisor. Muy mala"},{"id":"ca92abfd-662b-450b-9a77-78fdc07fc23e","text":"No me deja aceptar la tarjeta alimentaria independencia. Solo con la tarjeta alimentaria visa"},{"id":"f4346db4-ec7d-4641-972f-d1cf0c074cda","text":"Porque no me recibe la tarjeta alimentaria el posner. Que el banco no la recibe. Regular"}]},{"name":"Gestao do dispositivo apos falecimento / mudanca de titularidade","examples":[{"id":"984f8b73-ef71-40b9-b7d1-95f57566686f","text":"Tengo que devolver el point y nose como reiniciarlo de fabrica ya que sigue saliendo la foto del usuario. Y no me deja acceder al menu. Muy mala"},{"id":"ebd63326-13c7-4cc4-8722-50e9f5fd6682","text":"Yo tengo otro equipo de Point a nombre de mi marido que fallecio recientemente, no se podria MODIFICAR los datos."},{"id":"be199a9e-d84e-47a2-944b-050691610b6a","text":"Desactive los servicios de manera definitiva. El point. Muy mala"}]}],"insight":"Os detratores revelam duas grandes lacunas: a jornada de compra do Point frequentemente quebra (promocoes anunciadas nao aparecem na conta, modelo desejado nao esta visivel) e operacoes de gestao do dispositivo — vincular, desvincular, resetar, alterar titularidade — nao tem fluxo self-service funcional. A rejeicao da tarjeta alimentar e um ponto de atrito especifico de alto impacto para comerciantes que atendem programas sociais."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":35,"n_promotores":19,"categories":[{"name":"Rejeicao por controles de seguranca sem explicacao ou solucao","examples":[{"id":"131703f2-7bb9-44cd-826a-20802036b77e","text":"ME SALE RECHAZADO PORQ SEGUN DICE Q NO PASE LOS CONTROLES DE SEGURIDAD. LA TARJETA TIENE MARGEN. Y Q SOLUCION ME DAN?"},{"id":"309936a4-1259-4193-8d50-76ea08a0a6c8","text":"Porque no puedo cobrar con tarjeta de credito. Con todas las tarjetas. Muy mala"},{"id":"cae7e86a-58bb-4159-89ae-d7afb66b99d0","text":"Quiero cobrar con tarjeta y me dicen que no supero los limites de seguridad. Ayudame con otra forma de cobro, el cliente me dice que la tarjeta tiene saldo suficiente y la usa todos los dias"}]},{"name":"Tarjetas especificas nao aceitas (redes regionais / alimentar)","examples":[{"id":"a0362a98-d3ab-478a-b691-f618bc1f7335","text":"Porque el posnet no me recibe la tarjeta independencia. Pero lo solia recibir. Muy mala"},{"id":"960abcb8-2086-4807-bd8e-c8cc60a8ed67","text":"Las unicas que eh probado son cordobesa y naranja x y no las toma. Point mini. Regular"},{"id":"4a13564b-bb3a-4f19-877e-2d3dc61ca3ea","text":"hoy quise cobrar y no me habilito el cobro. Y que ago no recibo tarjeta naranja. Regular"}]},{"name":"Dispositivo sem sinal / nao liga ao tentar cobrar","examples":[{"id":"0119a63e-3f56-4b8c-b72d-4d642e1c28b6","text":"Dejo de funcionar el posnet. No carga. Totalmente apagado. Muy mala"},{"id":"9d69addd-a426-49c7-b390-9debe524d23e","text":"mi posnet no enciende, lo deje enchufado toda la noche. No muestra senal. No puedo cobrar en mi local. Regular"},{"id":"544116bc-0380-4a03-9789-18fb17ff2481","text":"Mi Point Smart no funciona quiero solicitar un cambio. Desde hoy intento prenderlo y no da ningun tipo de senal. Porque no puedo reemplazarlo?"}]},{"name":"Duvidas sobre limites de cobranca e taxas sem resposta clara","examples":[{"id":"49c90d23-be41-49e7-b330-6176ec347af4","text":"A un cliente 4 tarjetas y no podia cobrar. Rechazado por seguridad. Tiene algun limite porque 180mil no dejo cobrar? Regular"},{"id":"90f81624-fffd-459d-9fe1-0a854268fcb3","text":"Acabo de cobrar 661.000 y me depositaron 530mil, a que se debe? Regular"},{"id":"4d8b9018-6b46-4370-8963-ade3a09fdf0c","text":"El point cobra con tarjetas extranjeras? No me contesto la pregunta, dice que deberia en vez de darme la seguridad de si o no"}]}],"insight":"A rejeicao por controles de seguranca e o tema dominante: comerciantes sao bloqueados sem aviso previo, sem explicacao inteligivel e sem alternativa oferecida pelo assistente, causando perda de venda no momento do atendimento ao cliente. Redes regionais (Naranja X, Cordobesa, tarjeta alimentar) nao funcionam consistentemente e o bot nao confirma quais bandeiras sao aceitas. Ha confusao recorrente sobre limites de cobranca."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Dispositivo nao liga apos carregamento","examples":[{"id":"cf30d3d8-9ddd-413b-a985-17af1c485fba","text":"No enciende. Segui las instrucciones y no funciona. No da senales. Soy usuario hace anos y no me van a reemplazar un dispositivo que no funciona"},{"id":"24a602ed-6847-42d2-bf2d-a2ec4f586bd0","text":"solo lo use 2 veces y ahora que quiero prenderlo no prende. Ya realize todos los pasos. Solo prende 2 segundos y se vuelve a apagar. Muy mala"},{"id":"b260b422-a7c4-4dc9-8bb5-d3ff360895ae","text":"Ya lo tuve cargando 24 hs y nada. Estoy perdiendo venta por el lector no funciona y el cambio demora. Regular"}]},{"name":"Recusa ou demora no processo de recambio (RMA)","examples":[{"id":"4d494824-576c-4fd3-8c6e-f8267e64a4a4","text":"NO ENCIENDE. NO VIBRA. NINGUNA LUZ. NO ENTIENDO POR QUE NO ESTA HABILITADO EL RECAMBIO. USO RECIENTE???"},{"id":"9f5638ab-04e5-47a3-be1c-27fe937e3522","text":"Ninguna senal ya intente lo mismo. No me soluciona nada. Necesito me reemplacen los dos equipos."},{"id":"2219134b-129b-4193-9c98-7aca05f37a86","text":"Que clase de broma es esta? Como pueden haber empeorado tanto el servicio de atencion al cliente. Necesito un cambio de POS para mi local"}]},{"name":"Impacto no negocio por falta do dispositivo sem alternativa","examples":[{"id":"a64f11aa-decc-445b-a859-78238d0b95b6","text":"probe absolutamente todo y el equipo no prende, no carga, no da ningun tipo de senal de vida, necesitaria un recambio. Lo deje absolutamente toda la noche y no hizo nada. Muy mala"},{"id":"6a704b9d-d3b2-459a-9ac6-f735233961cf","text":"El equipo esta en el comercio y yo no estoy en el comercio, necesito el point. Necesito solucion para el point"},{"id":"9340db78-f06b-4c47-b0ce-2cab122f77a8","text":"Quiero trabajar con el posnet. Quisiera que me cambien el point smart. No hay servicio tecnico? Muy mala"}]},{"name":"Falha intermitente / reinicializacoes constantes durante cobranças","examples":[{"id":"fbbd6bb5-a8b1-4720-afd2-9221067b7fa0","text":"Un par de veces al dia tengo que reiniciarlo para que realice los cobros. Despues de estar gestionando el cobro, me sale un cartel que no se puede realizar. Regular"},{"id":"00bb5549-4c9e-493e-8936-e615dded2899","text":"NO ACEPTA HACER NADA EN LA PANTALLA. YA SE REINICIO VARIAS VECES. Muy mala"},{"id":"d0a8ab3e-3f59-4752-a66a-4f2aeda2a4a1","text":"Rechaza cobros, dice que no hay conexion. Pero tenemos conexion a internet. Regular"}]}],"insight":"O Point Smart que para de ligar e o padrao de dor mais homogeneo, com usuarios que esgotaram todas as etapas de troubleshooting (cabo original, enchufe de pared, 4+ horas de carga) sem resultado. O criterio de elegibilidade para RMA (uso recente) e percebido como injusto. Promotores aceitam a espera quando o fluxo de recambio e ativado com prazo claro; detratores sao os casos onde o recambio foi negado ou o fluxo nao avanca."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Pedido de rollos nao entregue ou sem prazo informado","examples":[{"id":"195a851e-53bd-4b4c-b82c-cd850327ae53","text":"No llego el pedido de rollos. Ya estamos a 18 de abril y no recibi los rollos. Muy mala"},{"id":"1fa6d6c2-1f33-45d1-acf8-578105a006e9","text":"Cuando llegan los rollos pedidos. Ya pasaron casi 20 dias. No gracias ya hable tres veces y no me dieron solucion"},{"id":"4d81f21f-98f1-4fd2-bca3-7372f66775a9","text":"Nunca me llegaron. No encuentro la opcion de tu pedido. Y como hacemos no tengo mas papel. No me dan solucion"}]},{"name":"Point comprado nao chega / entrega com atraso sem rastreio","examples":[{"id":"9636856c-244a-4b32-a1c9-d6d345bb995a","text":"Compre el point y aun no llego. El dia 28 de abril"},{"id":"37787c3a-1551-4a75-9bd8-97700ef47d45","text":"Como puedo hacer el seguimiento de la encomienda? Me refiero al envio de mi Point Smart que desde el 7 de Abril no llega."},{"id":"acb5ab6f-e4ec-4dd8-a20f-bc1f88f61fa6","text":"Q paso q no me llego. Me puede pasar el numero de seguimiento. No me llego. Muy mala"}]},{"name":"Endereco errado na entrega / compra anulada por problema logistico","examples":[{"id":"04903036-90dd-4aff-a78d-cbd0b6921dc7","text":"Lo mandaron a otra direccion y ahora la promocion no esta. Muy mala. Compre una terminal point, compra fue anulada por direccion equivocada"},{"id":"9c516394-4b87-4aef-8f71-8add7c5722f5","text":"Me lo iban a entregar y nunca llegaba porque yo no estaba, el correo le envie horarios del comercio y siempre que me lo venian a cambiar estaba supuestamente cerrado. Muy mala"},{"id":"6f2bd472-8f67-4ba2-a10d-5368b4205aaf","text":"Envio de rollos de papel del posnet. Cambiar direccion de envio. Muy mala"}]},{"name":"Dificuldade para solicitar rollos / opcao nao encontrada no app","examples":[{"id":"f61106cd-9702-40c7-906b-0a4cf5929088","text":"Quiero pedir rollos de papel. Para pedir me la sale un porcentaje del 94. Como lo compro. Muy mala"},{"id":"fc614902-5c71-4caa-8221-beb58bb7b429","text":"Solo estaba pidiendo rollos para mi Point smart me queda el ultimo rollo. No me aparece ningun boton para confirmar pedido"},{"id":"6d9c5063-c918-4180-aa99-37a6a1794bdc","text":"Necesito rollos, hace dos meses se me prendio fuego mi negocio y no me quedaron. Me dice que no puedo pedir porque tengo. Muy mala"}]}],"insight":"Os rollos de papel tem dois clusters: nao chegam apos pedido e o proprio fluxo de pedido e confuso no app. O Point comprado tambem enfrenta rastreio opaco e entregas fracassadas por endereco incorreto, com a promocao original sendo perdida em recompras. Promotores se satisfazem quando recebem um codigo de rastreio e prazo claro; detratores sao os que nao receberam resposta apos multiplos contatos."}},"MLB":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Vendas nao creditadas na conta do lojista","examples":[{"id":"6ff19eb7-de24-41df-9eb6-c8061c941050","text":"Nao estao caindo as vendas e nem os Pix diretos. Nao estou recebendo nem Pix nem cartao"},{"id":"d73b2e84-7eec-4c02-892f-20b2e080ef44","text":"Cliente fez pagamento na maquina nao caiu. Vai estabelecer quando isso?"},{"id":"d41b3d3d-3ecc-453f-80bb-12389c8543ed","text":"A transacao foi feita e descontada pelo cartao do cliente. Mas nao recebi o valor"}]},{"name":"Demora ou falha no estorno ao cliente","examples":[{"id":"b8573a11-06e9-4e62-8897-1197782b37cb","text":"porque ainda nao veio o estorno. ainda nao recebi no cartao. to precisando urgente da devolucao. Muito ruim"},{"id":"e92774bf-c434-46af-8b5b-fc4c4d2ed359","text":"Nao caiu o valor na conta, nao houve reembolso. Demora quantos dias para cair?"},{"id":"e10ddb85-b71b-4635-9a57-ea008ae5140e","text":"O reembolso nao caiu. Regular"}]},{"name":"Dificuldade em cancelar ou estornar uma venda","examples":[{"id":"000c5700-d5ce-4fda-b948-746051fba5e7","text":"preciso fazer uma devolucao parcial. na tela nao deixa editar. quero fazer o estorno parcial, apenas."},{"id":"2b48f144-b571-43ba-a7c1-94118dca718e","text":"Estornar venda. Muito ruim. Devolver dinheiro"},{"id":"c3496c23-59be-44b6-90d0-f3a8bea52b46","text":"Saiu o comprovante que foi aprovada. Vou mudar de maquina isso nao existe pois se sair comprovante de aprovada"}]},{"name":"Cobranca duplicada ou valor retido indevidamente","examples":[{"id":"676ba53e-84fe-44ce-bff3-1a0a071cc40d","text":"Quero saber por que estou passando meu cartao nas minhas vendas na maquininha e por que esta ficando retido. esse dinheiro ainda vai voltar pra mim?"},{"id":"c270b315-29dd-4cb2-a071-3cf6cdeaf7b4","text":"Cliente pagou 2x e so entrou 1x. A maquina desligou assim que aprovou e saiu da conta do cliente."},{"id":"6225d9a2-18a5-4200-8733-f431ea739ef5","text":"fiz uma cobranca no sabado e as 13:27 foi cobrado o mesmo valor so que nao foi passado o cartao. o cliente esta me cobrando o valor de 1.764,64"}]}],"insight":"Os detratores desse L2 concentram-se em dois eixos principais: dinheiro que some (vendas aprovadas que nao caem na conta do lojista) e dinheiro que nao volta (estornos com prazo indefinido ou sem confirmacao). A ausencia de comprovante claro de estorno gera desconfianca tanto no lojista quanto no cliente final, amplificando o dano relacional."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Falha na ativacao e vinculacao da maquininha a conta","examples":[{"id":"2a2db65f-2691-411d-9c39-f859cea1eb3c","text":"Comprei no Mercado Livre. Ela ja chegou eu tentando ativar. Quero ativar meu CNPJ na maquina. Muito ruim"},{"id":"faea9617-4076-45d2-b1da-eff7c92e1706","text":"O app manda escanear o Qrcode para finalizar as tarefas mas nao vai. Meu app ta preso nessa tarefa e nao consegui proceguir"},{"id":"c928a664-5db5-412d-a7a8-5bb338b3173c","text":"Nao to achando o QR code pela maquininha para cadastrar. Nao estou conseguindo achar o local onde esta conectada a antiga conta e quero desconectar para conectar a nova conta"}]},{"name":"Troca de conta vinculada a Point (conta antiga x nova)","examples":[{"id":"948cee21-0386-4f73-92ba-c7e67baa6c32","text":"Queria muda a conta da maquininha. Nao aparece troca conta. Nao consigo. Em nenhum lugar tem sair/ou encerrar"},{"id":"71cd0429-f4ad-4494-9e61-05648f4ea5a4","text":"Preciso tirar uma conta antiga da minha point e conectar uma nova conta. A minha senha ta bloqueada. Muito ruim"},{"id":"567df05a-387f-44f1-b617-de04244bd899","text":"Chip foi cancelada. Chip bloqueado. Eu tenho problemas com minha Point Pro 2"}]},{"name":"Problemas com senha e acesso a maquininha","examples":[{"id":"27eec0d9-355b-483e-8c86-eb854781b4ae","text":"Esqueci a senha. Eu nao sei a senha, eu esqueci a senha. Muito ruim"},{"id":"42010f6f-bbe1-4c46-a232-1bc9c53dd76e","text":"Nao sei do usuario e senha. Esta pedindo usuario e senha. Nao estou conseguindo"},{"id":"8ca4c4ba-5f94-469d-86e2-caf4ba108dc2","text":"Como faco para alterar a senha da minha Point Smart?"}]},{"name":"Maquininha nao aceita vouchers e bandeiras especificas","examples":[{"id":"bf356e69-c690-4da6-aa9d-3b389146567c","text":"Aceitar vale refeicao. Nao quero gastar mais com maquina. Muito ruim. Nao respondeu o que eu estava pedindo, passando uma informacao errada."},{"id":"1d894843-7472-4881-ab7f-23b1c708cbdf","text":"Quero passar voucher. Muito ruim"},{"id":"cb5d6b18-7f03-4012-97e5-44a429037ae3","text":"Qual maquininha aceita o cartao flash? Maquininha que aceite todos os cartoes alimentacao e refeicao. Muito ruim"}]}],"insight":"O fluxo de ativacao e configuracao inicial da Point e o principal gerador de frustracao neste L2: o processo de vinculacao via QR code frequentemente falha ou nao e encontrado pelo usuario, resultando em maquininhas compradas e inutilizadas. A troca de conta vinculada e outro ponto critico, pois a interface nao oferece um caminho claro para desvincular a conta antiga. A automacao atual cobre apenas casos triviais, deixando os cenarios de setup e migracao de conta sem suporte adequado."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Cartao recusado pelo sistema de seguranca sem justificativa clara","examples":[{"id":"945c09aa-1898-4e3d-b685-9b98fc32812a","text":"Todos os valores que eu estou passando na maquina de cartao esta sendo recusado. Perdi vendas hoje por esse motivo."},{"id":"1eb868da-b215-46c5-b17c-7775cb909bcd","text":"to tentando vender e voce recusando um cartao que esta ok e ativo. o teu concorrente aceita vou passar no infinity pay. preciso vender o cartao esta ativo ontem funcionou"},{"id":"97b40b1d-f320-4fc0-abec-d6e015d4fb94","text":"Cartao nao passa, diz que este cartao nao passou pelo sistema de seguranca. Bloqueio de seguranca"}]},{"name":"Falha no Point Tap - nao processa ou nao ativa","examples":[{"id":"901bdd64-3665-44be-bcb8-2b2b5b000b83","text":"Nao consigo cobrar com tap, fala pra fechar aplicativos abertos. Fiz todo o procedimento e mesmo assim nao quer cobrar. Muito ruim"},{"id":"c8f813ca-e2c8-4368-935f-657650322328","text":"Nao estou conseguindo cobrar com point tep. Aparece que em 30 segundos iria pedir para aproximar o cartao no telefone mas nao sai disso. Muito ruim"},{"id":"102b24ad-f349-4b4d-a9ba-361c29bb370b","text":"Aparece, mas quando coloco o valor rejeita o recebimento. Nao aparece o tap to pay no iphone. Muito ruim"}]},{"name":"Maquininha nao processa pagamento - erro generico ou travamento","examples":[{"id":"392274ee-6bba-434d-a5da-44576c361f75","text":"Toda cobranca que faco da essa mensagem, trocamos varios cartoes, chega ser um incomodo e tenho que ser obrigado a usar outro aplicativo."},{"id":"aa6e4f6f-d5fc-4175-bbdb-35d46d230841","text":"Nao esta processando o pagamento. Aparece a mensagem: NAO FOI POSSIVEL PROCESSAR O PAGAMENTO."},{"id":"78375599-5490-43b4-891e-ea75681aabbc","text":"Estou com mesmo problema e nao consegui fazer minhas vendas. Ja esta tudo configurado. Ja atualizei. Ele trava antes."}]},{"name":"Bandeiras e cartoes especificos nao aceitos (estrangeiros, alimentacao)","examples":[{"id":"75be5d0e-0b5b-4dc2-a43e-fc2ed3321715","text":"Minha maquininha nao aceita cartao estrangeiro. Esses cartoes passam sem problemas em outros lugares. Ja cansei, perdi muitas vendas no verao"},{"id":"bdd334c3-e33a-4cb7-9edf-9a5208b2a0ab","text":"Nao consigo fazer cobranca com o cartao da caixa. ontem a noite eu consegui fazer a cobranca."},{"id":"aae4de19-54d9-4d7a-b22b-a4653647622b","text":"Nao estou conseguindo receber pagamento pelo tap, com cartao do proprio mercado pago. Por que esta barrando os pagamentos vindos desse cartao?"}]}],"insight":"As recusas de cartao por motivo de seguranca sem explicacao clara sao o maior driver de insatisfacao neste L2, frequentemente levando o lojista a migrar para concorrentes no ato. O Point Tap concentra falhas de usabilidade, especialmente no iPhone. Comparando com promotores, fica claro que o problema e intermitente e contextual, o que dificulta a resolucao e aumenta a desconfianca."},"Point reader hardware faults and RMA":{"n_detratores":35,"n_promotores":20,"categories":[{"name":"Maquininha nao liga ou nao carrega a bateria","examples":[{"id":"685c0fc2-c2a6-4760-917d-fdc8973337fb","text":"Nao esta carregando. Ja tentei em todas tomadas nao esta carregando. Gostaria de trocar. Muito ruim"},{"id":"59e8848e-8932-4992-bad7-8f1b6e46f0cb","text":"Nao liga. Ela ja passou 4 horas carregando, e depois dessa carga nao acendeu nada. vou procurar outra empresa de maquininha!"},{"id":"f31636d1-3f58-4504-a081-60c1758e5959","text":"Nao esta carregando. Liga, mas nao carrega a bateria. Quando tira o cabo desliga. Muito ruim"}]},{"name":"Falha na leitura de cartao (chip, tarja ou aproximacao)","examples":[{"id":"911e0c49-cb66-4dac-a83e-a6a35743b2c4","text":"Nao le o cartao. Na tarja e nao aparece nada. Aproximacao funciona sim so o chip nao le"},{"id":"3f401efa-3b84-4af9-ac86-306873b48b92","text":"Nao esta fazendo leitura dos cartoes. Nei uma forma nao esta lendo. Ja fiz esse teste por 2 vez. Muito ruim"},{"id":"d1118721-7a4a-4641-b05d-69c6b7e81da2","text":"Chip nao esta lendo. Nao reconhece o cartao inserido."}]},{"name":"Tela ou teclado com defeito fisico","examples":[{"id":"c32e2f69-2027-4188-bf68-dfabe6b97f33","text":"Maquina quebrada. A tela nao esta funcionando. O toque nao responde. Continue travado. Muito ruim"},{"id":"e83866ce-8112-4ae2-b891-9f2c5793e599","text":"ela nao amostra o teclado. o botao de ligar ta muito ruim e nao aparece o teclado. Muito ruim"},{"id":"bb1cec76-eb1f-49f4-9386-0053a19df292","text":"Minha point pro 2 liga mas nao funciona. Fiz o procedimento de 20 segundos e continua aparecendo Gertec."}]},{"name":"Processo de troca (RMA) lento, burocratico ou sem retorno","examples":[{"id":"f52b229a-cd29-4280-a929-5d601bce74ad","text":"Nao liga. Vcs tem algum representante. a gente so usa essa dai e vai ser o jeito e usar a outra operadora. Muito ruim"},{"id":"bf3be3d8-a3af-44e3-a433-69f3ab2a1fbd","text":"Absurdo, comprei ela, uso a muito tempo, ta conservada e agora para de funcionar e voces nao podem trocar? Vou parar de usar o mercado pago. Muito ruim"},{"id":"4bb357e8-7ba0-4e98-a457-ea2e05d545d7","text":"Fazer troca point pro 3 terminal bloqueado chaves. Troca em garantia. Muito ruim"}]}],"insight":"Problemas de bateria e falha na leitura de chip sao os defeitos fisicos mais frequentes. O processo de troca (RMA) e percebido como lento e sem visibilidade: lojistas ficam sem maquina durante dias, perdendo faturamento. Promotores que relataram defeitos similares sairam satisfeitos quando o RMA foi iniciado rapidamente e com clareza sobre prazos. O principal gap e a comunicacao proativa durante o processo de troca, nao o defeito em si."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":34,"n_promotores":20,"categories":[{"name":"Pedido de bobina bloqueado ou controle de estoque incorreto","examples":[{"id":"42d0d387-a663-45cb-8d40-5c62c843fef5","text":"to querendo pedir essas bobinas, porque ja tentei aqui pela maquininha e nao consegui. Eles fala que eu to com estoque de bobinas, sendo que eu to zerado"},{"id":"db067830-70bb-4c76-969a-a22339fb8335","text":"So tenho 01 bobina, que esta em uso. Seu controle esta incorreto quando afirma que ainda nao alcancei 50% de uso das bobinas para poder solicitar mais"},{"id":"d789ab4f-1bc8-429c-8056-6f0437280d49","text":"Estou sem bobinas, e no aplicativo fala que eu ainda tenho 50%."}]},{"name":"Entrega nao recebida ou sem rastreamento visivel no app","examples":[{"id":"b5cfe720-9a5c-4033-bee9-994d465b39ee","text":"Comprei uma point, diz que chegou mas nao recebi. O entregador nao coloca o nome de quem recebeu a mercadoria. Muito ruim"},{"id":"21419d62-f9f5-4722-bd11-d1827badd397","text":"Nao recebi minha maquina ainda. Nao consigo ver. Estou precisando urgente dessa maquina. Muito ruim"},{"id":"55cd578b-f693-4127-92ba-4fa454c439e5","text":"Muito ruim. Nao obtive informacoes reais quanto a entrega do meu pedido"}]},{"name":"Cancelamento de compra e devolucao da maquininha","examples":[{"id":"1bdb604e-0b60-4111-8f33-7e899fdf2e41","text":"Quero meu dinheiro de volta e nao quero essa maquininha. Eu acabei de comprar, eu nao quero mais, por favor devolve meu dinheiro. Muito ruim"},{"id":"8c0a23e5-9f6e-4470-8acd-317bd30dae68","text":"Comprei uma maquina veio quebrada! Nao consigo ir ao correio. Estorno do dinheiro! Muito ruim"},{"id":"eef3020c-87d9-4daf-801f-e4d33789abf3","text":"Quero cancelar a compra da maquininha. Precisam cumprir com o que se propoem a fazer"}]},{"name":"Endereco de entrega errado ou impossivel de alterar","examples":[{"id":"07f22ab0-8c90-4925-8d29-424db530de06","text":"Preciso alterar o endereco de entrega da maquininha. Eu nao conheco esse endereco. Quero cancelar a compra. Muito ruim"},{"id":"bd144286-d79c-420d-9d9a-02e8eb57efb1","text":"Endereco da troca errado. Estava com o endereco de entrega errado e nao deu a opcao de modificar o endereco"},{"id":"9f5861a5-f64e-4e94-9628-11f1bfbb0e5c","text":"Alterar endereco de troca. Alterar endereco. Muito ruim"}]}],"insight":"O controle automatico de estoque de bobinas e o tema mais recorrente e especifico deste L2: o sistema indica que o cliente ainda tem bobinas disponiveis quando na pratica esta zerado, bloqueando a solicitacao de reposicao. Problemas de entrega, impossibilidade de alterar endereco de entrega e dificuldade de cancelamento sao os outros eixos principais."}},"MLC":{"In-person payment reconciliation and refunds (Point)":{"n_detratores":12,"n_promotores":14,"categories":[{"name":"Pagamento nao registrado ou ausente no app","examples":[{"id":"b7e28d2c-0610-4a01-aba6-987d8bd2162d","text":"No me aparece nada en la aplicacion. Me aparece solamente el monto que tenia que eran de 10.000 pero no me aparece el monto actual."},{"id":"98f3d064-42e6-4878-84d5-242675fbd715","text":"Hola ayer me hicieron una compra de 21800 pesos me pagaron con el telefono la boleta salio pero en la aplicacion del telefono no aparece"},{"id":"f05a111f-414b-4844-81b8-57857a50f9cc","text":"mi maquina no me entrega el baucher del dia 28 al finalizar el dia, osea el resumen total. Si entre al historial y no aparece ese dia"}]},{"name":"Cancelamento indevido ou erro no tipo de pagamento registrado","examples":[{"id":"fc98ee4d-656a-4c35-85a5-9cbc0b4c46ef","text":"Realice mal un cobro con la maquina point, fue una transferencia electronica. Hice la boleta pero puse afecto de IVA y nosotros estamos exentos de IVA por ser servicio de salud"},{"id":"e940b8b3-3c1c-4e46-bf8b-185c93b92863","text":"En la maquina sale que yo hice el pago en efectivo y yo no lo he hecho en efectivo ese pago, lo hice con tarjeta. Y queria saber como se soluciona el tema cuando pasa eso con la maquina porque no deberia pasar eso."},{"id":"a6f08e9e-39fe-4a5c-9cdb-6aa1f67b3d1a","text":"Cancele por errro era venta. Mi cliente dice que no recibio el dinero"}]},{"name":"Pagamento retido ou nao liberado","examples":[{"id":"3f781941-5859-4c51-85be-14f5f74c4e91","text":"hay alguna posibilidad de que en algun momento se libere el pago? eso fue hace varios dias, y su banco les dice que la venta si se hizo que hago ahora?"},{"id":"cb25a44a-52f1-4b9b-90ba-2cc14a6e77c6","text":"Por que no me esta llegando el dinero de las ventas de hoy. Todo lo de mercado pago esta. Incluso no me quiso dar el cierre el pinito."},{"id":"ff14ea5a-f073-407b-b9f3-ac29092727e0","text":"Y por que me descuentan todos los meses 22.500. Pero si me sale que me descuentan dinero para MP operadora"}]},{"name":"Dificuldade para emitir ou imprimir voucher/vale de devolucao","examples":[{"id":"0c9c5d02-e11f-4774-bc60-2a33a1982eda","text":"como imprimo el vale de devolucion. necesito imprimir un vale de devolucion. no funciona"},{"id":"86efa7a9-aefb-424e-aa29-0d1bfa305ee8","text":"No puedo hacer cobros con la maquina de mercado pago. No afraferidos los cobros de hoy a mi cuenta no se que hacer"}]}],"insight":"Os detratores deste L2 concentram-se na falta de visibilidade das transacoes no aplicativo e em erros no tipo de pagamento registrado (ex: venda com cartao aparecendo como dinheiro em especie), indicando falhas na conciliacao em tempo real. A demora na liberacao de valores retidos e um segundo ponto critico. Os promotores resolvem duvidas sobre prazos e confirmacoes: reforco que quando o suporte explica o fluxo claramente, a percepcao muda."},"Point account and entitlement management (linking, ownership, vouchers)":{"n_detratores":18,"n_promotores":20,"categories":[{"name":"Impossibilidade de emitir boletas / habilitacao fiscal bloqueada","examples":[{"id":"a429921f-1fb1-4367-9880-66208bd6b25a","text":"Si ahora no puede hacer boletas y tengo plata. No he podido solucionar el problema. No puedo hacer boletas en efectivo. La opcion desaparecio y no puedo emitir boletas"},{"id":"84d154ff-21d2-47fa-a39d-4216cfe3a4fb","text":"Necesito activar la opcion de hacer boletas con mi maquina. Ya hice eso y nada"},{"id":"ca592e66-0854-4e96-bd21-31664a6652a3","text":"Hice cambio en el nombre de la maquina. Ya lo hice pero no se refleja en la boleta. Solo me sale estamos revisando este dato"}]},{"name":"Vinculacao incorreta ou impossivel da maquina a conta/RUT","examples":[{"id":"964babfa-bccf-4884-8d34-832f5b045155","text":"Compre la smart point 2 y se realizo mal. Era a otro rut asociado a un negocio y quedo asociado a mi rut. Se puede anular la compra o cambiar el rut. No obtuve solucion."},{"id":"a11750a9-c65f-48ba-8585-cfe28550235a","text":"Necesito apagar la maquina para poder vincularlo con la nueva cta empresa pero me solicita un codigo pin para poder apagarla. Por que no logro encontrar la solucion"},{"id":"2e6683f3-6e27-4d54-b146-526fb24d5c7f","text":"Compre una maquina mercado pago para cobros la cual quiero entregar a mi madre para el negocio. Me dice ahora que eso no es asi. Quiero que me devuelvan el dinero."}]},{"name":"Meios de pagamento especificos nao habilitados (Pluxee, Junaeb, Edenred)","examples":[{"id":"c471a42f-6176-4a82-92cd-8b73811fcd5c","text":"Es redelcom mi pos. Hasta el 20 de marzo cobre con este pos. El pos que tengo me funciona con tarjeta, pero no con Pluxee. Ahora me puedes cambiar la maquina?"},{"id":"0555294d-8a5f-4c13-8a6e-13f9e49ea262","text":"Necesite saber como cobrar con tarjeta edenred"},{"id":"1b58d998-270b-46f9-bb50-104c72581cba","text":"Instalar la app en la maquina mercado pago Point 2. No se ha instalado la app. Realice todos los pasos pero no me toma Toteat."}]},{"name":"Autenticacao e configuracao recorrente obrigatoria (QR, PIN, acesso diario)","examples":[{"id":"fb4aedf1-ef7b-423e-88ad-435d7941534a","text":"La maquina me pide todos los dias escanear el codigo QR cada vez que la prendo lo que es un problema porque yo no siempre estoy presente para prenderla"},{"id":"1ba5efd5-febb-4ac3-a905-0a5851a6275f","text":"Necesito recuperar el dinero de la venta que no me aparece creo que se esta yendo a otra cuenta. Incluso las ventas de ahora no me aparecen en el point. Dice generando ganancias"},{"id":"b2406d53-0813-49e1-a289-1d389cbf9e4e","text":"No se conecta a internet. Ya reinicie y me conecte a mi WiFi de mi cel. Si se conecta pero no me deja cobrar. No aparece nada"}]}],"insight":"Os detratores deste L2 revelam que problemas de configuracao de conta e habilitacoes bloqueiam diretamente a operacao comercial: emitir boletas, aceitar meios de beneficio (Pluxee, Junaeb) ou vincular a maquina ao RUT correto sao acoes que o vendedor espera realizar sozinho, mas encontra barreiras tecnicas sem resolucao no suporte. A desinformacao na venda original (ex: maquina comprada com RUT errado por indicacao de executivo) e um gatilho central de insatisfacao."},"Point payment acceptance and usage (risk, methods, fees)":{"n_detratores":34,"n_promotores":20,"categories":[{"name":"Rejeicao de pagamentos por controles de risco sem explicacao","examples":[{"id":"89b803ff-0400-4c81-8aa3-2c3b852a8992","text":"La maquina rechazo una venta de 68.800 por medidas de seguridad y la tarjeta del cliente no tiene problemas en otros negocios. No quiero perder la venta"},{"id":"b21379a3-d265-4d5d-9737-0dfe19f345b9","text":"No creo, me parece poco probable que tenga la misma falla las tres personas. Yo creo que es la maquina que esta dando problemas. Tengo un vecino que tiene la misma maquina."},{"id":"33f0e83a-4158-4454-90c4-3d64baae9dc6","text":"Seguimos con los problemas para cobrar. Aparece nuevamente con rechazo montos altos. MercadoPago es solo para montos bajos. Buscaremos otro proveedor."}]},{"name":"Maquina sem processar nenhum pagamento (sistema fora do ar)","examples":[{"id":"984438fe-db38-4654-843a-18acc6f00b12","text":"Se cayo el sistema. Ninguna tarjeta sirve. Me aparece eso cada rato. En la app tambien tengo problemas. Es un almacen se cobra con la maquina en todo momento."},{"id":"ee06a7b1-08c1-4bcc-83e9-8dbb3dc03848","text":"Mi problema con las dos maquinas todavia no tienen solucion. Hoy dia he perdido muchas ventas. Manana debe estar solucionado, sino para que retiren sus maquinas."},{"id":"1ae37eb7-1cd2-4a31-a2fe-a0f0ff78e2e7","text":"No funcionan mis maquinas. No cobran. Arreglen las maquinas. Necesito cobrar en mi negocio"}]},{"name":"Rejeicao recorrente de cartoes especificos causando perda de vendas","examples":[{"id":"dca22403-0806-422b-9780-19a44867d0b7","text":"La maquina me recibe cuando quiere los pagos de esa tarjeta. Me acepta la venta y despues a los 5 minutos me rechaza otra venta. Tendrre que cambiar la maquina si me sigue pasando."},{"id":"458aa0d4-0fb5-42fc-a7b0-068d7a93554f","text":"No me pasa los pagos sale intente con otra tarjeta. Dice intentar hacer el cobro de nuevo. Aun no funciona he perdido ventas."},{"id":"311faa07-5a15-43de-a292-4067a745061d","text":"Porque la maquina no acepta mas de 2 pagos con la misma tarjeta. Dice pide al cliente que pague con otra tarjeta o reintentar"}]},{"name":"NFC / pagamento por aproximacao nao funciona","examples":[{"id":"eca3ac15-7d2c-4c21-b231-a0fb512b9687","text":"No puedo pagar con el celular NFC. Da error en el comercio en maquina getnet"},{"id":"45b5d970-405e-4400-9030-f6f9e1eb7bbc","text":"No puedo pagar con mi telefono. Al acercar el celular a la maquina me aparece esto"},{"id":"0a2399f3-be69-4cf1-ab4d-bafc08aa10dd","text":"No me deja pagar con el sin contacto"}]}],"insight":"Este e o L2 com maior volume de detratores (34) no MLC. O padrao dominante e a rejeicao de transacoes por controles de risco opacos: comerciantes perdem vendas sem entender o motivo e o suporte nao consegue reverter a situacao em tempo real. Os promotores, mesmo neste L2 critico, ficam satisfeitos quando ha comunicacao proativa sobre instabilidades do sistema."},"Point reader hardware faults and RMA":{"n_detratores":31,"n_promotores":20,"categories":[{"name":"Maquina nao liga ou tela apagada / travada","examples":[{"id":"f19354de-fc70-46b9-8331-513a2c735046","text":"La maquina no prende. Sigue sin prender. Definitivamente no prende. Anoche funcionaba bien."},{"id":"29bc78e4-d928-4112-a9e3-a7707bfbc1bc","text":"Problemas con mi maquinita necesito un tecnico. No se prende la pantalla."},{"id":"13aace5d-4108-4374-97a4-7af3e18ef490","text":"Mi maquina de mercado pago presenta fallas. No cobra. Se pega. Cargando."}]},{"name":"Falha de bateria / problema de carregamento","examples":[{"id":"14b51114-9cfe-4992-9666-d052909c9a3c","text":"Mi maquina no carga, indica que las baterias estan mala. Estubo cargando toda la noche y aparecio sin carga. Necesito cambio de equipo o reemplazar las baterias."},{"id":"7b809d5c-3d42-40a7-8a73-c6fc84240fd5","text":"Tengo malo el cargador de la maquina. Aparece la senal pero no carga. La solucion que me dijeron es que solo me queda comprar una nueva. Con SUMUP no dudaban en cambiarla."},{"id":"abf10ba8-4579-4976-bbbd-bb2e656b98fb","text":"La bateria de mi maquina no carga. Ya espere todas las horas. Hice todos los pasos y la maquina no carga."}]},{"name":"Processo de troca (RMA) lento, burocratico ou recusado","examples":[{"id":"550eaf58-a9c7-484e-892e-4b2e5ed57c43","text":"Ya llevo 3 dias desde el sabado con problemas que no pasa ninguna tarjeta. Yo compre esa maquina y llevo muy poco tiempo usandola debe tener alguna garantia."},{"id":"20209511-1450-4c32-a94e-53ca80ec30e1","text":"Se queda pegado y no toma pagos. Me cambiaron una maquina que venia con problemas de botar el papel, queda atascado."},{"id":"ea24ba07-1cb7-4c7e-90f6-219a3310b351","text":"Como voy a devolver el lector. Y como trabajo si es un minimarket. No me puedo quedar sin pos. Ya que no hay solucion me tendre que cambiar de empresa."}]},{"name":"Falha de som na confirmacao de pagamento","examples":[{"id":"6b7a3b77-ec37-44a1-8a84-123f1cd34c1f","text":"No me genero sonido al confirmar el pago. Ya lo reinicie, hice pago de prueba y no sono al realizar el pago. Solo emite sonido al ingresar clave pero para los pagos no genera pitito."},{"id":"00c8c10b-c760-4256-8c5e-14c2c9341854","text":"Mi maquina no suena. En todo cuando se hace el cobro y se teclea. Aun no suena la maquina."},{"id":"0f8ecb26-340e-4b7c-8c56-90e699b7adc9","text":"Tengo problemas con el sonido de la maquina. Falla solamente cuando el pago esta okay no suena el sonido de mercado pago. Sigue sin sonar."}]}],"insight":"Com 31 detratores, este L2 evidencia que falhas fisicas recorrentes no hardware geram impacto direto na renda do comerciante. O processo de troca (RMA) e um agravante critico: comerciantes relatam negativas de garantia mesmo com equipamentos recem-comprados e com defeito, gerando comparacoes explicitas com concorrentes como SumUp. A falha de som na confirmacao de pagamento e um padrao emergente apos atualizacao de firmware."},"Shipments, deliveries, and returns for Point purchases and consumables":{"n_detratores":11,"n_promotores":20,"categories":[{"name":"Entrega atrasada ou sem informacao de horario/rastreio","examples":[{"id":"5e752cba-566b-4e7d-9781-5cd9bbc7df15","text":"No llega mi point. En camino. Me estoy arrepintiendo de esa compra. Ya eran las 7 pm del 5 y no llego nada."},{"id":"5e8a1bf0-a4c9-4b23-b8bb-590618695c85","text":"Quiero saber por donde viene mi pedido. Hay algun numero de contacto para hablar con el chofer. A que hora estara aqui en mi domicilio."},{"id":"bcaece64-1d37-4051-9ebc-71d79e2e596f","text":"Quedaron de venir entre el 11 y el 13 de abril a entregar una Smart point nueva a mi negocio y no se han contactado conmigo"}]},{"name":"Cancelamento / devolucao da compra bloqueada ou sem suporte","examples":[{"id":"a98173d5-c0fd-496d-bdbe-c8ef41bbb150","text":"Hola necesito anular la compra de la maquina point. Me puede ayudar para hacer una devolucion? Como debo hacerlo?"},{"id":"c148316e-1a49-461d-8c88-b1c554b02aa6","text":"Como puedo solicitar otra maquina por fallo. Pantalla y problemas en impresion. Necesito contactarme con un asistente."},{"id":"ac73b97b-22c0-450f-8d81-186a99ca8bac","text":"Reagendar entrega. Como dejar un mensaje para la entrega de la compra. Que alternativas tengo?"}]},{"name":"Endereco de envio incorreto / rollos enviados para local errado","examples":[{"id":"8afcf3d4-4cf0-4d52-888e-6a07ee5dddfa","text":"Quisiera solicitar rollos. La direccion a la cual enviaron esta mala."},{"id":"361ce195-047f-4283-a912-ce02cee38726","text":"Necesito rollos de papel. A me lo ofrecieron gratis hace un mes mas o menos."}]},{"name":"Dificuldade para emitir nota de credito / anular boleta pos-venda","examples":[{"id":"256819bf-1cbb-4e24-bb59-cac8ec20c793","text":"Necesito aqui por la aplicacion, no se donde esta la opcion de hacer una nota de credito, ese es el tema, no la puedo encontrar. Ahora en la web y no me permite hacer la nota de credito."},{"id":"5e8a1bf0-a4c9-4b23-b8bb-590618695c85","text":"Quiero saber por donde viene mi pedido. Muy mala. A que hora estara aqui en mi domicilio."}]}],"insight":"Este L2 tem o menor volume de detratores (11), mas o contraste com promotores (20) e revelador: a maioria dos promotores resolve facilmente pedidos de rollos ou devolucao, enquanto os detratores travam em fluxos de entrega opacos (sem ETA, sem contato com transportador) e cancelamentos que exigem suporte humano. A falta de rastreio em tempo real com janela horaria e o principal driver de frustracao."},"OUTROS":{"n_detratores":36,"n_promotores":44,"l2s_incluidos":["Cellular/SIM connectivity in Point devices","Fiscal receipt/invoice service activation and configuration (SII and receipts)","Shipments, deliveries, and returns for Point purchases and consumables","Redelcom/Smart POS operations and migration (Chile)"],"categories":[{"name":"Falha de conectividade do dispositivo","examples":[{"id":"17996d4e-a0d7-4afb-9cac-0e2e4e1aa539","text":"No tengo internet con el chip. Con WiFi funciona. Dice que no tiene internet. Ayer vino uno a arreglar pero sigue igual. Muy mala"},{"id":"aec4fb6c-5de7-40e4-9e1e-fc3484900310","text":"Sigue sin funcionar 4g. No tengo cobertura. No funciona el nuevo chip. Ya hice todo. Y no funciona el chip en mi sector solo funciona claro"},{"id":"5e9d0b2d-f882-4f42-8bb5-534c48d4e240","text":"La maquina me sale con mensaje de error de comunicacion no se pudo realizar la transaccion. Actualice maquina y nada. Me dice hubo error en actualizacion"}]},{"name":"Problemas com emissao de boletas fiscais","examples":[{"id":"ef00c944-5555-4766-af23-dc93a515c3e7","text":"Nesecito urgente un tecnico se fue la opcion efectivo y no esta dando la boleta. No puedo dar boleta. Cuando viene alguien a solucionar este problema. Llevo 2 dias asi"},{"id":"9a8ea866-3da4-466a-9d5f-38c07d7e655c","text":"No me deja emitir boleta en mi points. Necesito emitir boleta. De Sii boletas gratis. Necesito ayuda. Muy mala"},{"id":"e1dc67f0-00bc-4875-ad4c-2c896fad18ac","text":"No me sale el point de pago en efectivo. Necesito ayuda, ya que no me sale el point de pago en efectivo"}]},{"name":"Falhas na entrega e logistica","examples":[{"id":"5e752cba-566b-4e7d-9781-5cd9bbc7df15","text":"No llega mi point. En camino. Me estoy arrepintiendo de esa compra. Ya eran las 7 pm del 5 y no llego nada"},{"id":"8afcf3d4-4cf0-4d52-888e-6a07ee5dddfa","text":"Quisiera solicitar rollos. La direccion a la cual enviaron esta mala"},{"id":"bcaece64-1d37-4051-9ebc-71d79e2e596f","text":"Quedaron de venir entre el 11 y el 13 de abril a entregar una Smart point nueva a mi negocio y no se han contactado conmigo. Regular"}]},{"name":"Suporte digital insuficiente — exige tecnico ou atendimento humano","examples":[{"id":"1e194f8a-f97f-4b03-b128-10fd9c9a4ddd","text":"Necesito un asistente que venga aca a mi local. Porq no me llamas mejor. Tengo problemas con la maquina no da la boleta"},{"id":"8395b88d-d955-48eb-bc6f-faeafe179b35","text":"No puedo hacer boleta. Ya lo hice no funciona me podrias mandar el tecnico. Quiero hablar con un ejecutivo"},{"id":"c148316e-1a49-461d-8c88-b1c554b02aa6","text":"Como puedo solicitar otra maquina por fallo. Pantalla y problemas en impresion. Muy mala. Necesito contarme con un asistente"}]}],"insight":"O grupo Outros do MLC concentra dores operacionais criticas que o canal digital nao consegue resolver de forma autonoma: falhas de conectividade SIM/4G persistentes mesmo apos troca de chip, bloqueio na emissao de boletas fiscais (especialmente a perda do icone de pagamento em dinheiro), e entregas sem rastreamento em te
